/dzrknn_dataprocess:
  ros__parameters:

    # -------------------------------------------------------------------------
    #  扫描姿态
    # -------------------------------------------------------------------------
    scan_yaw_min_deg: -150.0       # ★t25 用户指令：巡航范围左右各 150°
    scan_yaw_max_deg: 150.0        # ★t25：旧值 -160.0/+10.0（非对称，第一趟要横跨 170°）已弃用
    #   ⚠ 连带影响（写进 t25 报告）：scan_yaw_min/max **同时**被 TRACK 的
    #     `clampYawToScan()` 当作"跟踪水平允许范围"。±150° 在机械极限内
    #     （`gimbal_yaw_tick_min/max` = 100..3995 ⇒ 相对正前 2047 约 -171°..+171°），
    #     故跟踪时的水平伺服范围也一并放宽到 ±150°（对"目标跑到侧后方"的场景是好事，
    #     但意味着跟踪可以做更大的偏转 —— 若现场发现跟踪摆幅过大，再单独加跟踪限幅参数）。
    # ★俯仰基准角（度）。约定：负=向下压，正=抬头。
    #   ⚠ 下面这行历史上注释写的是 -26（第六次下压），但实测值早已被改成 +6.0，
    #     注释与值长期不符，是这次"云台追不上地面靶"误判的直接原因。
    #   2026-10-03 起：跟踪模式已改走机械限位（不再被本值钳住）；
    #     但【扫描模式】仍以本值为基准 —— 若扫描时看不到地面靶，
    #     把本值改回负数（-20 ~ -26 之间试），不要盲调 tracking_pitch_margin_deg。
    scan_pitch_offset_deg: +10.0   # ★t52 用户指令（2026-10-14）：水平扫描向下压约 10°；★2026-10-15 现场实测：-10.0 实际【向上抬】（符号约定反了）⇒ 改 +10.0
                                   #   【符号约定：负 = 向下压，正 = 抬头】——与 C++ 侧注释和 scanPitchDeg() 一致。
                                   #   沿革：+6.0 →（2026-10-11 t25"复位水平"）0.0 →（本次）**-10.0**。
                                   #   本值是扫描模式的俯仰基准：实际俯仰 = scan_pitch_levels[i] + 本值（cpp:474）。
    #   ★ 配合 C++ 侧 t25 改动：startScan() 先走"归位段"（目标 yaw=行程中点=0°、pitch=基准），
    #     归位到位或超时（scan_home_timeout_ms）后才开始第一个横扫点。
    # ★★ 多层俯仰扫描（本次新增）★★
    #   踩过的坑：原来扫描只在 pitch = 0 + (-8°) = -8°，而靶在 0.35m 外的地面上，
    #   需要的俯角约 atan(0.30/0.35) ≈ 40° —— 靶直接掉出画面下沿，
    #   云台只能偶尔瞄到一点（日志里"发现目标"之后马上"脱离视野"）。
    #   现在让扫描【每扫完一趟就换一层俯角】，把近处地面也扫进来。
    #   ★ 这个参数以前根本没法配：launch_ros 不接受 Python list
    #     （写 [0.0] 会抛 "Unrecognized data type: <class 'list'>" 导致节点起不来）。
    #     改用 params YAML 之后，原生列表终于可用 —— 这是配置中心的直接红利。
    #   列表里每个值是一层的角度(相对水平，上为正)，会再叠加 scan_pitch_offset_deg。
    scan_pitch_levels: [0.0]        # ★只做水平扫描（取消多层俯仰）
    scan_yaw_dirs: 8               # (兼容保留) 旧逐点扫描的点数，连续扫描下不参与计算
    scan_dwell_ms: 300             # 每个点最短驻留(ms)
    scan_passes: 2               # 一轮 = 左一趟 + 右一趟（射击点连做两轮）
    # ★t25 用户指令：连续扫描（scan_request>=2）最多 3 轮，3 轮仍未找到目标 ⇒ 自动回 IDLE 归位，
    #   不再无限往复扫（旧版 scan_continuous_ 无轮数上限 —— 现场表现为"云台一直在转"）。
    #   <=0 = 不限（旧行为，可回退对照）。单次扫描（scan_request=1）不受本参数影响，仍按 scan_passes 趟。
    scan_continuous_cycles: 3
    # ★t25：进入扫描前的"归位段"超时（ms）。归位目标 = 正前方(yaw=0)+水平(pitch=基准)；
    #   到位判据用 scan_arrive_tol；电机卡住/反馈缺失时按本超时兜底放行，绝不永远不进扫描。
    scan_home_timeout_ms: 1500
    scan_arrive_tol: 30            # 到位容差(刻度)

    # -------------------------------------------------------------------------
    #  速度体系
    # -------------------------------------------------------------------------
    patrol_speed_ratio: 0.30       # ★2026-10-14 用户指令：扫描速度 = gimbal_max_speed × 0.30（60% 太扫太快锁不住靶，第3趟 0 开火全因"目标丢失·闭锁"）
    gimbal_max_speed: 3700         # 云台最大转速(刻度/s)
    track_speed_max: 2000          # ★t55 v3：500→2000（kp15 需要速度空间表达；≈176°/s）
                                   #   ★2026-10-14 与 patrol 解耦：跟踪上限钉在旧 0.6×0.63×3700≈1399 刻度/s，防"降扫描速度拖累跟踪"
                                   #   （原 0 = 按 patrol_speed_ratio 派生；0.30×0.63×3700≈700 会跟不上靶）
    track_speed_max_ratio: 0.63    # 跟踪上限 = 巡逻速度 × 该比例（仅 track_speed_max=0 时生效）

    # -------------------------------------------------------------------------
    #  主循环频率（流畅度）
    # -------------------------------------------------------------------------
    #  自适应：跟踪时保控制精度，扫描/空闲时降频省算力，把 CPU 让给 RKNN 推理。
    #  注意：丢帧计数都在【视觉回调】里按 30Hz 视觉帧自增，与本循环频率无关，
    #        所以降频不会改变 lost_frames_to_rescan 的时间含义。
    loop_hz_track: 100             # 跟踪时主循环频率(Hz)
    loop_hz_idle: 50               # 扫描/空闲时主循环频率(Hz)

    # -------------------------------------------------------------------------
    #  云台刻度标定（改错会导致云台撞限位或反向，动前先备份）
    # -------------------------------------------------------------------------
    gimbal_center_tick: 2047       # 零位(正前方/水平)刻度
    yaw_ticks_per_deg: 11.378      # 水平 刻度/度 = 4096/360
    pitch_ticks_per_deg: 11.378    # 竖直 刻度/度 = 4096/360
    yaw_deg_sign: 1.0              # 水平方向反了改 -1.0
    pitch_deg_sign: 1.0
    # ★跟踪俯仰修正余量(度)：clampPitchToScan 在扫描俯仰范围外再留这么多度供伺服修正。
    #   踩过的坑：scan_pitch_levels 只剩一层时 min==max -> 允许区间宽度为 0 ->
    #   视觉伺服的俯仰修正全被钳掉 -> 云台俯仰僵死，改 offset 完全无效。
    # ★扫描俯仰区间之外再留多少度供【扫描时的微调】。
    #   注意：2026-10-03 起，跟踪模式已不再使用这个区间（改走机械限位），
    #   所以调它【不会再影响目标跟踪俯仰】，只影响扫描层的活动范围。
    tracking_pitch_margin_deg: 6.0
    # ★空闲归位速度比例：IDLE 时云台回到"正前方+基准俯仰"（相对巡逻速度）。
    #   不归位的话云台会冻结在最后一次的任意姿态，改俯仰参数看不出变化。
    idle_homing_speed_ratio: 0.5            # 竖直方向反了改 -1.0
    gimbal_yaw_tick_min: 100       # 水平轴硬件刻度下限
    gimbal_yaw_tick_max: 3995      # 水平轴硬件刻度上限
    gimbal_pitch_tick_min: 950     # 竖直轴刻度下限(下位机钳位)
    gimbal_pitch_tick_max: 2400    # 竖直轴刻度上限(下位机钳位)

    # -------------------------------------------------------------------------
    #  瞄准精度与消抖
    # -------------------------------------------------------------------------
    ema_alpha: 0.45                # ★2026-10-17 移动靶提速：0.25→0.45（滤波滞后减小，误差与速度估计跟得更快）
    track_deadzone_px: 5           # ★t55 v2：2→5（80cm 处 ~0.5°；必须 < fire_dz_far_px）
    track_kp: 20.0                 # 旧式 PD 速度键（pid_enable=true 时不生效，保留供切回）
    track_kd: 15.0
    track_inc_gain: 1.2            # 旧式位置增益（pid_enable=true 时不生效）
    track_speed_floor: 30          # ★t55 v2：速度下限 100→30 ticks/s（≈2.6°/s，死区边缘不再抽动）
    fine_zone_px: 40               # ★t55 v2：20→40（提前进精调档，误差常驻 10~60px 区间）
    fine_kp_scale: 0.5             # 精调档 Kp 缩放
    fine_kd_scale: 2.0             # 精调档 Kd 放大
    predict_gain: 0.5   # tune

    # ===== ★跟踪模式（2026-10-17 用户指令：先使用 src_v1 那套自瞄）=====
    #   v1    = 参考 D:\User\Desktop\src_v1\dzrknn_dataprocess（上游 2026-09-28）：
    #           增量 = 有效偏差×0.5 + 预判×0.5；速度 PD(8/3)+精调档；死区 12px；滤波 0.3；
    #           水平轴走**整量程**（不限制在扫描区间）。
    #   tuned = 之前的整定（inc_gain 1.2 / kp 20 / kd 15 / 死区 5）
    #   pid   = 增量式 PID（下面的 pid_* 组；需 pid_enable=true 且 track_mode=pid）
    #   ⚠️ 三选一，改这一行 + 重启节点即可，不用改代码；v1 优先级最高。
    track_mode: pid                # ★2026-10-17：I 项只在增量式 PID 里存在 ⇒ 切到 pid（v1 无 I）

    # —— v1 模式参数（与上游 src_v1 launch 默认值对齐）——
    v1_inc_gain: 0.5               # 位置增量 tick/px/帧（上游 eff/2.0）
    v1_predict: 0.5                # 预判（帧）；静态靶嫌抖置 0
    v1_kp: 8.0                     # 速度 P
    v1_kd: 4.5                     # ★D×1.5（用户 2026-10-17）：3.0→4.5，加大速度环阻尼
    v1_ema_alpha: 0.3              # 视觉滤波
    v1_deadzone_px: 12             # 死区（上游 12px；须 < fire_dz_far_px=14，否则"永远判在框外"）
    v1_fine_zone_px: 20            # 精调档阈值
    v1_fine_kp_scale: 0.5
    v1_fine_kd_scale: 2.0
    v1_speed_floor: 100            # 速度地板（上游硬编码 100）
    v1_speed_max_ratio: 0.63       # 仅 v1_speed_max_abs<=0 时生效
    v1_speed_max_abs: 1700         # ★本车 patrol_ratio=0.30（1110 tick/s），上游是 0.75（2775）：
                                   #   按比例派生只有 699 tick/s（≈61°/s）太慢 ⇒ 直接钉 1700
    v1_yaw_full_range: true        # 水平用整量程 clampYawTick

    # ===== ★增量式 PID 跟踪控制（2026-10-17；pid_enable:false 时**逐位走旧式**）=====
    #   量纲：e = 死区处理后的**像素误差**；本组参数算出来的 u 是 **tick/s**，
    #        节点内部再做 Δθ = u·dt 的位置积分 ⇒ **不要**再把 track_inc_gain 当 kp 用。
    #   等效换算：Δθ/帧 = kp·dt ≈ kp/30 ⇒ 想复现旧 track_inc_gain=1.2 就取 kp≈36。
    #   为什么这样分：旧版"位置增量按 inc_gain、速度按 kp/kd 公式"是**两套口径**，
    #     开快了位置与速度不同步（位置先到、速度还在冲）⇒ 本组让二者同源（u 同时给位置与速度）。
    #   整定顺序：kp（先看收敛与有没有来回摆）→ ki（吃掉稳态残差）→ kd 最后再加。
    pid_enable: true               # ★本轮实测开关；改 false 立即回到旧式（只需重启，无需重编）
    pid_kp: 10.0   # tune
    pid_ki: 1.0   # tune
    pid_kd: 1.5   # tune
    pid_i_clamp: 600.0             # 积分输出限幅(tick/s)：防饱和导致反向迟滞
    pid_d_alpha: 0.3               # D 项一阶低通（0=不滤）
    pid_min_step: 1                # 最小位置步长(tick)：小于它本帧不动，压死区边缘点动

    # -------------------------------------------------------------------------
    #  开火判据
    # -------------------------------------------------------------------------
    fire_dz_dynamic: true          # 启用动态开火框（目标越近视差越大、框越宽）
    fire_deadzone_px: 8            # 固定开火死区(px)，仅 fire_dz_dynamic=false 时使用
    fire_dz_far_px: 14.0          # 远距离开火死区(px)
# ★t53 打靶修复（用户 2026-10-16 裁决）：t43 按"7×7px(半宽3.5)"收窄后 < 云台机械精度~12px，
#   实车"看得见靶却一直判在框外"（REASON_OUT_OF_BOX 主因）⇒ 放宽回 14/26（> 机械精度，
#   恢复 t43 前的不变量"须 > 12px"）。此键同时被 Python aim.py(别名 aim.fire_box_*) 与
#   C++ dzrknn 消费，两处一并放宽。
    fire_dz_near_px: 26.0          # 近距离开火死区(px)
    box_w_far: 30.0                # 远处目标框宽标定值(px)
    box_w_near: 120.0              # 近处目标框宽标定值(px)
    fire_hold_frames: 5            # 连续满足多少帧才开火
    fire_use_image_stable: true    # 稳定判据：true=画面稳定 / false=电机静止
    fire_stable_px_per_frame: 1.5  # 画面稳定阈值(px/帧)
    fire_real_speed_max: 20        # 电机静止阈值(realV)
    fire_speed_max: 50             # 开火时指令速度上限
    target_confirm_frames: 2       # ★2026-10-16 需求1：降门槛（原4）——连续2帧即确认可射击
    cls_switch_confirm_frames: 5   # ★2026-10-17 用户指令：改回5（10-16 曾降至2）。蓝面恒定 ⇒ 真类别永不合法切换，
                                   #   视觉偶尔会把蓝靶某一帧判成红靶，若直接采信当帧类别，
                                   #   fire_only_blue 下会频繁掐断开火，表现为"明明瞄上了却打不出去"。
                                   #   5 帧(约 0.17s)足以吸收单帧抖动；调大更稳但改锁更慢。
    shot_cooldown_ms: 500          # 两发之间最小间隔(ms)

    # -------------------------------------------------------------------------
    #  弹药控制
    # -------------------------------------------------------------------------
    fire_only_blue: true           # ★2026-10-16 用户确认：只打蓝靶，打红靶扣分（旧 false 会打红靶违规）
    max_shots: 1   # tune
    # ★ t26（2026-10-11 用户指令 4）：单目标连发上限 3 → **10**（= 允许对同一目标打完全部弹药）。
    #   旧值 3 的溯源：原口径"防把全程弹药倾泻在一个靶上"；现改由 `max_shots_total=10` +
    #   决策层"到站发数增量满 10 即离站"共同兜底。本键被 dzrknn 云台节点直接读取。
    max_shots_per_target: 10

    # -------------------------------------------------------------------------
    #  激光同轴标定（用连续激光笔测出后填这里）
    # -------------------------------------------------------------------------
    laser_offset_x: 0.0            # 激光落点相对画面中心的水平偏移(px)
    laser_offset_y: 0.0            # 激光落点相对画面中心的竖直偏移(px)

    # -------------------------------------------------------------------------
    #  ★新版本补丁：两键开火 + 延迟补偿提前量（2026-10-07）
    #  ------------------------------------------------------------------------
    #  为什么：旧版放行门 /move_base/stop_signal 在 C++ 侧**零订阅者**（死线），
    #          且开火要求"画面静止"，移动轨道靶几乎打不出去。
    #  怎么工作：use_external_fire_gate=true 时，开火权交给新决策层的两把钥匙
    #          · /aim/fire_gate  (MissionTask：已到站、停稳、FIRE 阶段)
    #          · /aim/fire_ready (AimTask：目标确认、预测落点在框内、冷却/弹药允许)
    #          两者都为 1 才点火；lead_apply_gain 控制"云台物理上提前瞄多少"。
    #  ★默认关闭 = 行为与旧版逐字一致（回退验证用）。现场整定步骤见
    #     docs/云台补丁说明.md 第四节：先只开两键，再一档一档加 lead_apply_gain。
    # -------------------------------------------------------------------------
    use_external_fire_gate: false  # ★true 才启用两键开火（需先编译 C++ 补丁）
    lead_apply_gain: 0.0           # 0=不施加提前量；建议 0.3 → 0.6 → 1.0 逐步调


    # -------------------------------------------------------------------------
    #  目标筛选与状态机
    # -------------------------------------------------------------------------
    aspect_min: 0.60   # ★2026-10-16 用户澄清：要打的靶面是 1:1 圆形（非横向 2:1 靶板），恢复原始过滤范围
    aspect_max: 1.60   # 过滤保留：圆形靶面宽高比≈1.0，落在 [0.60,1.60] 内；旧"放宽到 2.40 容纳 2:1 靶板"依据已证伪，撤销
    lost_frames_to_rescan: 180     # ★跟踪丢帧回扫描阈值。太小会让识别间歇被判"脱离视野"
    vision_timeout_ms: 1000        # 追踪中多久收不到视觉结果就强制回扫描(ms)

    # -------------------------------------------------------------------------
    #  车体转动前馈（惯性凝视稳定，车转时云台反向补偿）
    # -------------------------------------------------------------------------
    gyro_ff_gain: 0.0              # 前馈增益(0 = 关闭)
    gyro_ff_sign: 1.0              # 补偿方向(±1)
    imu_ff_timeout_ms: 200         # IMU 失联暂停阈值(ms)


# =============================================================================
#  相机  usb_cam  （节点名 usb_cam_node）
# =============================================================================
