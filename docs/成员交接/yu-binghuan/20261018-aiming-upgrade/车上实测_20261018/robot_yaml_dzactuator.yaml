/dzactuator:
  ros__parameters:
    # ---- 串口 ----
    serial_port_name: "/dev/dzactuator"   # ★udev 符号链接，比 /dev/ttyUSBX 稳定(插拔不变)
    serial_baud_rate: 115200

    # ---- 坐标系名（改名会牵动 TF/话题，一般不动）----
    odom_frame_id: "odom"
    robot_frame_id: "base_link"
    gyro_frame_id: "imu_link"

    # ---- ★★ 底盘标定（C1：这两个值错了，里程计就是错的）----
    #  calibrate_lineSpeed：1 = 直接用轮速计原始值；0 = 用下面两个标定值换算（默认 0）
    calibrate_lineSpeed: 0
    #  ticksPerMeter —— 直行 1 米对应的编码器计数（决定平移里程精度）。
    #  标定方法：把车放在场地直线段，遥控低速直行 6 格（6×0.35=2.10m），
    #            读出编码器计数增量 N，则 ticksPerMeter = N / 2.10。
    #  验收标准：走完 2.10m 后 /odom/localization 的位移应≈2.10m，误差 <3% 即可用。
    #  ★★★ 2026-10-11 实车直线标定修正：2776.0 → 3280.0 ★★★
    #   实测（本血统·车端 N10→A10 直线 4.55 m / 13 段 / 0.15 m/s）：
    #   信念跑满 4.55 m 判 FINISH 时，车实际只走了 3.86 m（停 C10 内，距 A10 中心 69 cm）
    #   ⇒ 信念虚增 17.9% ⇒ 正确值 = 2776 × 4.55/3.86 = 3272。
    #   佐证：v1 旧核历史标定 3290（按 3290 预测欠程 71 cm，与实测 69 cm 仅差 2 cm）。
    #   3272(实测) 与 3290(v1) 都在卷尺 ±2 cm 误差带内 ⇒ 取中值 3280.0。
    #   复验标准：同一直线重跑，停位距 A10 中心 ≤4 cm；仍欠程则按实测比再修一次。
    ticksPerMeter: 3280.0
    #  ticksPer2PI —— 原地转满一整圈(360°)对应的编码器计数（直接决定航向精度）。
    #  ★★★ 2026-10-11 第二次修正：2723.0 → 2680.0（用户现场指令）★★★
    #   依据（用户口径）：插值预测的尺度 scale ≈ 0.97 ⇒ 物理真值 ≈ 2723 × 0.97 ≈ 2641~2680 区间；
    #     取 2680（保守一侧）。
    #   ⚠️ 风险（如实记录，待实车仲裁）：scale≈0.97 意味着"按 2680 换算出的航向增量比物理偏大 ~3%"，
    #     而**到位吸附会拒收**（观测与预测差超阈就不修正）⇒ 若实车出现"转完对不上、吸附不生效"，
    #     按下面流程二分：先回 2723 复跑一趟 → 若明显变好则说明 2680 过冲 → 取中间值再试。
    #   几何等价轮距 = 2680/(2π×3280) = 0.130 m（yaw 通道独立常数，与 ticksPerMeter 不必同源）。
    ticksPer2PI: 2680.0

    # ---- ★物理几何（t22：用户 2026-10-11 现场口径；公式在 dzbrain/route/physics.py）----
    vehicle:
      length_m: 0.28            # 车体长（沿车头方向）
      width_m: 0.135            # 车体宽（半宽 0.0675 进挡板/障碍判据）
      coverage_radius_m: 0.035  # ★车心假设圆半径（压雷判据：车心到 0.12×0.12 垫片 ≤ 此值算压到）
      # ★★ 卡 t11：参考点(后轴中心) → 车体**几何中心**的纵向偏移（米）。
      #   实测来源（用户现场卷尺，2026-10-11）：后轴中心→车尾沿 6.5 cm、
      #   后轴中心→车头沿 21.5 cm、车身总长 28 cm
      #   ⇒ 中心在参考点前方 (21.5 − 6.5)/2 = **+7.5 cm**。
      #   约定：**正值 = 车体中心在参考点前方**；参考点 = 里程计/仿真积分点
      #   （`dzactuator.cpp` 与 `tools/sim.py: step_bicycle` 都按后轴式积分 `X += v·cos(yaw)`）。
      #   消费者：`route/physics.py` 的 `body_corners()/body_*_clearance_m()`（净空唯一真源）、
      #   规划门禁的足迹诊断（`tasks/mission.py`）、离线足迹链（`_tmp_session/t5_bold/t5lib.py`）。
      #   ⚠️ t11 实测：把该偏移计入后，**现役手工 62 点与 tracker-safe 62 点**在下半场
      #      `J8→J7→I7` 的拐角切内处（真值 yaw≈45°、车体角点朝挡板）从"+7.6 mm 余量"
      #      变成 **−5.2 mm 侵入（35~38 拍）** ⇒ 挡板几何必须在现场复核后才能放行新引擎。
      ref_offset_m: 0.075
    field:
      obstacle_radius_m: 0.1275 # 障碍圆柱半径（柱心在障碍格格心）
      mine_pad_m: 0.12          # 雷垫片边长（0.12×0.12 正方形，中心在雷格格心）
      barrier_width_m: 0.02     # 挡板厚度（第 6/7 行之间、D..N 列的细条；半厚 0.01）
      barrier_cols: "D..N"      # 挡板覆盖列（含两端 = 11 列 = 3.85 m）

    # ---- 抖动抑制窗口（调试期先别动）----
    smooth_window_speed: 20
