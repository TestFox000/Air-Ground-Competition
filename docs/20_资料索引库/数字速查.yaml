# 数字速查真源（C 线 · task-5 · 2026-10-24）
#
# 本文件是「数字速查表」的机器可校验版本。docs/20_资料索引库/README.md 与各分册
# 00_索引.md 里的数字应逐步收敛到这里，避免同一数字在四处各写一份、互相对不上。
#
# 跑法（零第三方依赖，只用标准库）：
#     python docs/_工具/check_numbers.py            # 退出码 1 = 有 mismatch
#     python docs/_工具/check_numbers.py --strict   # 文档侧漂移也判红
#
# 字段（8 必填 + 4 可选，扁平一层，不嵌套）：
#   id            稳定标识，供其它文档引用；一旦发布不要再改名
#   名称          人读名字
#   值            真源值（数字）。找不到可信出处时写 null 并在 备注 写清搜索口径，禁止编
#   单位          物理单位；无量纲写 -
#   出处          文档里对这个数字的记载位置（路径:行）。数字口径冲突时，这里指向
#                 记着旧值/异文的那一行，旧值另填 文档值，便于判断异文是否已合并
#   代码锚点      代码真源：路径:行号 + 该行的符号名或配置键（校验器核对这一行是否真有该符号）
#   校验          auto = 表达式（由校验器重算后与 值 diff）；manual = 算不了，进「需人核」清单
#   状态          实测 = 有实车/实测记录 | 文档 = 只有代码或文档出处、未实测 | 待核 = 无可信出处，禁止引用
#   文档值        可选：文档记载的（与 值 不一致的）旧值
#   文档值出处    可选：旧值的文档位置
#   出处应含      可选：分号分隔的字面量；该文档行不再包含它们时报警（文档被改写的哨兵）
#   容差          可选：相对容差，默认 1e-3
#   备注          可选：口径说明。不要写 # 号（会被当成 YAML 注释截断）
#
# 约定：值 一律以 代码锚点 为真源；文档与代码不一致时把文档值记在 文档值，不要二选一，
#       也不要把文档的旧值写进 值 里。

