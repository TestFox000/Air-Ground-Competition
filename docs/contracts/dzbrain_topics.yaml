    producers: ["serial_reader（车端 install 副本）"]
    consumers: ["RosBridge.on_odom", "LocalizationTask"]
    unit: "position 格（×0.35=米）；四元数 yaw=原始车体角(+π/2=地图航向)"
    field_semantics:
      position: "格单位；乘 0.35 得米（geometry.py BLOCK_SIZE）"
      orientation.quaternion: "原始车体 yaw；+π/2 = 地图 yaw（RAW_YAW_TO_MAP_YAW_OFFSET）"
    timing_notes: "定位中继周期帧；收不到则 P_ODOM_AGE=inf、不写 P_POSE"
    evidence:
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/contract.py, line: 60}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 264}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/contract.py, line: 145}

