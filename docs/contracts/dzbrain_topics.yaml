# =============================================================================
# 车内通信（非 ROS，供对照；不算 topic_count）
#   - 黑板 Blackboard：键值事实（核心/blackboard.py:21-95）
#   - 事件总线 EventBus：通知（核心/events.py:24-48）
# =============================================================================

blackboard_keys:
  - {key: "pose",              const: P_POSE,           writers: "Localization",         readers: "Safety/Tracker/Mission/Drone/Telemetry"}
  - {key: "pose_raw",          const: P_POSE_RAW,       writers: "Localization",         readers: "Fix/Localization"}
  - {key: "odom_age",          const: P_ODOM_AGE,       writers: "Localization",         readers: "Safety/Telemetry"}
  - {key: "route",             const: P_ROUTE,          writers: "Mission",              readers: "Tracker/Localization"}
  - {key: "route_index",       const: P_ROUTE_INDEX,    writers: "Tracker/Localization", readers: "Telemetry"}
  - {key: "route_s",           const: P_ROUTE_S,        writers: "Tracker/Localization", readers: "Telemetry"}
  - {key: "mission_phase",     const: P_MISSION_PHASE,  writers: "Mission",              readers: "Tracker/Safety/Drone"}
  - {key: "stop_point",        const: P_STOP_POINT,     writers: "Mission",              readers: "Mission/Aim"}
  - {key: "target",            const: P_TARGET,         writers: "Aim",                  readers: "Telemetry"}
  - {key: "aim",               const: P_AIM,            writers: "Aim",                  readers: "Mission/Telemetry"}
  - {key: "aim_red_face",      const: P_AIM_RED,        writers: "Aim",                  readers: "Mission"}
  - {key: "drone",             const: P_DRONE,          writers: "DroneTask",            readers: "Mission/Telemetry"}
  - {key: "field_layout",      const: P_FIELD_LAYOUT,   writers: "DroneTask",            readers: "main(StepLoop)"}
  - {key: "layout_arrivals",   const: P_LAYOUT_ARRIVALS,writers: "DroneTask",            readers: "main(StepLoop)"}
  - {key: "field_verify",      const: P_FIELD_VERIFY,   writers: "DroneTask",            readers: "Telemetry/诊断"}
  - {key: "fix",               const: P_FIX,            writers: "Localization",         readers: "Fix/Localization"}
  - {key: "fix_est",           const: P_FIX_EST,        writers: "FixTask",              readers: "Localization"}
