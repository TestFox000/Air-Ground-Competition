# =============================================================================
# dzbrain 决策脑对外/对内 ROS 接口契约表（机器可读版）
# =============================================================================
# 真源：dzrobot_v2/src/dzbrain/dzbrain/io/contract.py:58-110 的 TOPICS（21 条）
#       装配接线：io/ros_io.py 的 _create_subs(:256) / _create_pubs(:386)
# 行号只对 dzrobot_v2 提交 ff231e1e（2026-10-29）成立。冻结区，只读不改。
#
# direction 口径（dzbrain 视角）：
#   sub = dzbrain 订阅（车外节点发给我们）
#   pub = dzbrain 发布（我们发给车外节点）
# QoS 三值 = reliability / depth / durability（QosSpec.describe() 输出格式）
# =============================================================================

meta:
  generated_at: "2026-10-30"
  scope: "dzbrain 决策脑对外/对内 ROS 接口（不含车内线程通信）"
  source_roots:
    - dzrobot_v2/src/dzbrain/dzbrain/io/contract.py
    - dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py
    - dzrobot_v2/src/dzbrain/dzbrain/io/referee.py
    - dzrobot_v2/src/dzbrain/dzbrain/main.py
    - dzrobot_v2/src/dzbrain/dzbrain/tasks/
    - dzrobot_v2/src/dzbrain/dzbrain/core/blackboard.py
    - dzrobot_v2/src/dzbrain/dzbrain/core/events.py
  topic_count: 21
  sub_count: 12
  pub_count: 9
  code_frozen: true          # src/dzbrain/dzbrain/** 属冻结区，改话题名会断链

qos_constants:
  QOS_PURSUIT_ANGLE: {reliability: best_effort, depth: 1, durability: volatile}
  QOS_ODOM:           {reliability: best_effort, depth: 10, durability: volatile}
  QOS_SENSOR_FRAME:   {reliability: best_effort, depth: 10, durability: volatile}
  QOS_EVENT:          {reliability: reliable,     depth: 10, durability: volatile}
  QOS_LINK:           {reliability: best_effort, depth: 10, durability: volatile}

# ★ RELIABLE 与 BEST_EFFORT 不互通 ⇒ 跨进程/跨机改错一侧会静默失败（无报错、无数据）。
#   pursuitAngle(depth=1, BEST_EFFORT) 换成 RELIABLE 会让底盘收到慢/旧指令，表现为"车一顿一顿"。

topics:
  # ---------------------------- 车外输入（12 条） ----------------------------
  - key: odom
    name: "/odom/localization"
    msg_type: "nav_msgs/Odometry"
    qos: {reliability: best_effort, depth: 10, durability: volatile}
