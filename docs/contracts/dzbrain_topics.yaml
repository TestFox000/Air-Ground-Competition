# =============================================================================
# ★ 三个最容易踩的静默失败（跨进程/跨机不会报错，只会"看起来没反应"）
# =============================================================================
silent_failure_modes:
  - id: SF-1
    title: "QoS 不匹配 ⇒ 无端点连通、无报错"
    detail: "pursuitAngle 是 depth=1 + BEST_EFFORT。若任一侧改成 RELIABLE，发布/订阅不互通，rclpy 不报错，但底盘收不到任何指令（车不动）或收到慢/旧指令（车一顿一顿）。QoS 只在装配时静默失败，启动契约靠端点计数对账能抓，运行期无信号。"
    evidence:
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/contract.py, line: 37}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/contract.py, line: 36}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 169}
  - id: SF-2
    title: "单位/坐标系三处漂移 ⇒ 车动但走错、打飞"
    detail: "① odom position 是【格】，×0.35=米（geometry.BLOCK_SIZE）；② pursuitAngle angular.z 是【度】舵角，不是 rad/s；③ odom 四元数 yaw 是原始车体角，+π/2=地图 yaw。三处都集中在 contract.odom_to_pose 与 publish_command，别处手写换算即埋雷。"
    evidence:
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/contract.py, line: 145}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 499}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/core/geometry.py, line: 45}
  - id: SF-3
    title: "ROS_DOMAIN_ID 分裂 ⇒ 部分话题通、部分收不到"
    detail: "env_problems 判 error 的正是域号不一致（DZ_ROS_DOMAIN）。一旦域分裂：DDS 图会裂成两半，跨机的 /dzlink 可能还通、同机的 /odom/localization 却收不到 ⇒ 车不动。症状是'某些话题有、某些没有'，极易误判为对端节点没起。"
    evidence:
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 103}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 111}
  - id: SF-4
    title: "刹车静默失效 ⇒ 日志自证安全、实际一条零速都没发"
    detail: "旧写法 _safe_call(publish_brake) 把 publisher.publish() 抛的 RCLError 吞成 None，照样打'已发零速指令'。真刹手段只剩底盘 1s 看门狗。现 publish_brake 显式判 rclpy.ok()，发不出去就抛异常，不可能被误读成发出去了。"
    evidence:
      - {path: dzrobot_v2/src/dzbrain/dzbrain/io/ros_io.py, line: 509}
      - {path: dzrobot_v2/src/dzbrain/dzbrain/tasks/safety.py, line: 461}

