<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#0b0d12;padding:18px}
h2{color:#9aa3b2;font-size:14px;margin:18px 0 8px}
.row{display:flex;gap:16px;align-items:center;margin:10px 0}
.lbl{color:#7a8494;font-size:12px;width:56px}
.swatch{display:flex;align-items:center;justify-content:center;border-radius:8px;padding:7px}
</style></head><body>
<div id="app"></div>
<script>
const INNER =
  '<path d="M12 2.2 C13.3 3.8 13.9 5.9 13.9 8.3 C13.9 11.7 13.6 15.2 12.8 18 C12.5 19.5 12.4 20.2 12 21.8 C11.6 20.2 11.5 19.5 11.2 18 C10.4 15.2 10.1 11.7 10.1 8.3 C10.1 5.9 10.7 3.8 12 2.2 Z"/>' +
  '<path d="M9.8 11 L2.9 13.9 L3.4 15.5 L10.5 14.2 Z"/>' +
  '<path d="M14.2 11 L21.1 13.9 L20.6 15.5 L13.5 14.2 Z"/>' +
  '<path d="M7.1 19.1 L16.9 19.1"/>' +
  '<circle cx="12" cy="7.6" r="1.2" fill="currentColor" stroke="none"/>';

function svg(size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="' + color + '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ' +
    'style="color:' + color + '">' + INNER + '</svg>';
}
const sizes = [14, 16, 18, 22, 30, 40];
const themes = [
  ['侧栏 深色', '#1a1d24', '#dfe3ea'],
  ['浅色面板', '#f5f6f8', '#3a3f4a'],
  ['强调色按钮', '#4f6ef7', '#ffffff'],
  ['悬停态 深色', '#2a2e38', '#ffffff'],
];
const app = document.getElementById('app');
for (const [name, bg, fg] of themes) {
  app.insertAdjacentHTML('beforeend', '<h2>' + name + '</h2>');
  for (const s of sizes) {
    app.insertAdjacentHTML('beforeend',
      '<div class="row"><span class="lbl">' + s + 'px</span>' +
      '<div class="swatch" style="background:' + bg + '">' + svg(s, fg) + '</div></div>');
  }
}
</script></body></html>
