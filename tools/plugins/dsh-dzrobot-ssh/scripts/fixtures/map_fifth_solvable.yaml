# 测试夹具 · 引擎可解地图（**不是**现场真源，运行时零引用）
#
# 为什么需要：第六张图（config/map.yaml）的 K7 进洞形态在 tracker-safe 引擎下无解
#   （车端 config/robot.yaml 的 planner.auto_plan_enabled 注释已记：「legs0=0」）。
#   页面 planRoute / 增量透传 / truthPlanEvidence 的「同引擎逐 token 对账」需要一个
#   引擎真能解出路线、且几何口径与真源一致的稳定图 —— 本文件就是那份夹具。
#
# 几何 = 历史第五张图（git 2026-10-17 前 HEAD:config/map.yaml，44 token / route_check 0 error）。
#   barrier / start / end / 网格与第六张图完全相同，只有四类点位不同；
#   对 planRoute 的 argv 拼装、--engine 透传、--from-cell/--already-covered 白名单
#   不产生任何特权路径。现场换图不会改变本夹具，测试因此不受真源漂移影响。
#
# 取用：scripts/fixtures/solvable-map.mjs（同时导出四类点位，供 truthPlanEvidence 的 board 用）。
map:
  name: "测试夹具 · 第五张图几何（引擎可解，非现场真源）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  mines:      ["C1", "A3", "E3", "G4", "I6", "B7", "D9", "H10"]
  obstacles:  ["A1", "E2", "H4", "D8", "I8", "G9", "B11", "F11"]
  targets:    ["E5", "F5"]
  bridges:    ["K5", "K9"]
