# YOLO-pose 训练配置模板 —— 复制成 data.yaml 后改路径即可。
#
# ⚠️ 两个字段**绝不能改**（改了就会上车出事故，不是训练出问题）：
#   names     顺序必须与车端 postprocess.h 的 OBJ_CLASS_NUM 语义一致：
#               0 = blue_target（蓝面 = 敌方 = 可打击）
#               1 = red_target （红面 = 友方 = 禁止打击）
#             顺序反了 = 把友方当敌方打，每次 −5 分、最多 −15。
#   kpt_shape 必须是 [1, 3]（1 个关键点，值为 x y conf）—— 车端 KPT_NUM=1、KPT_DIM=3，
#             导出后输出通道数必须是 4 + 2 + 3 = 9。
#
# 用 tools/ml/dataset_check.py 先体检，再开训。

path: /absolute/path/to/dataset     # 数据集根目录（绝对路径）
train: images/train                 # 相对 path
val: images/val

names:
  0: blue_target
  1: red_target

kpt_shape: [1, 3]
flip_idx: [0]                       # 只有一个关键点（靶心），水平翻转索引就是它自己

# 说明：
#   * 关键点语义 = 靶标"发光中心/靶心"，供云台瞄准用（车端优先用关键点而非框中心）。
#   * 图片建议直接用车端 640x480 的原图（与 det_node 输入一致），
#     不要先缩放到 640x640 再标（letterbox 会由训练/推理端统一做）。
#   * 类别少、目标单一，从 yolov8n-pose.pt 起步通常就够；
#     现场样本（`~/dzrobot/camera_dataset`，1244 张 640x480）可作为补充真实域数据。
