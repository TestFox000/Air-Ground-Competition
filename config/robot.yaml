# =============================================================================
#  智能车 · 统一配置中心 robot.yaml
# -----------------------------------------------------------------------------
# ★ 全车唯一需要改参数的地方；改完不用重编译，重启对应节点生效。
#   整套重启 ~/dzrobot/start_all.sh restart ｜ 只重启云台 tools/restart_node.sh gimbal
#   体检参数 ~/dzrobot/tools/healthcheck.sh
# ★ 为什么不用 launch/代码改：launch 传字符串、节点声明 double/bool/int，类型不符会
#   静默失败；这里全是 YAML 原生类型，启动后可用 healthcheck 核对。
# ★ 三条硬不变量（healthcheck 自动校验）：① track_deadzone_px < fire_dz_far_px
#   ② fire_dz_far_px > 机械精度≈12px ③ lost_frames_to_rescan（未写则取代码默认 180）≥ 视觉抖动周期≈60帧(2s)。
#   旧注释曾并列机械精度经验与窄框方案；因果归因未证，本轮不重裁，当前阈值不变。
# =============================================================================

# ==== 云台自瞄 · dzrknn_dataprocess ====
/dzrknn_dataprocess:
  ros__parameters:

    scan_yaw_min_deg: -150.0       # ★t25 用户指令：巡航范围左右各 150°
    scan_yaw_max_deg: 150.0  # 扫描右端点；与 min 同时约束 TRACK 水平伺服范围
    scan_pitch_offset_deg: +10.0  # 扫描俯仰基准 deg；旧现场记载+10下压，旧符号说明正抬头，冲突未裁决；保留现值，不据注释调参
    scan_pitch_levels: [0.0]  # 只做水平扫描；实际俯仰=level+scan_pitch_offset；单层时 min==max 会钳死跟踪俯仰
    scan_yaw_dirs: 8               # (兼容保留) 旧逐点扫描的点数，连续扫描下不参与计算
    scan_dwell_ms: 300             # 每个点最短驻留(ms)
    scan_passes: 2               # 一轮 = 左一趟 + 右一趟（射击点连做两轮）
    scan_continuous_cycles: 3  # 连续扫描最多轮数；<=0 不限（回退对照）
    scan_home_timeout_ms: 1500  # 归位段超时 ms；到位判据 scan_arrive_tol，超时兜底放行
    scan_arrive_tol: 30            # 到位容差(刻度)

    patrol_speed_ratio: 0.30  # 扫描速度=gimbal_max_speed×此值（调快锁不住靶，曾致 0 开火）
    gimbal_max_speed: 3700         # 云台最大转速(刻度/s)
    track_speed_max: 2000  # 跟踪转速硬上限 tick/s（≈176°/s）；>0 时不按 patrol 比例派生
    track_speed_max_ratio: 0.63    # 跟踪上限 = 巡逻速度 × 该比例（仅 track_speed_max=0 时生效）

    loop_hz_track: 100  # 跟踪时主循环 Hz
    loop_hz_idle: 50  # 扫描/空闲主循环 Hz；丢帧计数按 30Hz 视觉帧，与循环频率无关

    gimbal_center_tick: 2130  # 零位(正前方/水平)刻度；现行现场标定 2130（未提交调参；代码声明默认 2047）
    yaw_ticks_per_deg: 11.378      # 水平 刻度/度 = 4096/360
    pitch_ticks_per_deg: 11.378    # 竖直 刻度/度 = 4096/360
    yaw_deg_sign: 1.0              # 水平方向反了改 -1.0
    pitch_deg_sign: 1.0  # 竖直方向反了改 -1.0
    tracking_pitch_margin_deg: 6.0  # 跟踪俯仰修正余量 deg；单层扫描会钳死俯仰，现只影响扫描层
    idle_homing_speed_ratio: 0.5  # IDLE 归位速度比例（相对巡逻速度）
    gimbal_yaw_tick_min: 100       # 水平轴硬件刻度下限
    gimbal_yaw_tick_max: 3995      # 水平轴硬件刻度上限
    gimbal_pitch_tick_min: 950     # 竖直轴刻度下限(下位机钳位)
    gimbal_pitch_tick_max: 2400  # 竖直轴刻度上限（下位机钳位），不是丢帧阈值

    ema_alpha: 0.45  # 视觉一阶低通：越大越信新帧（0.25→0.45 为移动靶提速）
    track_deadzone_px: 5  # 跟踪死区 px（须 < fire_dz_far_px；80cm≈0.5°）
    track_kp: 20.0                 # 旧式 PD 速度键（pid_enable=true 时不生效，保留供切回）
    track_kd: 15.0
    track_inc_gain: 1.2            # 旧式位置增益（pid_enable=true 时不生效）
    track_speed_floor: 30  # 速度下限 tick/s（≈2.6°/s；太低死区边缘抽动）
    fine_zone_px: 40               # ★t55 v2：20→40（提前进精调档，误差常驻 10~60px 区间）
    fine_kp_scale: 0.5             # 精调档 Kp 缩放
    fine_kd_scale: 2.0             # 精调档 Kd 放大
    predict_gain: 0.5  # 速度前馈（帧）：靶动云台即动，治"慢慢跟随"；靶停略过冲

    # 跟踪模式三选一（改 track_mode 即切换）：v1=上游增量+PD；tuned=旧整定；pid=增量式 PID。
    # v1 优先级最高；pid 需 pid_enable=true。现行 pid。
    track_mode: pid  # 跟踪模式：v1 / tuned / pid（v1 优先；pid 需 pid_enable=true）

    v1_inc_gain: 0.5               # 位置增量 tick/px/帧（上游 eff/2.0）
    v1_predict: 0.5                # 预判（帧）；静态靶嫌抖置 0
    v1_kp: 8.0                     # 速度 P
    v1_kd: 4.5                     # ★D×1.5（用户 2026-10-17）：3.0→4.5，加大速度环阻尼
    v1_ema_alpha: 0.3              # 视觉滤波
    v1_deadzone_px: 12  # v1 死区 px（须 < fire_dz_far_px）
    v1_fine_zone_px: 20            # 精调档阈值
    v1_fine_kp_scale: 0.5
    v1_fine_kd_scale: 2.0
    v1_speed_floor: 100            # 速度地板（上游硬编码 100）
    v1_speed_max_ratio: 0.63       # 仅 v1_speed_max_abs<=0 时生效
    v1_speed_max_abs: 1700  # v1 速度上限 tick/s；按比例只有 699 太慢 ⇒ 钉 1700
    v1_yaw_full_range: true        # 水平用整量程 clampYawTick

    # 增量式 PID：e=像素误差、u=tick/s，节点内 Δθ=u·dt；不要把 track_inc_gain 当 kp（Δθ/帧≈kp/30）。
    # 整定顺序 kp → ki → kd；pid_enable=false 时逐位走旧式。
    pid_enable: true               # ★本轮实测开关；改 false 立即回到旧式（只需重启，无需重编）
    pid_kp: 12.0                   # ★2026-10-18 18:41 用户指定 kp12（口径 12/0.5/2.4）
    pid_ki: 0.5                    # ★2026-10-18 18:41 用户指定 ki0.5
    pid_kd: 2.4                    # ★2026-10-18 18:41 用户指定 kd2.4
    pid_i_clamp: 600.0             # 积分输出限幅(tick/s)：防饱和导致反向迟滞
    pid_d_alpha: 0.3               # D 项一阶低通（0=不滤）
    pid_min_step: 1                # 最小位置步长(tick)：小于它本帧不动，压死区边缘点动

    fire_dz_dynamic: true          # 启用动态开火框（目标越近视差越大、框越宽）
    fire_deadzone_px: 8            # 固定开火死区(px)，仅 fire_dz_dynamic=false 时使用
    fire_dz_far_px: 25.0  # 远距开火框半宽 px（须 > 机械精度≈12px）
    # 开火框有机械精度约束；旧档3.5px方案与框外现象不在本轮追认因果。Python规范键可由C++段迁移。
    fire_dz_near_px: 26.0  # 近距开火框半宽 px
    box_w_far: 30.0                # 远处目标框宽标定值(px)
    box_w_near: 120.0              # 近处目标框宽标定值(px)
    fire_hold_frames: 1  # 连续满足帧数；仓内 1，车端等效 5（D-052，现场须 ros2 param get 核实）
    fire_use_image_stable: true    # 稳定判据：true=画面稳定 / false=电机静止
    fire_stable_px_per_frame: 1.5  # 画面稳定阈值(px/帧)
    fire_real_speed_max: 20        # 电机静止阈值(realV)
    fire_speed_max: 50             # 开火时指令速度上限
    target_confirm_frames: 1  # 连续检出帧数；1=首帧即确认（车端曾 4）
    cls_switch_confirm_frames: 2  # 蓝↔红改锁需连续帧（≈0.07s；单帧误判会掐断开火）
    shot_cooldown_ms: 500          # 两发之间最小间隔(ms)

    fire_only_blue: true           # ★2026-10-16 用户确认：只打蓝靶，打红靶扣分（旧 false 会打红靶违规）
    max_shots: 10                  # 全程可用发数(硬上限 10)
    max_shots_per_target: 10  # 单目标连发上限；与 mission 发数增量/弹药上限共同兜底

    laser_offset_x: 0.0            # 激光落点相对画面中心的水平偏移(px)
    laser_offset_y: 0.0            # 激光落点相对画面中心的竖直偏移(px)

    # 两键开火：use_external_fire_gate=true 时由 /aim/fire_gate（到站/停稳）+ /aim/fire_ready
    # （确认/落点在框/冷却弹药）共同放行；lead_apply_gain 控制物理提前瞄量。
    # 默认关闭=与旧版逐字一致；整定步骤见云台补丁说明（归档）。
    use_external_fire_gate: true  # 两键开火验证：true=新链路
    lead_apply_gain: 0.5  # 云台物理提前量比例（前提 aim.lead_time_s>0）

    # ★2026-10-31 用户指令：不再由算法做靶子筛选（宽高比过滤已从 C++ 代码移除）；
    #   lost_frames_to_rescan / vision_timeout_ms 改用代码默认 180 / 1000，本文件不再覆盖。

    gyro_ff_gain: 0.8  # 车体转动前馈（方向现场确认）
    gyro_ff_sign: 1.0              # 补偿方向(±1)
    imu_ff_timeout_ms: 200         # IMU 失联暂停阈值(ms)

# ==== 相机 · usb_cam ====
/usb_cam_node:
  ros__parameters:
    video_device: /dev/video0     # 相机设备
    image_width: 640              # 图像宽度
    image_height: 480             # 图像高度
    framerate: 30.0               # 帧率
    pixel_format: yuyv            # 像素格式: yuyv | mjpeg
    io_method: mmap               # 采集方式: mmap | read | userptr
    brightness: 0  # 亮度 -64~64；曾设 50 导致过曝、颜色特征崩掉

# ==== 射击驱动 · dzjudgment ====
# 链路：云台判瞄稳 → /LaserShot_Command → 本节点串口 6 字节帧 → 激光。
# ★ 踩过的巨坑：本节点曾没被启动，start_all 只起云台 ⇒ /LaserShot_Command 的
#   Subscription count=0，激光不亮且零报错。开火没反应先看该话题订阅数。
/dzjudgment:
  ros__parameters:
    mcuserialport: "/dev/dzjudgment"   # udev 软链 -> ttyACM1（与底盘 /dev/dzactuator 互不干扰）
    mcubaudrate: 115200

# ==== 视觉检测 · det_node ====
/det_node:
  ros__parameters:
    model_path: ""  # 空=包内默认 light_det.rknn；绝对路径+hot_reload 可热换
    draw: true  # true=弹识别窗；ARM 板上建议 false 省 CPU
    thread_num: 2  # RKNN 池深度=滞后：2 线程≈66ms；1 线程掉到 17Hz，8 线程≈264ms
    max_fps: 30.0             # 推理帧率上限。30 = 跟随相机(默认)；降到 20 可明显省 CPU，
    hot_reload: true          # 模型文件 mtime 变化时自动热加载。

# ==== 循迹 · dzbrain（唯一实现；车端无本地地图：路线由无人机 field_layout 运行期规划）====
# 这里只列现场要调的键；其余默认值在 src/dzbrain/dzbrain/core/config.py 的 SCHEMA。

# ==== 决策层 · dzbrain（必须挂在 ros__parameters 下；顶层裸键会让三节点 abort）====
# 这里只列现场要调的键；其余默认值在 src/dzbrain/dzbrain/core/config.py 的 SCHEMA。
/dzbrain:
  ros__parameters:

    pursuit:
      wheelbase_m: 0.157  # 轴距 m（旧代码硬编码）
      max_steer_deg: 30.0  # 舵角限幅 deg（底盘侧再 clamp）
      max_steer_rate_deg_s: 120.0  # 舵角速率限幅 deg/s
      curvature_gain: 1.0  # 1.0=教科书纯追踪；0.5=旧行为等价
      lookahead_min_m: 0.36  # 最小前视 m（A 族加固：@0.15 隔板 352→0 拍；原 0.18）
      lookahead_max_m: 0.40  # 最大前视 m（1.2×0.30=0.36 会被旧上限钳住 ⇒ 0.40）
      lookahead_k_v: 1.2              # 前视 = k_v × 速度
      lat_acc_max_mps2: 0.35          # 横向加速度上限（曲率限速）
      cruise_speed_mps: 0.35  # 实车巡航 m/s
      accel_up_mps2: 0.0  # 升速上限 m/s²（0=不参与；t37 建议 0.6~0.8）
      accel_down_mps2: 0.0  # 降速上限 m/s²（0=不参与；t37 建议 1.0~1.2）
      map_safety_margin_m: 0.60       # 越界急停余量（★新版提到状态机最顶层）
      drift_warn_m: 0.30              # 单段漂移告警
      drift_seg_gate_m: 0.18          # ★漂移判定用弧长窗口，不能绑在吸附半径上（否则永远报不出来）
      bridge_blocks: []  # 强制直行保护点（空=关闭；保护窗含 90° 拐会锁错航向）
      align_straight_before: 2.0      # 洞前多少格开始锁航向
      align_straight_after: 1.0
      align_straight_speed_mps: 0.10
      align_kp: 12.0
      align_steer_limit_deg: 8.0

    route:
      cross_lower_candidates: ["K7"]  # 穿洞候选格（无人机情报选定；超时用 default）
      cross_upper_candidates: ["K5"]  # 上半场穿洞候选格
      cross_lower_default: "K7"  # 兜底穿洞格（必须 ∈ 候选集合，否则 validate warn/横幅错）
      cross_upper_default: "K5"  # 上半场兜底穿洞格（必须 ∈ 候选集合）
      # ★ 本两键是**板心窗口**（决定车停哪儿）：靶板中心=各靶格中心中点，现役 0.90 ± 0.12
      #   ⇒ [0.78,1.02] ⇒ 停站 D3（板心 0.875m、偏离车头 36.9°、零绕行）。
      #   1.00 档（F2）已作废：到站车头使靶落在车尾 170.5°，超出云台 ±150°（几何死结）。
      #   ⚠ 旧核的靶格级判据（shoot_distance_target/min/max）已随 path_executor 段删除，
      #     不要再引入第二套射程口径；本两键是唯一真源。
      #   消费者 route/planner.py:shoot_distance_window()；缺键时用同值常量 0.90/0.12。
      shoot_distance_m: 0.90  # 停站点→靶板中心目标距离 m
      shoot_distance_tol_m: 0.12  # 窗口半宽 m ⇒ [0.78,1.02]

    # 桥洞几何（2026-10-27 实测）：侧壁 0.02m 居中压格边界 ⇒ 净开口 0.33m；车宽 0.17
    # 居中穿洞横向余量 0.080m。旧实现多给 2.75cm 虚拟冗余，必须按真值（route/physics.py）。
    field:
      bridge_opening_m: 0.33  # 桥洞净开口 m（格宽 0.35−墙厚 0.02）
      bridge_wall_m: 0.02  # 桥洞侧壁厚度 m（居中压格边界）
      bridge_entry_redundancy_m: 0.0  # 进洞侧冗余延长 m（现实不存在，置 0 关闭；保留可回退）

    mission:
      auto_start: false  # 等无人机 /nav/waypoint 下发再出发
      auto_start_delay_s: 10.0  # 实车等 10s 发车；float 类型须带小数
      reset: "N10,y"
      scan_mode: continuous  # lock 模式下 inert（扫描由 AimTask 下发）；绝不发 1 降级单次
      # 离站条件：发数增量 ≥ shots_per_stop 或 到站起 30s 硬死线，先到即离；0 发也 30s 离站。
      shots_per_stop: 10  # 打满 10 发即离站
      shoot_timeout_s: 30.0  # 到站起累计硬死线 s
      lock_timeout_s: 6.0  # 找靶阶段最长 s
      settle_time_s: 0.4  # 判停稳秒数
      bridge_info_wait_s: 2.0  # 等无人机桥洞情报最长 s

    step:
      wait_timeout_s: 0.0  # 0=一直等信息边界（默认）；>0 超时退出（run_live 退出码 4）
      layout_ttl_s: 0.0  # 显式取消保质期 ⇒ gate_policy=auto 判 warn、运行面互锁降 warn+日志；缺键则 hard

    planner:  # 车上自动规划（mission.py:_load_startup_route / plan_route_from_config）
      # 规划引擎：tour=历史引擎（:PIVOT 消解 180° 折返，默认、行为逐字不变）；
      # tracker-safe=新引擎（禁 180°/紧凑 U，跑双门禁）。现役 tour（tracker-safe 现役图无解）。
      # ⚠ 全文须恰有一个 auto_plan_enabled 真值字面串（test_config_selfcheck 会替换首个）；
      #   注释里不要写键值字面串。
      engine: tour  # 现役 tour
      # 足迹诊断：warn=只报不拦（默认，折线口径拐角偏保守）；error=有侵入即门禁未过。
      # ⚠ 启用 auto_plan 前必须重跑执行层验证（D-011），不要只凭规划成功就认定可跑。
      footprint_gate: warn
      # tracker-safe 预算 s：旧实测中位2788ms，max(3×,+5s)约8.36s，上取预算10s；不是公式恰得10。
      tracker_max_seconds: 10.0  # 车端实测取值（见上）
      auto_plan_enabled: true  # 布局模式：零地图，路线由无人机 field_layout 运行期规划（false=手写 mission_blocks）
      map_path: ""  # 空串=布局模式（车端不留地图，地图只由无人机下发）
      fallback_to_tokens: false  # 失败不回退手写路线（回退=按旧图出车，比停车危险）⇒ 停车报错
      allow_reverse: false  # 真车不支持倒车 ⇒ 规划无倒车段
      max_seconds: 2.0  # 规划时间预算 s；超出走 fallback
      pivot_penalty: 5.0  # 折返惩罚/处
      mine_turn_penalty: 2.0           # ★ 雷格不得作拐点（车心必须压过雷心；0=关闭）
      obstacle_margin_m: 0.02  # 障碍净空余量 m：柱半径0.1275+现车半宽0.085+本值；拐角另按physics扫掠判据
      # ★ 桥洞进洞前对正惩罚（米）：驱动 A* 把洞口前 1 格的 90° 拐弯顶点前移 1 格；
      #   本键故意注释掉，生效值=planner.py 常量 2.0。写成真键会多 warn，且 test_autoplan 8.4
      #   硬钉 planner 段恰好 11 键 ⇒ 要徒手调须同步 SCHEMA 与测试（非本卡写域）。

    aim:
      # 双射击停站+红面早退：蓝面朝向本局随机但恒定；本侧只见红 ≥ red_early_leave_s 就去对侧。
      red_early_leave_s: 3.0  # 红面确认阈值 s
      stop_on_hit: false  # 命中是否提前停火；false=打满 10 发，停火只由预算/30s 死线
      # 云台扫描单写者四键（默认值未写入）：lock=true 时只有 AimTask 写 /nav/scan_request，
      # 巡迹/离站/FINISH→0，SHOOT 停站→2；lock=false 才由 Mission 按 scan_mode 下发。
      lead_time_s: 0.27  # 提前量 s（链路真实延迟 0.5~0.9s；现按实测 0.27）
      fire_policy: moving_lead  # moving_lead / sweep / turnaround（本靶无端点停顿）
      rail_span_m: 0.70  # 轨道行程 m
      target_speed_mps: 0.04  # 不直接算提前量；仍用于估计器速度夹紧/停靶阈值，不能当无消费者残留删除
      # 轨道 px/m：px_per_m_rail=|Δdx|/rail_span_m(0.70)；现场把靶放两端各记一次 dx。
      # 默认 140 只是估值（4cm/s≈5.6px/s ⇒ 30fps 每帧 0.19px）。
      px_per_m_rail: 140.0  # 140 为估值，现场标定
      # 弹药三键改由 /dzrknn_dataprocess 迁移（max_shots / max_shots_per_target / shot_cooldown_ms）；
      # 本段不再重复赋值，现场改值一律改云台段。
      lost_frames_to_rescan: 60  # 丢靶多少视觉帧回扫
      scan_pitch_offset_deg: +10.0  # 与 dzrknn 段对齐 +10（实测 + 向下压）；dzbrain 无消费者

    fix:
      anchor_at_waypoint: true  # 到位吸附（格心锚定）
      scale_est_enabled: true  # 在线比例误差估计

    # 漂移修复参数（写侧 tasks/localization.py；读侧 pursuit/controller.py）；这是现场配置，
    # 不等于SCHEMA默认；test_motion_limit有预存未同步断言，不能据旧测试说明倒改现场值。
    localization:
      anchor_max_pull_m: 0.12  # 单次吸附位移上限 m
      anchor_reject_eps_m: 0.005  # 吸附后离折线不变远容差 m
      anchor_scale_max: 0.08  # 隐含尺度误差判别上限
      implied_scale_window: 4  # 尺度/沿程修正统计窗口（拍）
      reanchor_pull_max_m: 0.35  # 横向重锚单次上限 m（仅顶点窗口）
      drift_slow_after: 3  # 连续超阈值即降速（999→3）
      drift_slow_speed_mps: 0.08  # 降速目标 m/s
      drift_stop_after: 8  # 连续超阈值即停车（999→8）
      drift_clear_ticks: 5  # 连续干净 N 拍撤销降速/停车
      boundary_guard_m: 0.25  # 离安全边界多近开始限速 m
      boundary_guard_speed_mps: 0.08  # 边界限速 m/s
      boundary_stop_m: 0.10  # 离安全边界多近请求停车 m（须 >0.044 滑行距离）
      yaw_trim_deg: -0.6  # 横向漂移补偿角 deg：右漂取负；两点插值零点 -0.6；0=关
      # 原 yaw_rate_floor_dps 已删（从未被读取）；现行由 yaw_diff_gain_dps_per_mps 承担；本车阿克曼不能原地转。

    drone:
      enabled: true  # 无人机链路总开关
      heartbeat_timeout_s: 3.0  # 心跳超时 s
      info_stale_s: 30.0  # 情报过期 s

    safety:
      pose_timeout_s: 1.5  # 位姿超时 s
      task_stall_s: 1.5  # 任务停滞 s
      startup_grace_s: 8.0  # 启动宽限 s（吸收冷启动抖动）
      brake_on_fault: true  # 故障刹车

# ==== 底盘 · /dzactuator（整份 YAML 由 bringup.launch.py 当 params-file 喂入）====
/dzactuator:
  ros__parameters:
    serial_port_name: "/dev/dzactuator"  # udev 软链（插拔不变）
    serial_baud_rate: 115200  # 串口波特率

    odom_frame_id: "odom"
    robot_frame_id: "base_link"
    gyro_frame_id: "imu_link"

    calibrate_lineSpeed: 0  # 1=打开左右轮/位姿逐拍调试打印，0=关闭；两者均按ticksPerMeter/ticksPer2PI换算
    # ticksPerMeter：直行 1m 的编码器计数（标定：直行 2.10m 读计数 N ⇒ N/2.10；误差<3%）。
    # ★ 2026-10-11 实测修正 2776→3280：信念 4.55m 实走 3.86m（虚增 17.9%）⇒ 3272；
    # 与 v1 旧值 3290 均在卷尺 ±2cm 带内取中。复验：停位距 A10 ≤4cm。
    ticksPerMeter: 3280.0  # 直行 1m 编码器计数（现行）
    # ticksPer2PI：原地 360° 的编码器计数，决定航向精度。沿革 2723→2680→2630→2670。
    # 几何等价轮距 2670/(2π×3280)=0.1296m，与实测 0.157m 偏差 17.5%，仲裁挂账。
    # ⚠ 单档仅 -0.37%，单趟噪声可盖过 ⇒ 看多趟同向趋势；每档 1.5% 量级。
    ticksPer2PI: 2670.0  # 原地 360° 编码器计数（现行）

    vehicle:
      length_m: 0.28  # 车体长 m
      width_m: 0.17  # 车体宽 m（实测 0.17；半宽 0.085 进判据）
      coverage_radius_m: 0.035  # 车心假设圆半径 m（压雷判据）
      # 参考点(后轴中心)→车体几何中心的纵向偏移 m，正=中心在参考点前方；实测 +7.5cm。
      # 消费者 route/physics.py；计入后 J8→J7→I7 拐角余量由 +7.6mm 变 -5.2mm ⇒ 放行新引擎前现场复核。
      ref_offset_m: 0.075  # 后轴中心→车体几何中心 m（正=前方）
    field:
      obstacle_radius_m: 0.1275  # 障碍圆柱半径 m
      mine_pad_m: 0.12  # 雷垫片边长 m
      barrier_width_m: 0.02  # 挡板厚度 m
      barrier_cols: "D..N"  # 挡板覆盖列

    smooth_window_speed: 20  # 速度平滑窗口（调试期勿动）
    smooth_window_angle: 5  # 角度平滑窗口（调试期勿动）
