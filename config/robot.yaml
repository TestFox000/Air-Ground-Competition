# =============================================================================
#  智能车 · 统一配置中心   robot.yaml
# -----------------------------------------------------------------------------
#  ★ 全车唯一需要改参数的地方。改完【不需要重新编译】，重启对应节点即生效。
#
#      整套重启:      ~/dzrobot/start_all.sh restart
#      只重启云台:    ~/dzrobot/tools/restart_node.sh gimbal
#      体检参数:      ~/dzrobot/tools/healthcheck.sh
#
#  ★ 为什么用这个文件而不是改 launch / 改代码：
#      以前参数散在三处（.h 默认值 / .cpp declare_parameter / launch 字典），
#      改一处另两处不跟着变，已经因此踩过坑（俯仰 -6° 改了没生效）。
#      而且 launch 用 LaunchConfiguration 传的是【字符串】，节点声明的是
#      double/bool/int —— 类型不匹配会【静默失败】，参数根本设不上去。
#      现在这里全是 YAML 原生类型，启动后可用 healthcheck.sh 核对是否真的生效。
#
#  ★ 三条硬性不变量（healthcheck.sh 会自动校验，违反会报 ERROR）：
#      ① track_deadzone_px  <  fire_dz_far_px
#         死区必须小于最小开火框，否则目标停在死区里、永远进不了开火框 → 一发打不出
#      ② fire_dz_far_px     >  能达到的机械精度(约 12px)
#         开火框若小于云台实际能压到的精度，就会出现"时而打得中时而打不中"
#      ③ lost_frames_to_rescan 覆盖住视觉抖动周期(约 60 帧 = 2s)
#         太短会导致识别间歇时被判"目标脱离视野"，锁定保持率暴跌
# =============================================================================


# =============================================================================
#  云台自瞄  dzrknn_dataprocess
# =============================================================================
/dzrknn_dataprocess:
  ros__parameters:

    # -------------------------------------------------------------------------
    #  扫描姿态
    # -------------------------------------------------------------------------
    scan_yaw_min_deg: -160.0       # 水平最小角(相对车头，右为正)
    scan_yaw_max_deg: 10.0         # 水平最大角
    # ★俯仰基准角（度）。约定：负=向下压，正=抬头。
    #   ⚠ 下面这行历史上注释写的是 -26（第六次下压），但实测值早已被改成 +6.0，
    #     注释与值长期不符，是这次"云台追不上地面靶"误判的直接原因。
    #   2026-10-03 起：跟踪模式已改走机械限位（不再被本值钳住）；
    #     但【扫描模式】仍以本值为基准 —— 若扫描时看不到地面靶，
    #     把本值改回负数（-20 ~ -26 之间试），不要盲调 tracking_pitch_margin_deg。
    scan_pitch_offset_deg: 6.0
    # ★★ 多层俯仰扫描（本次新增）★★
    #   踩过的坑：原来扫描只在 pitch = 0 + (-8°) = -8°，而靶在 0.35m 外的地面上，
    #   需要的俯角约 atan(0.30/0.35) ≈ 40° —— 靶直接掉出画面下沿，
    #   云台只能偶尔瞄到一点（日志里"发现目标"之后马上"脱离视野"）。
    #   现在让扫描【每扫完一趟就换一层俯角】，把近处地面也扫进来。
    #   ★ 这个参数以前根本没法配：launch_ros 不接受 Python list
    #     （写 [0.0] 会抛 "Unrecognized data type: <class 'list'>" 导致节点起不来）。
    #     改用 params YAML 之后，原生列表终于可用 —— 这是配置中心的直接红利。
    #   列表里每个值是一层的角度(相对水平，上为正)，会再叠加 scan_pitch_offset_deg。
    scan_pitch_levels: [0.0]        # ★只做水平扫描（取消多层俯仰）
    scan_yaw_dirs: 8               # (兼容保留) 旧逐点扫描的点数，连续扫描下不参与计算
    scan_dwell_ms: 300             # 每个点最短驻留(ms)
    scan_passes: 2               # 一轮 = 左一趟 + 右一趟（射击点连做两轮）
    scan_arrive_tol: 30            # 到位容差(刻度)

    # -------------------------------------------------------------------------
    #  速度体系
    # -------------------------------------------------------------------------
    patrol_speed_ratio: 0.10       # ★扫描速度 = gimbal_max_speed × 该比例 (0.35 = 35%)
    gimbal_max_speed: 3700         # 云台最大转速(刻度/s)
    track_speed_max: 0             # ★跟踪速度上限(刻度/s)。>0 = 用这个绝对值；
                                   #   0 = 按 patrol_speed_ratio 派生（降扫描速度会拖累跟踪）
    track_speed_max_ratio: 0.63    # 跟踪上限 = 巡逻速度 × 该比例（仅 track_speed_max=0 时生效）

    # -------------------------------------------------------------------------
    #  主循环频率（流畅度）
    # -------------------------------------------------------------------------
    #  自适应：跟踪时保控制精度，扫描/空闲时降频省算力，把 CPU 让给 RKNN 推理。
    #  注意：丢帧计数都在【视觉回调】里按 30Hz 视觉帧自增，与本循环频率无关，
    #        所以降频不会改变 lost_frames_to_rescan 的时间含义。
    loop_hz_track: 100             # 跟踪时主循环频率(Hz)
    loop_hz_idle: 50               # 扫描/空闲时主循环频率(Hz)

    # -------------------------------------------------------------------------
    #  云台刻度标定（改错会导致云台撞限位或反向，动前先备份）
    # -------------------------------------------------------------------------
    gimbal_center_tick: 2047       # 零位(正前方/水平)刻度
    yaw_ticks_per_deg: 11.378      # 水平 刻度/度 = 4096/360
    pitch_ticks_per_deg: 11.378    # 竖直 刻度/度 = 4096/360
    yaw_deg_sign: 1.0              # 水平方向反了改 -1.0
    pitch_deg_sign: 1.0
    # ★跟踪俯仰修正余量(度)：clampPitchToScan 在扫描俯仰范围外再留这么多度供伺服修正。
    #   踩过的坑：scan_pitch_levels 只剩一层时 min==max -> 允许区间宽度为 0 ->
    #   视觉伺服的俯仰修正全被钳掉 -> 云台俯仰僵死，改 offset 完全无效。
    # ★扫描俯仰区间之外再留多少度供【扫描时的微调】。
    #   注意：2026-10-03 起，跟踪模式已不再使用这个区间（改走机械限位），
    #   所以调它【不会再影响目标跟踪俯仰】，只影响扫描层的活动范围。
    tracking_pitch_margin_deg: 6.0
    # ★空闲归位速度比例：IDLE 时云台回到"正前方+基准俯仰"（相对巡逻速度）。
    #   不归位的话云台会冻结在最后一次的任意姿态，改俯仰参数看不出变化。
    idle_homing_speed_ratio: 0.5            # 竖直方向反了改 -1.0
    gimbal_yaw_tick_min: 100       # 水平轴硬件刻度下限
    gimbal_yaw_tick_max: 3995      # 水平轴硬件刻度上限
    gimbal_pitch_tick_min: 950     # 竖直轴刻度下限(下位机钳位)
    gimbal_pitch_tick_max: 2400    # 竖直轴刻度上限(下位机钳位)

    # -------------------------------------------------------------------------
    #  瞄准精度与消抖
    # -------------------------------------------------------------------------
    ema_alpha: 0.55                # 视觉低通滤波系数(0~1)。越小越平滑但延迟越大
    track_deadzone_px: 4           # ★跟踪死区(px)。必须 < fire_dz_far_px
    track_kp: 8.0                  # PD 比例增益
    track_kd: 3.0                  # PD 微分增益
    fine_zone_px: 20               # 精调档阈值(px)
    fine_kp_scale: 0.5             # 精调档 Kp 缩放
    fine_kd_scale: 2.0             # 精调档 Kd 放大
    predict_gain: 0.5              # 目标移动预判强度(帧)

    # -------------------------------------------------------------------------
    #  开火判据
    # -------------------------------------------------------------------------
    fire_dz_dynamic: true          # 启用动态开火框（目标越近视差越大、框越宽）
    fire_deadzone_px: 8            # 固定开火死区(px)，仅 fire_dz_dynamic=false 时使用
    fire_dz_far_px: 14.0           # 远距离开火死区(px)。★必须 > 云台机械精度(约12px)
    fire_dz_near_px: 26.0          # 近距离开火死区(px)
    box_w_far: 30.0                # 远处目标框宽标定值(px)
    box_w_near: 120.0              # 近处目标框宽标定值(px)
    fire_hold_frames: 5            # 连续满足多少帧才开火
    fire_use_image_stable: true    # 稳定判据：true=画面稳定 / false=电机静止
    fire_stable_px_per_frame: 1.5  # 画面稳定阈值(px/帧)
    fire_real_speed_max: 20        # 电机静止阈值(realV)
    fire_speed_max: 50             # 开火时指令速度上限
    target_confirm_frames: 8       # 扫描确认帧数（确认后才允许射击）
    cls_switch_confirm_frames: 5   # ★P1-3 蓝/红类别改锁需【连续】多少帧。
                                   #   视觉偶尔会把蓝靶某一帧判成红靶，若直接采信当帧类别，
                                   #   fire_only_blue 下会频繁掐断开火，表现为"明明瞄上了却打不出去"。
                                   #   5 帧(约 0.17s)足以吸收单帧抖动；调大更稳但改锁更慢。
    shot_cooldown_ms: 500          # 两发之间最小间隔(ms)

    # -------------------------------------------------------------------------
    #  弹药控制
    # -------------------------------------------------------------------------
    fire_only_blue: true           # ★仅攻击蓝色靶(cls==1)，红靶只跟踪不开火
    max_shots: 10                  # 全程可用发数(硬上限 10)
    max_shots_per_target: 3        # ★单目标连发上限，防止把全程弹药倾泻在一个靶上

    # -------------------------------------------------------------------------
    #  激光同轴标定（用连续激光笔测出后填这里）
    # -------------------------------------------------------------------------
    laser_offset_x: 0.0            # 激光落点相对画面中心的水平偏移(px)
    laser_offset_y: 0.0            # 激光落点相对画面中心的竖直偏移(px)

    # -------------------------------------------------------------------------
    #  目标筛选与状态机
    # -------------------------------------------------------------------------
    aspect_min: 0.60   # ★放宽：实测靶框比例 0.76~0.83，原下限 0.77 把约一半检出挡在边界外
    aspect_max: 1.60   # ★同步放宽上限
    lost_frames_to_rescan: 180     # ★跟踪丢帧回扫描阈值。太小会让识别间歇被判"脱离视野"
    vision_timeout_ms: 1000        # 追踪中多久收不到视觉结果就强制回扫描(ms)

    # -------------------------------------------------------------------------
    #  车体转动前馈（惯性凝视稳定，车转时云台反向补偿）
    # -------------------------------------------------------------------------
    gyro_ff_gain: 0.0              # 前馈增益(0 = 关闭)
    gyro_ff_sign: 1.0              # 补偿方向(±1)
    imu_ff_timeout_ms: 200         # IMU 失联暂停阈值(ms)


# =============================================================================
#  相机  usb_cam  （节点名 usb_cam_node）
# =============================================================================
/usb_cam_node:
  ros__parameters:
    video_device: /dev/video0     # 相机设备
    image_width: 640              # 图像宽度
    image_height: 480             # 图像高度
    framerate: 30.0               # 帧率
    pixel_format: yuyv            # 像素格式: yuyv | mjpeg
    io_method: mmap               # 采集方式: mmap | read | userptr
    brightness: 0                 # ★亮度。范围 -64~64，默认 0。
                                  #   曾因被设成 50 导致画面大片过曝、颜色特征崩掉
    # 其余相机控制项保持驱动默认（自动曝光/自动白平衡），不要随意覆盖


# =============================================================================
#  射击驱动  dzjudgment   ★★ 这才是真正点亮激光的节点 ★★
# -----------------------------------------------------------------------------
#  完整链路：
#     dzrknn_dataprocess（云台自瞄，判定"瞄稳了"）
#         │ 发布 /LaserShot_Command (UInt8 = 1)
#         ▼
#     dzjudgment（本节点，上位机↔车载裁判/激光模块通讯）
#         │ 串口写 6 字节帧  B5 5B 03 21 01 25
#         ▼
#     激光发射模块  → 开火
#
#  ★★★ 踩过的巨坑（务必保留这段注释）★★★
#    这个节点以前【根本没被启动过】。
#    start_all.sh 只起了 dzrknn_dataprocess（云台控制），
#    而《案例9：云台控制与射击》明确写了 dzshooting.launch.py 要同时起两个：
#        dzrknn_dataprocess（云台控制） + dzjudgment（上位机与车载裁判系统通讯）
#    后果：ros2 topic info /LaserShot_Command 显示
#          Publisher count: 3   Subscription count: 0
#    云台算得好好的开火指令全发进了空话题 —— 激光永远不亮，还完全没报错。
#
#  ★ 排查口诀：开火没反应时，第一件事就是查
#      ros2 topic info /LaserShot_Command
#    只要 Subscription count 是 0，就是本节点没起来。
# =============================================================================
/dzjudgment:
  ros__parameters:
    mcuserialport: "/dev/dzjudgment"   # udev 软链 -> ttyACM1（与底盘 /dev/dzactuator 互不干扰）
    mcubaudrate: 115200


# =============================================================================
#  视觉检测  det_node
# =============================================================================
/det_node:
  ros__parameters:
    model_path: ""            # 空 = 用包内 share/det_node/model/light_det.rknn
                              # 想临时换模型：填绝对路径，然后把 hot_reload 开着，
                              # 覆盖文件即可自动重载，不用重启节点。
    draw: true                # 是否弹出识别画面窗口。
                              #   false = 关窗口，省掉 30Hz 的 imshow+waitKey 开销
                              #   （在 ARM 板上相当可观）。只想看网页画面时建议关掉。
    thread_num: 8             # RKNN 推理线程数。CPU 吃紧可降到 2。
    max_fps: 30.0             # 推理帧率上限。30 = 跟随相机(默认)；降到 20 可明显省 CPU，
                              #   代价是延迟略增。<=0 表示不限制。
    hot_reload: true          # 模型文件 mtime 变化时自动热加载。
                              #   换模型：cp 新模型覆盖 light_det.rknn，1 秒内自动生效。

# =============================================================================
#  循迹 / 自主行驶  path_executor
# -----------------------------------------------------------------------------
#  说明：path_executor.py 不是 ROS 参数化节点，而是 python3 直接运行的脚本。
#        它通过 tools/config_loader.py 读取下面这一段。
# =============================================================================
path_executor:
  ros__parameters:
    linear_speed: 0.15            # ★基础巡航速度(m/s)。0.30 = 原值；降速可让画面更稳
                                  #   从而更容易满足云台开火前的"画面稳定"判据
    auto_start: true             # ★一键启动后自动出发（调试时可临时改 false，车原地待命）
    auto_start_delay: 10.0        # ★出发前留给底盘/相机/云台完成初始化的秒数
    mission_scan_mode: continuous # continuous = 边走边扫 | waypoint = 到点停车扫描 | none
    mission_reset: "N10,y"

    # ---- ★倒车模式（global_planner 的 R: 前缀）----
    #  global_planner.py 输出的阿克曼路径里，'R:B5' 表示"倒着走到 B5"。
    reverse_speed_ratio: 0.6      # 倒车速度 = 巡航速度 x 该比例（倒车必须慢）
    reverse_steer_sign: 1.0       # ★倒车转向方向。理论推导见 path_executor 注释，
                                  #   但**没有实车依据**。上车若发现倒车时车尾偏向反了，
                                  #   改成 -1.0 即可，改完 restart_node.sh path 生效。

    # ---- ★桥洞强制直行保护（ALIGN_STRAIGHT）----
    #  桥洞两边是实墙，Pure Pursuit 逼近航点时会小幅摆头，宽度余量小时会蹭墙。
    #  进入保护段后直接关掉纯追踪转向，改用 IMU 锁航向 + 小舵角 + 低速直冲。
    bridge_blocks: ["K1", "K2", "K3", "K4", "K5", "K6", "K7", "K8", "K9", "K10", "K11"]
    # ★整个 K 列都是桥洞，每一格都被侧壁隔开 —— 车在 K 列必须【严格直穿】，
    #   任何斜切都会撞壁。所以保护点覆盖整列，而不是只标两个"通"格。
    # ★两个通口的【穿越顺序约束】（场地规划硬要求）
    #   第一个通口（下半场 row 7~11）: L* -> K* -> J*   （向西穿）
    #   第二个通口（上半场 row 1~6） : J* -> K* -> L*   （向东穿）
    bridge_order:
      - {half: lower, rows: "7-11", seq: ["L", "K", "J"]}
      - {half: upper, rows: "1-6",  seq: ["J", "K", "L"]}   # 两个通口：K4+K5 纵向相邻算一个，K10 是另一个
    align_straight_before: 2.0    # 洞前多少格开始锁航向
    align_straight_after: 1.0     # 过洞后多少格解除
    align_straight_speed: 0.10    # 直行段速度(m/s)
    align_kp: 12.0                # 航向保持增益 -> 实际舵角 = 误差deg x (align_kp/10)
    align_steer_limit: 8.0        # 直行段舵角限幅(度)，小舵角微调防摆动

    # ---- ★最佳射击点自主计算（tools/shoot_planner.py）----
    #  分工：地图坐标负责"把车带到靶附近"(粗定位 0.35m 粒度)，
    #        视觉云台负责"30cm±10cm 内的精瞄"。
    shoot_distance_target: 0.35
    shoot_distance_min: 0.20
    shoot_distance_max: 0.45
                                  # 注：格距 0.35m 时正交相邻=0.35m（合格），
                                  #     对角相邻=0.495m（超限），所以每个靶通常
                                  #     只有 3~4 个候选点（边行更少），这是几何决定的。
    shoot_max_retry: 3            # ★每个靶最多尝试几个候选点，失败自动换下一个
    shoot_score_w_gimbal: 0.6     # 评分权重：云台偏转角代价（偏角大=锁定慢）
    shoot_score_w_detour: 0.5     # 评分权重：路径绕行代价

    # ---- ★打靶执行（定点狙击）----
    # ★本候选点打满这么多发就收站去下一个点（靶子全场只有一个，走到最佳射击点
    #   狠狠瞄、狠狠打即可，不必耗尽全场 10 发）。
    #   ★必须 <= 云台 max_shots_per_target(默认 3)：云台到这个数就停火，
    #     若这里要得更多，循迹就只能干等 shoot_timeout，每个射击点白等 30 秒。
    shoot_count_target: 3
    shoot_timeout: 30.0           # ★单个候选点硬超时(s)。超时立刻换点/放行，绝不卡死
    shoot_settle_speed: 0.02      # 底盘速度小于此值视为"停住"(m/s)
    shoot_stable_frames: 5   # ★降低：连续 8 帧≈0.27s 过于苛刻，降到 5 帧
    shoot_stable_offset_px: 40.0   # ★放宽容差：原 25px 与云台开火框(26px)几乎重合，判定过紧
    shoot_stable_timeout: 6.0     # 等稳定的最长时间(s)；等不到就降级放行而非死等

    # ---- ★障碍表（射击点规划器算视线遮挡用）----
    obstacle_blocks: ["B1", "I2", "F7", "C8", "E8", "A9", "H9", "D10"]
    # ★★ 真源唯一性（2026-10-03 修 C8）：本表必须与 config/map.yaml 的
    #   map.obstacles 完全一致 —— 以前这里是另一份陈旧数据
    #   (A1/C2/B4/G4/E6/I7/D9/H10)，导致两个连锁错误：
    #     ① shoot_planner 按"假障碍"算视线遮挡，射击点判据全错；
    #     ② 校验误判路线"踩了 H10/D9/G4"，而那三个格其实是合法格。
    #   改地图只改 map.yaml，这里同步即可（route_check.py 会校验一致性）。
    # ---- ★打靶三段式状态机 ----
    #  0 停稳 -> 1 请求扫描并等锁定 -> 2 开火窗口。每段都有超时兜底。
    shoot_settle_time: 0.8        # 位置连续多少秒不变才算"底盘停稳"
    shoot_lock_timeout: 18.0      # 找靶阶段(阶段1)最长时间(s)，超时换点
    shoot_overshoot_tol: 0.30     # ★云台扫描仅 ±90°：车冲过射击点后，仍在此距离内补触发停站
                                  #   原来只认"半径 0.17m 以内"，冲过去就永远不触发、静默漏打
    shoot_slowdown_m: 0.60        # ★射击点前提前减速距离(m)，防止冲过头       # ★"扫完没找到"的判定延迟(s)。
                                  #   必须 >= 一个完整扫描周期（俯仰层数 x scan_passes x 单趟耗时 ≈10s），
                                  #   否则会在扫描刚起步时就误判"没找到"而提前放弃 —— 这个坑踩过。
                                  #   注：整体流程已升级为四阶段（停稳->找靶->稳定->开火），
                                  #   本项只管"找靶"这一段；单候选点总上限见 shoot_timeout

    # ---- 越界急停保护（P0-3）----
    map_safety_margin: 0.60       # 信念位姿超出地图边界多少米即急停。防止里程计漂移后跑飞

    # ---- ★P1-1 漂移预算告警 ----
    #  每段航程结束都会把信念位姿锚回点位中心，段内漂移不会累积到下一段，
    #  所以"单段漂移"就是定位可信度的直接读数。到达判定阈值是 0.157m，
    #  单段漂移一旦逼近它，就会"越锚越偏"。默认 0.30m 留一倍余量。
    drift_warn_m: 0.30            # 单段位置漂移超过此值即告警(m)。结束横幅会汇总最大漂移

    # ---- 完成提示音 ----
    finish_voice_id: 0            # 全程跑完时通过 /voice_switch 播放的语音 ID。0 = 不播
                                  # ⚠️ 各 ID 对应哪句话没有实机依据 —— 先在车上跑
                                  #    tools/test_voice.sh 把 ID 试出来再填。
                                  #    底盘有"同一 ID 间隔不足 2s 不重播"的闸门，连播同一 ID 只会响一次。

    # ---- 路线（雷/通/靶 必须全覆盖，且不能踩到"障"）----
    #   挡板约束：第 6/7 行之间、D~N 列封死，只有 A/B/C 列能上下穿行
    mission_blocks:
      - N10
      - N9
      - N8
      - K8
      - I8
      - I10
      - G10*
      - E10
      - E9
      - D9
      - D7
      - E7
      - R:D7
      - R:B7
      - B6
      - B5
      - B3
      - A3
      - A4
      - C4
      - G4
      - G6
      - R:G2
      - G1
      - H1
      - K1
      - K2
      - K5
      - N5

# =============================================================================
#  ★ 底盘（C2：2026-10-03 接入配置中心）
#     以前这些参数写在 dzactuator/launch/bringup.launch.py 里，通过
#     LaunchConfiguration 传进节点 —— 传的是【字符串】，而节点 declare 的是
#     double/int，类型对不上就静默回落到节点内置默认值。
#     现在统一放这里，由 bringup.launch.py 直接把本文件当 params-file 喂进去。
# =============================================================================
/dzactuator:
  ros__parameters:
    # ---- 串口 ----
    serial_port_name: "/dev/dzactuator"   # ★udev 符号链接，比 /dev/ttyUSBX 稳定(插拔不变)
    serial_baud_rate: 115200

    # ---- 坐标系名（改名会牵动 TF/话题，一般不动）----
    odom_frame_id: "odom"
    robot_frame_id: "base_link"
    gyro_frame_id: "imu_link"

    # ---- ★★ 底盘标定（C1：这两个值错了，里程计就是错的）----
    #  calibrate_lineSpeed：1 = 直接用轮速计原始值；0 = 用下面两个标定值换算（默认 0）
    calibrate_lineSpeed: 0
    #  ticksPerMeter —— 直行 1 米对应的编码器计数（决定平移里程精度）。
    #  标定方法：把车放在场地直线段，遥控低速直行 6 格（6×0.35=2.10m），
    #            读出编码器计数增量 N，则 ticksPerMeter = N / 2.10。
    #  验收标准：走完 2.10m 后 /odom/localization 的位移应≈2.10m，误差 <3% 即可用。
    ticksPerMeter: 3290.0
    #  ticksPer2PI —— 原地转满一整圈(360°)对应的编码器计数（直接决定航向精度）。
    #  ★当前 3236 与"按轮距反推"的 ≈2274 差 42%，二者必有一错：
    #    差 42% 的后果是"命令转 90° 实际只转约 38°"，表现为过桥洞时航向持续偏出、
    #    还没到洞口就撞侧壁 —— 所以这个值必须实测，不能靠推算。
    #  标定方法：让底盘原地匀速转满一圈（地上贴角度基准线），读编码器增量即得。
    #  验证：命令转 90°，实测航向（serial_reader 的 yaw）应≈90°。
    ticksPer2PI: 3236.0

    # ---- 抖动抑制窗口（调试期先别动）----
    smooth_window_speed: 20
    smooth_window_angle: 5
