# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-07 迁到"现场布置图"版（上一版是 "Map-C 第三次测试图"）★★★
#   来源：现场场地布置图（14 列 A~N × 11 行，格 0.35m）逐格像素级识图提取；
#         与车上现役 ~/dzrobot/config/map.yaml **字节一致**（md5 b393dcbb…）。
#   与旧图差异：雷 4/8 变、障 7/8 变、靶 G11 -> G11+H11（轨道移动靶）、通 K2/K8 -> K4/K9。
#   交叉验证（三条独立证据指向同一套格号）：
#     ① F7 恰为障碍、A8 恰为障碍、C4/H1/G2/I10 恰为雷、K4 恰为通 —— 与旧图/源码默认值重合；
#     ② 图左上角"智能车起点"落在 N10、终点 N5，与 mission_reset/终点一致；
#     ③ 挡板绿线在 A/B/C 三列 0 像素、D 列起有标记 —— 与"挡板横跨 D~N、只有 A/B/C 能上下穿行"一致。
#
# ★ 2026-10-07 用户澄清的赛道模型（比"两处桥洞"更准确，新版本按此实现）：
#   · 整个 K 列是一座桥，**每一格都是一个桥洞**，分界处有一格宽挡板；
#   · 小车走的是 **U 形赛道**：N10 出发 → 穿下半场桥洞（候选 K7~K11 之一，向西）→
#     绕过 D6~N6 / D7~N7 之间的隔板（必经 A/B/C 列）→ 压雷/避障/打靶 →
#     穿上半场桥洞（候选 K1~K6 之一，向东）→ 终点 N5；
#   · **每次穿洞的具体格是每局随机的**，只有无人机能看到桥顶标识 ——
#     所以下方 bridges 只是"本局现场识图结果"，新版本用 route.cross_*_candidates
#     表达候选集合、由无人机情报选格（见 robot.yaml 的 /dzbrain 段）。

map:
  name: "现场布置图 2026-10-07 (识图标定)"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过
  mines:      ["H1", "G2", "C4", "A6", "D6", "F8", "I10", "E11"]
  # 障(8)：水桶，不可通行且遮挡视线
  obstacles:  ["D1", "B3", "I3", "F7", "A8", "E9", "G9", "C11"]
  # 靶：相连两格 = 打击区（内放**移动电子靶标**，轨道行程 0.70m，4cm/s 来回走）
  targets:    ["G11", "H11"]
  # 通(2)：本局识图看到的两个桥洞格（K 列每格都是洞，可通行格每局随机）
  bridges:    ["K4", "K9"]
