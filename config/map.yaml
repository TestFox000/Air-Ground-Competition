# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-12 第四次换图：用户新图 C:\...\modlens-dsh-paste\p-iEq26E\paste.png ★★★
#   源图 sha256 = e6448ea155a3c00f48c9b67fb7bd2586858e7c793a00f7a3efbc2067c68faaa8（1002×802 px）
#   识图方式（**两套独立证据交叉**，全部像素级、可复现）：
#     证据A 逐格颜色占比：红>0.75⇒障 / 黄≈0.84⇒雷 / 品红≈0.79⇒靶 / 绿≈0.79⇒通
#     证据B 格左上角格名标签是否被盖住（有彩色块的格子标签必被盖）—— 与A冲突格=0
#     证据C 黄块形态：0.9 格近方纯色块(深色像素≈0)=雷；1.0 格满格含文字/图标=起终点标注框
#   脚本：_tmp_session/t1_newmap/analyze_map2.py + analyze_barrier.py
#         输出：_tmp_session/t1_newmap/identify_out2.txt + barrier_out.txt
#   门禁：独立验证 t2 复核通过（route_check 0 error + 物理几何 8/8 盖雷 + 双档仿真）。
#
#   ★ 本次读数与上一版 config/map.yaml（第三张图 p-81Zc2l）的要素集合**逐格完全一致**：
#     雷 8 / 障 8 / 靶 2 / 通 2 / 起终各 1 全部同格 —— 即这张"新图"在要素层面与上一版等价。
#     （差异只在图上多画了两样东西，见下"本图比旧图多画的内容"。）
#
#   数量勾稽：雷8 + 障8 + 靶2 + 通2 + 标注框4（N10/N5/N8/M2）= 24 个彩色块，与连通域检出数吻合。
#
# ★ 本图比旧图**多画**的内容（两处，且都印证了现场口径）：
#   ① 隔板被画出来了：行6/7 分界 y=435 处一条绿色细线，x=219..1001
#      ⇒ 列 D（x 左缘 218）→ N 列右缘，**K 列内覆盖率 98.6%（无缺口）**
#      ⇒ 独立证实「挡板 D..N 含 K 段、K 处无通口」的老口径，也即"要上下半场只能走 A/B/C 列"。
#   ② 起点/终点是"一整个格子"的实心标注框（35×35cm），不是一个小图标：
#      N10=智能车起点、N5=智能车终点、N8=无人机起点、M2=无人机终点（框内带白色 H 直升机图标）。
#      ⚠️ 特别提醒：M2 的框左缘 x=850、右缘 x=920，**整块落在 M 列**；图上紧邻其右侧的 "N2"
#         字样是 N 列的**格名标签**（未被盖住），不是这个框的格名 —— 肉眼极易读成 N2。
#
# ★ 赛道模型（沿用，未变）：整个 K 列是一座桥，每格都是横向贯通的桥洞，格与格之间有侧壁；
#   挡板在第 6/7 行之间 D~N 列封死 ⇒ 小车只能走 U 形：N10 出发 → 下半场穿洞向西 →
#   绕 A/B/C 列上到上半场 → 压雷/避障/打靶 → 上半场穿洞向东 → 终点 N5。
#
# ★★ 接入方式（2026-10-12，卡 t3）：本文件是**唯一真源**（所有消费方——route_check /
#   planner / sim / config_selfcheck——都按文件名 config/map.yaml 查找）。识图产物
#   config/map_v3.yaml 保留为原始证据文件（与本文要素逐字一致），但**没有任何代码引用它**。
#   路线侧不动：`route.tokens` = `path_executor.mission_blocks` = 现役手工 62 点
#   （t3 独立物理复核：@0.30/@0.35 盖雷 8/8、障碍碰撞 0、挡板触线 0、压靶 0；
#    自动规划 65 点被物理链否决：@0.30 盖雷 5/8、@0.35 真碰撞 D7 5 拍）。

map:
  name: "第四张新地图 2026-10-12 识图（要素集合与第三张图逐格一致）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过。图内为 0.9 格近方纯色黄块（深色像素≈0，与起终点黄框可区分）
  mines:      ["B2", "H2", "F3", "C4", "G4", "I7", "D8", "E10"]
  # 障(8)：水桶，不可通行且遮挡视线。图内为满格红块
  obstacles:  ["A5", "G5", "B6", "D7", "C8", "E9", "I9", "H10"]
  # 靶：E4+E5 纵向相邻两格 = 【一块跨格靶板】(35×70cm 实体，车体不可压，只在旁边停站射击)
  #   图上是两块品红方块（各带圆角、中间 7px 无色），按现场口径"相邻两格=一块板"合并为一块
  targets:    ["E4", "E5"]
  # 通(2)：上半场 K1 + 下半场 K11（现场随机开 2 个通格；图上仅此两格为绿色"通"）
  bridges:    ["K1", "K11"]
