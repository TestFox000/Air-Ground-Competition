# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-11 第五次换图（卡 t29）：用户新图 → 识图 → 本文件（唯一真源）★★★
#   源图：_tmp_session/t28_newmap/map_src.png（912×732 px / 203,908 B）
#         sha256 = d0159f11a0c197f1296cc55b36e0c36aed6a8a627941663b193535d93f765dda
#   识图：_tmp_session/t28_newmap/identify_t28_v2.py（三套独立证据交叉，冲突 0 条）
#         证据A 四色连通域 → 色块 bbox/质心 → 最小二乘反推格网（格宽 64.03 px、格高 64.00 px
#               ⇒ 场地 896×704 px = 14 列 × 11 行 × 0.35 m/格 = 4.90 m × 3.85 m）
#         证据B 每格左上角**格名标签是否被盖住**（有实色块 ⇒ 标签消失）：块格 lab ≤33 / 空格 ≥43，完全分离
#         证据C 黄色块 0.9 格近方纯色块 = 雷；整格含文字/图标 = 起点/终点/无人机标注框
#   识图结果（写入下方 map: 段）：
#     雷 8：B1 G2 H3 A4（上半场） / D8 F9 I10 E11（下半场）
#     障 8：D1 F4 A5 H5（上半场） / B7 C9 E10 G11（下半场）
#     靶：B11 + C11（**横向相邻**，图上两块各 58×58 px、中间 6 px 无色 ⇒ 现场口径并成一块 35×70 cm 跨格靶板）
#     通口（桥洞）：K5（上半场）/ K10（下半场）
#     起点 N10（车头朝 +y = 图左；mission.reset="N10,y"）、终点 N5
#     无人机点：N8（无人机起点）、M2（无人机终点，框内白色 H 起降点图标）
#     隔板：第 6/7 行之间、D~N 列**连续无缺口**（逐列绿色覆盖率 D=0.98 … N=1.91、K=2.09）
#   来源文件：_tmp_session/t28_newmap/map_t28.yaml（t28 交付，本卡原样接入 + 补本段溯源）
#
# ★★ 与上一版（第四张图，源图 sha256 e6448ea155a3c00f48c9b67fb7bd2586858e7c793a00f7a3efbc2067c68faaa8）
#   **不同构**：网格/坐标系/起终点/隔板几何相同，但
#     雷 8 里只重合 D8；障 8 里只重合 A5；靶 E4+E5（纵向、上半场）→ B11+C11（横向、下半场）；
#     通口 K1/K11 → K5/K10。
#   实证：把第四张图的 62 点路线原样放到本图跑（t28 `extra_checks.py`，@0.35 同口径）
#     ⇒ 盖雷仅 4/8（漏 G2/A4/I10/E11）、车体真碰撞 2639 拍、硬违规 3943 拍 ⇒ **路线不可复用**。
#     换图必须同步：`route.cross_lower_candidates=["K10"]` / `route.cross_upper_candidates=["K5"]`
#     （否则 tools/route_check.py 会按旧候选集误报 R008）、`planner.engine=tracker-safe` 由车上重规划。
#     旧图备份：`_tmp_session/t29/map_4th_backup.yaml`（本卡覆盖前逐字节复制）。
#
# ★ 赛道模型（沿用，未变）：整个 K 列是一座桥，每格都是横向贯通的桥洞，格与格之间有侧壁；
#   挡板在第 6/7 行之间 D~N 列封死 ⇒ 小车只能走 U 形：N10 出发 → 下半场穿洞向西 →
#   绕 A/B/C 列上到上半场 → 压雷/避障/打靶 → 上半场穿洞向东 → 终点 N5。
#
# ★★ 接入方式（2026-10-11，卡 t29）：本文件是**唯一真源**（所有消费方——route_check /
#   planner / sim / config_selfcheck——都按文件名 config/map.yaml 查找）。
#   config/map_v3.yaml 保留为历史原始证据文件，**没有任何代码引用它**。

map:
  name: "第五张新地图 · 2026-10-14 官方贴图重掷版（用户当面贴图 + 队长/感知线双独立识读逐格一致）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # ★ 2026-10-14 重掷：源 = 用户粘贴官方图 _tmp_session/t39_map_official/map_official.png（sha256 273BA796EFEC03EE0F4EFCD8A99201C208D642A97D8292E672ED3088D0A06BB9）
  #   队长识读 _tmp_session/t39_captain_read/official_identify.txt（红块 LSQ 格网残差 max 0.16px）
  #   感知线识读 _tmp_session/t39_map_official/read_report.md（蓝框内边+灰线 LSQ，45.59px/格）
  #   两版逐格一致；四黄框标注精确落 N10/N5/N8/M2（格网注册铁证）；隔板行6/7 D~N 连续无缺口（覆盖 1.00）
  #   与 2026-10-11 版相比：20 点位里 19 个不同，仅 K5 一格重合 ⇒ 旧路线一律不可复用
  # 雷(8)：必须全部压过。0.9 格近方纯色黄块（深色像素≈0，与起终点黄框可区分）
  mines:      ["C1", "A3", "E3", "G4", "I6", "B7", "D9", "H10"]
  # 障(8)：水桶，不可通行且遮挡视线。满格红块
  obstacles:  ["A1", "E2", "H4", "D8", "I8", "G9", "B11", "F11"]
  # 靶：E5+F5 横向相邻两格 = 【一块跨格靶板】(35×70cm 实体，车体不可压，只在旁边停站射击)
  targets:    ["E5", "F5"]
  # 通(2)：上半场 K5 + 下半场 K9（现场随机开 2 个通格；图上仅此两格为绿色"通"）
  bridges:    ["K5", "K9"]
