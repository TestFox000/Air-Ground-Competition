# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-11 第三次换图（用户第三张图 p-81Zc2l/paste.png，n11）★★★
#   来源：sim-operator t11 逐格识图（_tmp_session/n11_newmap2/identify_out.txt + 报告.md），
#         手工路线 v3（62 token）经 route_check 0 error + @0.15/@0.30 双档权威仿真全合规
#         （盖雷 8/8、压靶 E4/E5/板心 0/0/0、隔板触线 0、出场地车心 0.0cm）。
#   要素：雷 8（B2 H2 F3 C4 G4 I7 D8 E10）；障 8（A5 G5 B6 D7 C8 E9 I9 H10）；
#         靶 2（E4+E5 纵向相邻 = 一块跨格靶板，用户口径：跨格实体不可压过）；
#         通 2（K1 上半场 + K11 下半场——本图下半场通口在最外一行）。
#
# ★ 赛道模型（沿用）：整个 K 列是一座桥，每格都是桥洞，分界处有一格宽挡板；
#   小车走 U 形赛道：N10 出发 → 下半场穿洞（向西）→ 绕 D~N 隔板（必经 A/B/C 列）→
#   压雷/避障/打靶 → 上半场穿洞（向东）→ 终点 N5。

map:
  name: "第三张新地图 2026-10-11 (p-81Zc2l 识图 + 用户确认开跑)"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过
  mines:      ["B2", "H2", "F3", "C4", "G4", "I7", "D8", "E10"]
  # 障(8)：水桶，不可通行且遮挡视线
  obstacles:  ["A5", "G5", "B6", "D7", "C8", "E9", "I9", "H10"]
  # 靶：E4+E5 纵向相连两格 = 【一块跨格靶板】（跨格实体不可压过）
  targets:    ["E4", "E5"]
  # 通(2)：上半场 K1 + 下半场 K11（本图下半场通口在最外一行）
  bridges:    ["K1", "K11"]
