# dznav 默认参数
# tools/dznav_deploy.py 会自动导出 DZ_NAV_CONFIG 指向本文件（~/dznav/config/
# 下），无需手工设置；用 --config 可换别的 yaml。
# 逐项含义见 src/dznav/dznav/executor_node.py DEFAULTS 与 pursuit.TrackerConfig
# 注意：本文件里的未知键会被忽略但**会打 warn 日志**，改键名请看车端日志。

# ---- 舵机-曲率模型 ----
# ★servo_mode 与实车的关系（2026-10-18 评审 M6）：默认 ideal 不是"实车就是
#   对称舵机"，而是 SIL 全链路（tests/sim_car.py ChassisSim）按理想对称模型
#   标定，仿真必须同源。实车舵机左右不对称是实测结论（fxxy 档案：左满舵
#   R≈0.15m / 右满舵 R≈0.44m，见 servo.py 档首）。上实车前请切：
#     servo_mode: fxxy      # 保守备选（发学员实测分段线性档案）
#     servo_mode: custom    # tools/dznav_calib.py 现场标定产物（推荐）
#   切档案属控制律变更，需重跑 tests/test_sim_tracking_dznav.py 的
#   fxxy S 弯回归 + 实车低速验证后再投入比赛。
servo_mode: ideal          # ideal | fxxy | custom（tools 现场标定后换 custom）
servo_limit_deg: 30.0      # 控制层打角上限（物理 35°）
wheelbase: 0.157           # m，现役标定
steer_trim_deg: 0.0        # 机械配平（右偏为负；原版实测约 -1.0，dznav 反馈环可吸收）

# ---- 跟踪 ----
v_max: 0.30                # m/s 巡航（速度包络 0.3-0.4，实测后调）
a_lat_max: 0.22            # m/s² 侧向加速度预算（弯道限速 v=sqrt(a/κ)）

# ---- 任务 ----
nav_timeout: 180.0         # s 单路线硬超时（比赛总预算）
shoot_target: 3            # 每停站发弹数（对齐现役 SHOOT_COUNT_TARGET=3）。
                           #   预算约束：停站数 × shoot_target ≤ 弹药总量（全场 10 发）；
                           #   旧值 10 抄自 legacy 过期 docstring，第二站起必然干等超时
shoot_timeout: 20.0        # s 停站等弹超时（对齐现役 SHOOT_TIMEOUT=20.0：
                           #   超时降级放行，宁可漏打不可卡死路线）
blend_anchor: 0.5          # 途经点位置锚增益
blend_th: 0.25             # 途经点航向锚增益（小于位置增益：防跟踪滞后污染）
anchor_delay_m: 0.35       # 出弯后再锚（跟踪收敛区，测量干净）
blend_arc: 0.7             # 出弯/终点机动锚点位置增益
keepalive_idle: false      # 待命是否发零速保活（false=静默，align 随时可做）
auto_delay: 8.0            # s DZ_AUTO_START=1 时起栈到自动发车延时
builtin_route: ""          # 自动发车路线串（如 "N10 M9 L8 ... ,y"）

# ---- 参考路径 ----
dev_cap: 0.08              # m 普通弯对顶点偏差预算（< 17.5cm 失格线）
dev_cap_critical: 0.03     # m 关键途经点（雷格）偏差预算。
                           #   注意：雷格收紧当前未接线——/nav/waypoint 语法无雷格
                           #   标记，生成的 Waypoint 一律 critical=False（详见
                           #   refpath.py Waypoint.critical 注释）；此键暂仅单测覆盖
arc_fallback_deg: 125.0    # 超此转角回落 ARC 机动（更大转角的 fillet 切角会逼近失格线）

# ---- 安全（2026-10-17 评审整改新增）----
link_timeout: 0.5          # s /odom 或 /imu_data 断流多久跳闸（仅运动态生效）
                           #   0.5s 与 dzactuator ACTIVITY_TIMEOUT 同量级；
                           #   调大会让盲跑距离线性增长（0.30m/s x t）
dt_max: 0.20               # s 单控制周期 dt 上限：进程被挂起后不让一个巨大
                           #   的 dt 使加速度限幅失效
