# 每局开赛前唯一要改的文件：裁判系统地图先验 + 摆位。
# 无人机识别到的雷/障碍/桥洞通行格（ARROW）/靶面，由 dzuav 帧实时给出，
# 不在此配置。
integrate_node:
  ros__parameters:
    # ---- 链路 ----
    udp_port: 50000                 # dzuav 态势广播端口
    waypoint_topic: "/nav/waypoint"  # 官方 path_executor 订阅的话题
    dry_run: true                   # 只算不发；实车联调通过后改 false
    publish_reset: true
    # ---- 本局摆位（现场确定） ----
    start_cell: "N11"
    start_heading: "y"              # 车头朝向断言 x(东)/y(北)
    goal_cell: "N6"
    final_heading: "y"              # 终点朝向计 5 分；最底行格只能 x
    # ---- 发车门控 ----
    min_mines: 1                    # 至少识别到几颗雷才发车
    require_face: true              # 必须先看清靶面敌我再发车
    # ---- 中场约束（留空：桥洞墙由 ARROW 自动推导） ----
    cross_gates: [""]
    mid_boundary: 6                 # 挡板在第 6/7 行之间（row5↔row6，0 基），上半场=行1~6、下半场=行7~11；2026-10-15 按车上官方地图真源修正（曾错为 5）
    # ---- 朝向补偿（根除画圆：reset 断言朝向 vs 真实朝向的固定偏差）----
    #   none  : 不补偿，靠人工把车摆正（不推荐）
    #   udp   : 用 0x4002 真实朝向取最近坐标轴，残差 ≤ 45°，不挪车
    #   align : 用 0x4002 真实朝向闭环原地转向到断言朝向，零残差（推荐）
    heading_bias_source: "align"
    # ---- 朝向对齐（align 模式）参数 ----
    # ⚠️ 底盘契约（dzactuator 源码实测）：
    #   1) path_executor 的 pursuitAngle 保活会把 dzactuator 钉在模式2，
    #      此时 /cmd_vel 被静默丢弃——align 必须在 path_executor 启动前完成
    #      （用 tools/car_match_bringup.sh 两阶段启动）；
    #   2) Ackermann 车不能原地转：v==0 时舵机回中不动，必须带爬行速度。
    cmd_vel_topic: "/cmd_vel"
    align_creep_speed: 0.05           # 对齐爬行速度 m/s（v≠0 舵机才生效；0.05 摆正 68.6° 漂移 ~0.21m，仿真验证有裕度）
    heading_align_tolerance: 0.05       # 对齐容差 rad ≈ 3°
    heading_align_max_rate: 0.5         # 最大角速度 rad/s
    heading_align_timeout: 15.0         # 对齐超时 s（超时退回最近轴）
    heading_align_settle_ticks: 3       # 连续 N tick 在容差内才算对齐
    wait_waypoint_consumer: true        # 等 /nav/waypoint 有订阅者再发路线（话题无滞留）
    # ---- 移动靶先验（全场唯一靶，裁判系统每局固定） ----
    target_track: ["D8", "E8"]      # 轨道两端格号
    target_blue_face: "S"           # 蓝面朝向 S/N(水平轨道)/E/W(垂直轨道)
    # ---- 中途重规划 ----
    replan_on_update: false         # path_executor 换路线行为实车验证后改 true
