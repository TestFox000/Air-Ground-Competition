slam_gmapping:
  ros__parameters:
    throttle_scans: 1
    base_frame: base_link
    map_frame: map
    odom_frame: odom
    transform_publish_period: 0.05

    map_update_interval: 1.0
    maxUrange: 20.0
    maxRange: 0.10
    minimum_score: 0.0

    sigma: 0.05
    kernelSize: 1
    lstep: 0.02
    astep: 0.02
    iterations: 5
    lsigma: 0.075
    ogain: 3.0
    lskip: 0

    srr: 0.05
    srt: 0.05
    str: 0.02
    stt: 0.02

    linearUpdate: 0.2
    angularUpdate: 0.2
    temporalUpdate: 1.0
    resampleThreshold: 0.5
    particles: 30

    xmin: -10.0
    ymin: -10.0
    xmax: 10.0
    ymax: 10.0
    delta: 0.05
    occ_thresh: 0.25

    llsamplerange: 0.01
    llsamplestep: 0.01
    lasamplerange: 0.005
    lasamplestep: 0.005
