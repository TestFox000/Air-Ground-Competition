amcl:
  ros__parameters:
    use_sim_time: False
    # 运动模型配置（必须，旧参数robot_model_type需删除）
    motion_model: "nav2_amcl::DifferentialMotionModel"
    differential_drive_model:
      max_vel_x: 1.0        # 根据实际速度调整
      max_vel_theta: 0.5    # 最大转向角速度
      min_turning_radius: 0.5  # 最小转弯半径（需匹配阿克曼转向特性）
    
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.4
    alpha4: 0.5
    alpha5: 0.003
    scan_topic: "scan"
    laser_queue_size: 20  # 原为10，增加到20
    tf_buffer_length: 10.0            # TF缓存长度（秒）
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.3
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 0.5
    laser_max_range: 10.0        # 建议改为5.0（RPLidar实际量程）
    laser_min_range: 0.05        # 建议添加，过滤近距噪声
    laser_model_type: "likelihood_field"
    max_beams: 260
    max_particles: 1500
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.000
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 0.2    # 建议缩短为0.5秒
    message_filter_timeout: 0.5  # 新增参数，设置消息过滤超时时间
    laser_time_tolerance: 1.0  # 新增参数，单位秒
    update_min_a: 0.2           # 建议增大为0.1，减少无效更新
    update_min_d: 0.05           # 建议增大为0.1，减少无效更新
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    set_initial_pose: true
    always_reset_initial_pose: true
    first_map_only: false
    initial_pose:
      x: 3.483847597894986                  # 建议设为原点便于调试
      y: 1.1832607998257298
      z: 0.0
      yaw: 0.0
 
amcl_map_client:
  ros__parameters:
    use_sim_time: false
 
amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false
