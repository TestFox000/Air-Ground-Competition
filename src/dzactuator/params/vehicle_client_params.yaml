# vehicle_client ROS2参数配置文件
# 支持单机器人和多机器人场景（通过namespace自动适配）

vehicle_client_node:
  ros__parameters:
    # ========== 日志配置 ==========
    # 日志级别: DEBUG, INFO, WARN, ERROR, FATAL
    # DEBUG: 最详细（包含所有调试信息）
    # INFO:  一般信息（默认，推荐）
    # WARN:  仅警告和错误
    # ERROR: 仅错误信息
    ros__log_level: INFO
    
    # ========== 基础配置 ==========
    vehicle_id: 1
    run_hz: 50.0
    
    # ========== TCP配置 ==========
    tcp:
      host: "192.168.1.117"
      port: 8888
    
    # ========== UDP配置 ==========
    udp:
      host: "192.168.1.117"
      port: 8080
    
    # ========== 相机配置 ==========
    camera_topic: "camera/image_raw"  # 相对路径，支持namespace
    camera:
      jpeg_quality: 80
      use_video_protocol: true   # 使用UDP视频协议（分片传输）
      use_cv: true              # false: ROS话题, true: CV相机
      cv_id: 0                   # CV相机设备ID
      cv_fps: 30                 # CV相机帧率
      cv_width: 640              # CV相机分辨率宽度
      cv_height: 480             # CV相机分辨率高度
    
    # ========== 话题配置（相对路径） ==========
    # 优势：支持多机器人，自动适配namespace
    # 示例：配置"amcl_pose"
    #   - 无namespace: /amcl_pose
    #   - namespace=robot1: /robot1/amcl_pose
    topics:
      pose: "amcl_pose"
      battery: "Battery_Percentage"
      vel_state: "current_vel_state"
      vehicle_state: "vehicle_state"
      camera_status: "camera_msg_valid"
      lidar_status: "scan_msg_valid"
      imu_status: "imu_msg_valid"
      path: "astarResult"
    
    # ========== Bag录制配置 ==========
    bag:
      storage_path: "~/vehicle_bags/"  # 存储路径（支持 ~/ 扩展）
      max_bag_count: 3                 # 保留最近3个bag文件
      topics:                          # 录制话题列表（相对路径）
        - "amcl_pose"
        - "scan"
        - "camera/image_raw"
        - "current_vel_state"
        - "imu"
        - "odom"
        - "PathArray"

