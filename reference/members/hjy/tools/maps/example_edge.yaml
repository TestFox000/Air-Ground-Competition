# =============================================================================
# example_edge.yaml —— 边界与异常场景（用来撞车端的健壮性）
# =============================================================================
# 目的：验证车端对**非法/极端数据**的处理，避免现场收到脏数据就崩或乱跑。
#
# 本文件故意包含多组"应该被车端拒绝或降级处理"的数据。
# ★ 每组都独立标注了**期望行为**，测试时对照日志看。
#
# 用法：
#   python3 tools/drone_sim.py --map tools/maps/example_edge.yaml --dry-run
#   python3 tools/drone_sim.py --map tools/maps/example_edge.yaml
# =============================================================================

name: "边界场景：越界坐标 / 空列表 / 单门 / 同格冲突"

field:
  start: [12, 10]
  goal: [13, 5]

# -----------------------------------------------------------------------------
# 【1】空的侦察列表 —— 期望：车端不崩，排雷计划为空（0 颗雷无需排）
# -----------------------------------------------------------------------------
# mines: []          # 取消注释可测空列表（注意：YAML 里 [] 是合法的）

# -----------------------------------------------------------------------------
# 【2】全部 8 颗雷都在**隔离线以南**（row 6..10）
#      期望：车端必须规划出能过桥洞的排雷路径；无门位时拒绝跨桥
# -----------------------------------------------------------------------------
mines:
  - [4, 7, 90]
  - [5, 8, 88]
  - [6, 9, 85]
  - [7, 10, 92]
  - [8, 6, 80]
  - [9, 7, 75]
  - [2, 8, 70]
  - [3, 9, 95]
t_mines: 0.5

# -----------------------------------------------------------------------------
# 【3】障碍物占用桥洞列 K（col=10）全部 11 行
#      期望：车端应认识到"无法过桥"，并上报 NEED_GATE / 走保底路径
# -----------------------------------------------------------------------------
obstacles:
  - [10, 0, 1]
  - [10, 1, 1]
  - [10, 2, 1]
  - [10, 3, 1]
  - [10, 4, 1]
  - [10, 5, 1]
  - [10, 6, 1]
  - [10, 7, 1]
  - [10, 8, 1]
  - [10, 9, 1]
  - [10, 10, 1]
t_obstacles: 0.8

# -----------------------------------------------------------------------------
# 【4】打击区给**越界坐标**（col=99 / row=99）
#      期望：车端**领域校验拒绝**并在日志报错（不应写进 FieldGrid）
# -----------------------------------------------------------------------------
targets:
  - [99, 99, 2, 90]      # 越界
  - [6, 4, 2, 95]        # 这一条合法，应被接受
t_targets: 1.0

# -----------------------------------------------------------------------------
# 【5】只给**一个门**（区段二缺失）
#      期望：车端拒绝跨桥 + 每 2s 上报 EVENT(NEED_GATE)
#      ★ 依据：两个门缺一不可，单门时 start->goal 不可达
# -----------------------------------------------------------------------------
gates:
  - [1, 3, 100, 1]
t_gates: 1.2

# -----------------------------------------------------------------------------
# 【6】给**区段错配**的门位（bridge_id=1 但 row=8 属于区段二）
#      期望：车端按 row 号为准（row 是权威），或拒绝并报 GATE_INVALID
# -----------------------------------------------------------------------------
#   （与上面 gates 二选一测；row 号权威是车端的设计决策）
# gates:
#   - [1, 8, 100, 1]

# -----------------------------------------------------------------------------
# 【7】指令给越界坐标
#      期望：车端 handleNavTo 做领域校验并拒绝
# -----------------------------------------------------------------------------
commands:
  - {t: 2.0,  cmd: nav_to, col: 3,  row: 2}
  - {t: 5.0,  cmd: nav_to, col: 20, row: 20}     # ★ 越界，应被拒绝
  - {t: 8.0,  cmd: nav_to, col: 6,  row: 4}
  - {t: 12.0, cmd: stop}
  - {t: 14.0, cmd: hold}
  - {t: 16.0, cmd: return_base}

heartbeat_interval_s: 1.0
