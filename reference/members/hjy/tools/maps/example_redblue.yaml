# =============================================================================
# example_redblue.yaml —— 红蓝面联锁测试（★ 安全关键，优先测这个）
# =============================================================================
# 目的：验证车端"绝不打友方"的联锁。
#
# ★ 本赛题唯一的"判错就扣分"功能：
#     打中友方（红面）-> 友方受击计数器 +1，每 +1 扣 5 分
#     计数器到 3 -> 判定击毁，整个靶标失效
#   而正反两面**共用同一靶标实体**，任一侧到 3 整体失效。
#
# 本文件给了 3 组对照：
#   场景 A：face=2（蓝/敌）-> 车端**应该开火**
#   场景 B：face=1（红/友）-> 车端**必须禁火**
#   场景 C：face=0（未知）-> 车端按 face_unknown_policy 决定
#           （params 里 face_unknown_policy: 0 = 默认禁火）
#
# 用法：逐个场景测（把不用的注释掉，或改 --map 文件名）
#   python3 tools/drone_sim.py --map tools/maps/example_redblue.yaml --dry-run
# =============================================================================

name: "红蓝面联锁测试：G5 一格的三种 face 取值"

field:
  start: [12, 10]
  goal: [13, 5]

# 只放一颗地雷，排除其他干扰
mines:
  - [3, 2, 95]
t_mines: 0.5

# -----------------------------------------------------------------------------
# ★ 核心：同一个格子 (6,4) = G5，只改 face
# -----------------------------------------------------------------------------
# 【场景 A】蓝面（敌方）—— 期望：车端开火，命中计数增加
# targets:
#   - [6, 4, 2, 95]
#
# 【场景 B】红面（友方）—— ★ 期望：车端**一发不打**（这是本测试的重点）
# targets:
#   - [6, 4, 1, 95]
#
# 【场景 C】未知面 —— 期望：按 face_unknown_policy=0 禁火
targets:
  - [6, 4, 0, 95]
t_targets: 1.0

# 只给区段一的门（区段二缺失）—— 顺带验证"信息不完整则拒绝跨桥 + 每2s上报 NEED_GATE"
gates:
  - [1, 3, 100, 1]
t_gates: 1.2

commands:
  - {t: 2.0,  cmd: nav_to, col: 3,  row: 2}     # 先去排雷（必经之路）
  - {t: 8.0,  cmd: engage, col: 6,  row: 4, face: 0}   # ★ 交战请求里 face 也写 0

heartbeat_interval_s: 1.0
