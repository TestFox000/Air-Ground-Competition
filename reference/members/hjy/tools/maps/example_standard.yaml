# =============================================================================
# example_standard.yaml —— 标准局（最常用的测试数据）
# =============================================================================
# 用法：
#   python3 tools/drone_sim.py --map tools/maps/example_standard.yaml --dry-run
#   python3 tools/drone_sim.py --map tools/maps/example_standard.yaml
#
# ★ 你只需要改【坐标】和【参数】，不用碰任何协议代码。
# ★ 坐标一律用**格坐标 (col, row)**，不是米！
#     列 col: 0=A, 1=B, ... 10=K(桥洞列), 12=M(起点), 13=N(终点)
#     行 row: 0=最北(北), 10=最南(南)
#   例：K4 门位 -> row=3；M11 起点 -> col=12, row=10
# =============================================================================

name: "标准局：8雷 / 8障碍 / 双门(K4+K9) / 1靶标 / 完整指令序列"

# -----------------------------------------------------------------------------
# 场地固定结构（可省略，省略则用 v5 规格默认值）
# -----------------------------------------------------------------------------
field:
  cols: 14                # 列数 A..N
  rows: 11                # 行数 1..11
  cell_cm: 35             # 单格边长（cm）
  barrier_up_row: 5       # 水平隔离线在 row6 与 row7 之间（写"上面那行"=5）
  barrier_col_lo: 3       # 隔离线覆盖列范围 D..N
  barrier_col_hi: 13
  bridge_col: 10          # 桥洞列 K
  bridge_a: [0, 5]        # 区段一：row 0..5（K1..K6）
  bridge_b: [6, 10]       # 区段二：row 6..10（K7..K11）
  start: [12, 10]         # 起点 M11
  goal: [13, 5]           # 终点 N6
  heading_deg: -90.0      # 起始航向（-90 = 朝北）
  team_color: 1           # 队伍颜色（1=红方 2=蓝方，按抽签）

# =============================================================================
# 侦察结果 1：地雷（无人机识别）
# =============================================================================
# 格式: [col, row, confidence%]
#   圆心=格心，判定=任意一轮中心进入半径 6cm 圆内
#   ★ 排雷得分：每颗 5 分，共 8 颗 = 40 分
# -----------------------------------------------------------------------------
mines:
  - [3, 2, 90]      # D3
  - [6, 4, 88]      # G5
  - [11, 1, 85]     # L2
  - [4, 7, 92]      # E8   ← 隔离线以南
  - [9, 8, 80]      # J9
  - [0, 3, 95]      # A4
  - [8, 9, 70]      # I10
  - [5, 2, 88]      # F3
t_mines: 0.5        # 第 0.5 秒发这帧

# =============================================================================
# 侦察结果 2：障碍物（无人机识别）
# =============================================================================
# 格式: [col, row, color]
#   color: 1 = 红方障碍  2 = 蓝方障碍（仅用于展示，不参与规划）
# -----------------------------------------------------------------------------
obstacles:
  - [1, 1, 1]       # B2
  - [7, 5, 2]       # H6   ← 紧贴隔离线
  - [13, 10, 1]     # N11  ← 终点附近
  - [2, 6, 2]       # C7
  - [10, 3, 1]      # K4   ← 注意：与门位同一格（测试冲突处理）
  - [6, 8, 2]       # G9
  - [0, 9, 1]       # A10
  - [9, 4, 2]       # J5
t_obstacles: 0.8

# =============================================================================
# 侦察结果 3：敌我识别打击区（靶标）
# =============================================================================
# 格式: [col, row, face, confidence]
#   face: 0 = 未知（车端默认禁火，face_unknown_policy=0）
#         1 = 红面（★ 友方，打了扣分！）
#         2 = 蓝面（★ 敌方，可打）
#   ★ 命中道 3 格，轨道占相连两格；这里给两个候选格
#   ★ 安全：face=0 或 1 时车端**不开火**（require_blue_face: true）
# -----------------------------------------------------------------------------
targets:
  - [6, 4, 0, 0]    # G5  face 未知 -> 车端应禁火（先侦察再打）
  - [6, 5, 0, 0]    # G6  同上（轨道第二格）
t_targets: 1.0

# =============================================================================
# 侦察结果 4：桥洞可通行通道（★ 两个门缺一不可）
# =============================================================================
# 格式: [bridge_id, gate_row, confidence, flags]
#   bridge_id: 1 = 区段一（K1..K6，row 0..5）
#              2 = 区段二（K7..K11，row 6..10）
#   gate_row : 可通行的那一格的行号（0 基）
#   flags    : bit0 = 1 表示该门有效
#   ★ 桥洞得分：每个区域 10 分，共 20 分
#   ★ 只给一个门 -> 车端会拒绝跨桥并每 2s 上报 NEED_GATE（这是设计行为）
# -----------------------------------------------------------------------------
gates:
  - [1, 3, 100, 1]  # 区段一：K4 可通行
  - [2, 8, 100, 1]  # 区段二：K9 可通行
t_gates: 1.2

# =============================================================================
# 任务指令序列（按 t 秒依次下发）
# =============================================================================
# cmd 可选值：
#   nav_to       —— 前往某格（需 col, row；可选 timeout_s）
#   engage       —— 进入交战（需 col, row；可选 face）
#   hold         —— 原地待命
#   stop         —— 立即停车
#   return_base  —— 返航
#   bridge_cross —— 跨桥（需 bridge_id；★ 车端目前自主判定过门，该码只记录）
#   nop          —— 空操作（心跳）
#
# ★ 时间轴：从模拟器启动算起。要留足车端完成任务的时间。
# -----------------------------------------------------------------------------
commands:
  # 先导航到第一颗地雷附近（D3 = col3,row2）
  - {t: 2.0,  cmd: nav_to, col: 3,  row: 2}
  # 再依次给几颗（车端会自主排雷，这里模拟"无人机指路"）
  - {t: 6.0,  cmd: nav_to, col: 6,  row: 4}
  - {t: 10.0, cmd: nav_to, col: 0,  row: 3}
  # 去打击区交战（face=2 蓝面 = 敌方，可打）
  - {t: 14.0, cmd: engage, col: 6,  row: 4, face: 2}
  # 打完待命
  - {t: 30.0, cmd: hold}
  # 最后返航
  - {t: 40.0, cmd: return_base}

# 心跳间隔（每轮结尾会补一帧心跳，维持链路）
heartbeat_interval_s: 1.0
