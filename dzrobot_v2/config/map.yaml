# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-17 第六张地图（用户现场换图，贴图逐格识读）★★★
#   源图：_tmp_session/t40_map_parse/map_new.png（1814x1456 px）
#   识读：_tmp_session/t40_map_parse/parse_v2.py
#         ① 蓝框内边定场，格宽 128 px；154 格逐格采样 + 四色连通域交叉验证
#         ② 块心落格残差 ≤ 2 px（红/黄/品红/绿 20 个色块全部命中格心）
#         ③ 隔板：行 6/7 之间、D~N 列连续无缺口（x=393..1813 连续绿线），A/B/C 列可上下
#   识读结果：
#     雷 8：A2 F4 H4 G5 E8 B10 D11 I11        （纯黄 255,219,26 近方色块）
#     障 8：B1 D1 F3 I6 H7 A8 C9 E9           （红 255,96,96 满格块 = 水桶）
#     靶：D5 + D6（**纵向相邻**两格 = 一块 35×70cm 跨格靶板，车体不可压）
#     通口（桥洞）：K5（上半场）/ K7（下半场）
#     起终点：智能车起点 N10、终点 N5；无人机起点 N8、终点 M2
#   与上一版（第五张图）关系：20+ 点位几乎全不同，旧路线一律不可复用。
#
# ★ 赛道模型（不变）：整个 K 列是一座桥，每格是横向贯通的桥洞、格间有侧壁；
#   挡板在第 6/7 行之间 D~N 列封死 ⇒ 小车只能走 U 形：
#   N10 → 下半场西行 → K7 穿洞向西 → 绕 A/B/C 列上到上半场 → 压雷/避障/打靶 →
#   K5 穿洞向东 → 终点 N5。
#
# ★ 消费者：route_check / planner / sim / config_selfcheck 都按文件名 config/map.yaml 查找。
#   本文件是唯一真源。

map:
  name: "第六张地图 · 2026-10-17 用户现场图（逐格识读）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过
  mines:      ["A2", "F4", "H4", "G5", "E8", "B10", "D11", "I11"]
  # 障(8)：水桶，不可通行且遮挡视线
  obstacles:  ["B1", "D1", "F3", "I6", "H7", "A8", "C9", "E9"]
  # 靶：D5+D6 纵向相邻两格 = 一块跨格靶板（只在旁边停站射击）
  targets:    ["D5", "D6"]
  # 通(2)：上半场 K5 + 下半场 K7
  bridges:    ["K5", "K7"]
