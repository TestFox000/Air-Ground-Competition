# 地图要素 —— 与 robot.yaml 分开存放
# ★ 为什么不能放 robot.yaml：ROS params 文件顶层只允许 <节点名>: ros__parameters: 结构，
#   多一个顶层键会让 --params-file 解析失败，相机/视觉/云台三节点同时 abort。
#
# ★★★ 2026-10-11 迁到"物资点设置窗口截图"像素级识图版（上一版是 2026-10-07 识图）★★★
#   来源：_tmp_session/map_photo.png 经像素级识读（报告 _tmp_session/vision_map_report.md），
#         且用户已逐项确认（含 5 处对上一版的纠正）。
#   与上一版差异（雷 5/8 变、障 4/8 变、靶 G11+H11 -> F11+G11、通 K4/K9 -> K1/K7）：
#     ① 雷：E3->F3、B5->C5、B9->A9（各差相邻一列，用户确认以本版为准）；
#     ② 障：E5->F5、G10->H10（同上）；
#     ③ 靶：用户确认场地上是【一块跨 F11/G11 的靶板】，不是两块独立靶；
#     ④ 通：本局识图 = K1（上半场）+ K7（下半场）；
#     ⑤ 图上有无人机起点 N8 / 终点 M2 —— 用户决定【暂不纳入地图配置】。
#
# ★ 赛道模型（沿用，用户 2026-10-07 澄清）：
#   · 整个 K 列是一座桥，每格都是桥洞，分界处有一格宽挡板；
#   · 小车走 U 形赛道：N10 出发 → 下半场穿洞（向西）→ 绕 D~N 隔板（必经 A/B/C 列）→
#     压雷/避障/打靶 → 上半场穿洞（向东）→ 终点 N5；
#   · K 列穿行【不必强制直行】（用户 2026-10-11 最新口径）：继续用纯追踪算法，
#     调好速度与前视距离即可平稳通过。

map:
  name: "现场布置图 2026-10-11 (像素级识图 + 用户确认)"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过
  mines:      ["D1", "B3", "F3", "C5", "G7", "I8", "A9", "E9"]
  # 障(8)：水桶，不可通行且遮挡视线
  obstacles:  ["E4", "F5", "G6", "I6", "A7", "C8", "H10", "D11"]
  # 靶：F11+G11 相连两格 = 【一块跨格靶板】（用户确认；内放移动电子靶标）
  targets:    ["F11", "G11"]
  # 通(2)：本局识图看到的两个桥洞格（K 列每格都是洞，可通行格每局随机）
  bridges:    ["K1", "K7"]
