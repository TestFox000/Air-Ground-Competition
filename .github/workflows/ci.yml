name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------- 纯算法闸门（不需要 ROS）：语法检查 + 单元测试 + 本地赛前自检 ----------
  core-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tools/preflight.py 本地检查段用到 onnx（verify_contract）与 yaml（读配置）
          pip install onnx PyYAML

      - name: 全部源文件语法检查（src / tools / 根目录脚本）
        run: python -m compileall -q src tools *.py

      - name: 单元测试
        run: python -m pytest tests -q

      - name: 赛前自检（纯本地检查段：模型契约/指针/md5/配置）
        run: python tools/preflight.py
