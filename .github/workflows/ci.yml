name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------- 纯算法闸门（不需要 ROS）：语法检查 + 单元测试 + 本地赛前自检 ----------
  core-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tools/preflight.py 本地检查段用到 onnx（verify_contract）与 yaml（读配置）
          pip install onnx PyYAML
          # 随机序防线（与 requirements-extra.txt 同步 pin）：第二轮 pytest 靠它洗牌
          pip install pytest-randomly==3.16.0

      - name: 全部源文件语法检查（src / tools / 根目录脚本）
        run: python -m compileall -q src tools *.py

      - name: 单元测试（两轮）
        run: |
          # 第一轮：固定顺序基线（-p no:randomly 关掉洗牌，复现问题时顺序确定）
          python -m pytest tests -q -p no:randomly
          # 第二轮：默认随机序（pytest-randomly 自动洗牌）——专杀"上个测试留了
          # 全局状态才让下个测试过"的顺序依赖，种子打在日志里可复现
          python -m pytest tests -q

      - name: 赛前自检（纯本地检查段：模型契约/指针/md5/配置）
        run: python tools/preflight.py
