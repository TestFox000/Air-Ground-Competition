# 官方图（t39/t40 口径）—— 队长识读定稿，取代现役第五张图 config/map.yaml
# 来源：官方贴图 map_official.png（_tmp_session/t39_map_official/，654×522，
#       sha256 273ba796efec03ee0f4efcd8a99201c208d642a97d8292e672ed3088d0a06bb9）
# 双重独立识读（逐格一致，格网残差 max 0.16px）：
#   ① drone-perception：_tmp_session/t39_map_official/read_report.md
#   ② 队长独立识读：_tmp_session/t39_captain_read/official_identify.txt
# 结论：网格/坐标系/起终点/无人机点/隔板与现役 config/map.yaml 完全一致，
#   但雷8/障8/靶/下半场桥洞全不同（20 点位仅 K5 重合）。本文件是 t40 仿真的唯一 map 输入，
#   绝不落 dzrobot_v2/config/map.yaml（本仿真不改 config）。

map:
  name: "官方图 2026-10-14 识读（t39/t40 口径；取代现役第五张图）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：官方黄色纯色块（队长识读定稿）
  mines:      ["C1", "A3", "E3", "G4", "I6", "B7", "D9", "H10"]
  # 障(8)：官方红色块
  obstacles:  ["A1", "E2", "H4", "D8", "I8", "G9", "B11", "F11"]
  # 靶：E5+F5 横向相邻两格 = 一块跨格靶板（35×70cm，车体不可压，只在旁边停站射击）
  targets:    ["E5", "F5"]
  # 通(2)：上半场 K5 + 下半场 K9（官方图仅此两格绿色"通"）
  bridges:    ["K5", "K9"]
