# 地图要素 —— 与 robot.yaml 分开存放
#
# ★★★ 2026-10-17 第六张地图（用户粘贴新图，队长逐格识读）★★★
#   源图：_tmp_session/t40_map_parse/map_new.png（1814x1456 px）
#   识读：_tmp_session/t40_map_parse/parse_v2.py（154 格逐格采样 + 连通域交叉验证）
#         网格：列 A..N × 行 1..11，格宽 128 px；块心与格心残差 ≤ 2 px
#         四色：雷=纯黄(255,219,26)、障=红(255,96,96)、靶=品红(255,117,209)、通=绿(94,183,98)
#         起终点=淡黄(232,196,91) 四框：智能车起点 N10 / 智能车终点 N5 / 无人机起点 N8 / 无人机终点 M2
#         隔板：第 6/7 行之间、D~N 列连续无缺口（绿线 x=393..1813 连续，A/B/C 列可上下穿行）
#   识读结果：
#     雷 8：A2 F4 H4 G5 E8 B10 D11 I11
#     障 8：B1 D1 F3 I6 H7 A8 C9 E9
#     靶：D5 + D6（**纵向相邻**两格 = 一块 35×70cm 跨格靶板）
#     通口（桥洞）：K5（上半场）/ K7（下半场）
#     起点 N10（车头朝 +y = 图左；mission.reset="N10,y"）、终点 N5

map:
  name: "第六张地图 · 2026-10-17 用户现场图（逐格识读）"
  start: "N10"
  end: "N5"
  barrier_col_from: "D"
  barrier_row_hi: 6
  barrier_row_lo: 7
  # 雷(8)：必须全部压过。纯黄 0.875 格近方色块（与淡黄起终点框可区分）
  mines:      ["A2", "F4", "H4", "G5", "E8", "B10", "D11", "I11"]
  # 障(8)：水桶，不可通行且遮挡视线。满格红块
  obstacles:  ["B1", "D1", "F3", "I6", "H7", "A8", "C9", "E9"]
  # 靶：D5+D6 纵向相邻两格 = 【一块跨格靶板】(35×70cm 实体，车体不可压，只在旁边停站射击)
  targets:    ["D5", "D6"]
  # 通(2)：上半场 K5 + 下半场 K7（现场随机开 2 个通格；图上仅此两格为绿色"通"）
  bridges:    ["K5", "K7"]
