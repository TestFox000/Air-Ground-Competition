# =============================================================================
#  智能车 · 统一配置中心   robot.yaml
# -----------------------------------------------------------------------------
#  ★ 全车唯一需要改参数的地方。改完【不需要重新编译】，重启对应节点即生效。
#
#      整套重启:      ~/dzrobot/start_all.sh restart
#      只重启云台:    ~/dzrobot/tools/restart_node.sh gimbal
#      体检参数:      ~/dzrobot/tools/healthcheck.sh
#
#  ★ 为什么用这个文件而不是改 launch / 改代码：
#      以前参数散在三处（.h 默认值 / .cpp declare_parameter / launch 字典），
#      改一处另两处不跟着变，已经因此踩过坑（俯仰 -6° 改了没生效）。
#      而且 launch 用 LaunchConfiguration 传的是【字符串】，节点声明的是
#      double/bool/int —— 类型不匹配会【静默失败】，参数根本设不上去。
#      现在这里全是 YAML 原生类型，启动后可用 healthcheck.sh 核对是否真的生效。
#
#  ★ 三条硬性不变量（healthcheck.sh 会自动校验，违反会报 ERROR）：
#      ① track_deadzone_px  <  fire_dz_far_px
#         死区必须小于最小开火框，否则目标停在死区里、永远进不了开火框 → 一发打不出
#      ② fire_dz_far_px     >  能达到的机械精度(约 12px)
# ★t43（用户 2026-10-14 规格优先）：7×7px(半宽 3.5) 小于云台机械精度 ~12px，下面这条『须 > 机械精度』的不变量已【注释放宽】；风险=确认框小于机械精度时确认概率可能下降（已在 t43 报告量化）。
#         开火框若小于云台实际能压到的精度，就会出现"时而打得中时而打不中"
#      ③ lost_frames_to_rescan 覆盖住视觉抖动周期(约 60 帧 = 2s)
#         太短会导致识别间歇时被判"目标脱离视野"，锁定保持率暴跌
# =============================================================================


# =============================================================================
#  云台自瞄  dzrknn_dataprocess
# =============================================================================
/dzrknn_dataprocess:
  ros__parameters:

    # -------------------------------------------------------------------------
    #  扫描姿态
    # -------------------------------------------------------------------------
    scan_yaw_min_deg: -150.0       # ★t25 用户指令：巡航范围左右各 150°
    scan_yaw_max_deg: 150.0        # ★t25：旧值 -160.0/+10.0（非对称，第一趟要横跨 170°）已弃用
    #   ⚠ 连带影响（写进 t25 报告）：scan_yaw_min/max **同时**被 TRACK 的
    #     `clampYawToScan()` 当作"跟踪水平允许范围"。±150° 在机械极限内
    #     （`gimbal_yaw_tick_min/max` = 100..3995 ⇒ 相对正前 2047 约 -171°..+171°），
    #     故跟踪时的水平伺服范围也一并放宽到 ±150°（对"目标跑到侧后方"的场景是好事，
    #     但意味着跟踪可以做更大的偏转 —— 若现场发现跟踪摆幅过大，再单独加跟踪限幅参数）。
    # ★俯仰基准角（度）。约定：负=向下压，正=抬头。
    #   ⚠ 下面这行历史上注释写的是 -26（第六次下压），但实测值早已被改成 +6.0，
    #     注释与值长期不符，是这次"云台追不上地面靶"误判的直接原因。
    #   2026-10-03 起：跟踪模式已改走机械限位（不再被本值钳住）；
    #     但【扫描模式】仍以本值为基准 —— 若扫描时看不到地面靶，
    #     把本值改回负数（-20 ~ -26 之间试），不要盲调 tracking_pitch_margin_deg。
    scan_pitch_offset_deg: +10.0   # ★t52 用户指令（2026-10-14）：水平扫描向下压约 10°；★2026-10-15 现场实测：-10.0 实际【向上抬】（符号约定反了）⇒ 改 +10.0
                                   #   【符号约定：负 = 向下压，正 = 抬头】——与 C++ 侧注释和 scanPitchDeg() 一致。
                                   #   沿革：+6.0 →（2026-10-11 t25"复位水平"）0.0 →（本次）**-10.0**。
                                   #   本值是扫描模式的俯仰基准：实际俯仰 = scan_pitch_levels[i] + 本值（cpp:474）。
    #   ★ 配合 C++ 侧 t25 改动：startScan() 先走"归位段"（目标 yaw=行程中点=0°、pitch=基准），
    #     归位到位或超时（scan_home_timeout_ms）后才开始第一个横扫点。
    # ★★ 多层俯仰扫描（本次新增）★★
    #   踩过的坑：原来扫描只在 pitch = 0 + (-8°) = -8°，而靶在 0.35m 外的地面上，
    #   需要的俯角约 atan(0.30/0.35) ≈ 40° —— 靶直接掉出画面下沿，
    #   云台只能偶尔瞄到一点（日志里"发现目标"之后马上"脱离视野"）。
    #   现在让扫描【每扫完一趟就换一层俯角】，把近处地面也扫进来。
    #   ★ 这个参数以前根本没法配：launch_ros 不接受 Python list
    #     （写 [0.0] 会抛 "Unrecognized data type: <class 'list'>" 导致节点起不来）。
    #     改用 params YAML 之后，原生列表终于可用 —— 这是配置中心的直接红利。
    #   列表里每个值是一层的角度(相对水平，上为正)，会再叠加 scan_pitch_offset_deg。
    scan_pitch_levels: [0.0]        # ★只做水平扫描（取消多层俯仰）
    scan_yaw_dirs: 8               # (兼容保留) 旧逐点扫描的点数，连续扫描下不参与计算
    scan_dwell_ms: 300             # 每个点最短驻留(ms)
    scan_passes: 2               # 一轮 = 左一趟 + 右一趟（射击点连做两轮）
    # ★t25 用户指令：连续扫描（scan_request>=2）最多 3 轮，3 轮仍未找到目标 ⇒ 自动回 IDLE 归位，
    #   不再无限往复扫（旧版 scan_continuous_ 无轮数上限 —— 现场表现为"云台一直在转"）。
    #   <=0 = 不限（旧行为，可回退对照）。单次扫描（scan_request=1）不受本参数影响，仍按 scan_passes 趟。
    scan_continuous_cycles: 3
    # ★t25：进入扫描前的"归位段"超时（ms）。归位目标 = 正前方(yaw=0)+水平(pitch=基准)；
    #   到位判据用 scan_arrive_tol；电机卡住/反馈缺失时按本超时兜底放行，绝不永远不进扫描。
    scan_home_timeout_ms: 1500
    scan_arrive_tol: 30            # 到位容差(刻度)

    # -------------------------------------------------------------------------
    #  速度体系
    # -------------------------------------------------------------------------
    patrol_speed_ratio: 0.30       # ★2026-10-14 用户指令：扫描速度 = gimbal_max_speed × 0.30（60% 太扫太快锁不住靶，第3趟 0 开火全因"目标丢失·闭锁"）
    gimbal_max_speed: 3700         # 云台最大转速(刻度/s)
    track_speed_max: 1400          # ★2026-10-14 与 patrol 解耦：跟踪上限钉在旧 0.6×0.63×3700≈1399 刻度/s，防"降扫描速度拖累跟踪"
                                   #   （原 0 = 按 patrol_speed_ratio 派生；0.30×0.63×3700≈700 会跟不上靶）
    track_speed_max_ratio: 0.63    # 跟踪上限 = 巡逻速度 × 该比例（仅 track_speed_max=0 时生效）

    # -------------------------------------------------------------------------
    #  主循环频率（流畅度）
    # -------------------------------------------------------------------------
    #  自适应：跟踪时保控制精度，扫描/空闲时降频省算力，把 CPU 让给 RKNN 推理。
    #  注意：丢帧计数都在【视觉回调】里按 30Hz 视觉帧自增，与本循环频率无关，
    #        所以降频不会改变 lost_frames_to_rescan 的时间含义。
    loop_hz_track: 100             # 跟踪时主循环频率(Hz)
    loop_hz_idle: 50               # 扫描/空闲时主循环频率(Hz)

    # -------------------------------------------------------------------------
    #  云台刻度标定（改错会导致云台撞限位或反向，动前先备份）
    # -------------------------------------------------------------------------
    gimbal_center_tick: 2047       # 零位(正前方/水平)刻度
    yaw_ticks_per_deg: 11.378      # 水平 刻度/度 = 4096/360
    pitch_ticks_per_deg: 11.378    # 竖直 刻度/度 = 4096/360
    yaw_deg_sign: 1.0              # 水平方向反了改 -1.0
    pitch_deg_sign: 1.0
    # ★跟踪俯仰修正余量(度)：clampPitchToScan 在扫描俯仰范围外再留这么多度供伺服修正。
    #   踩过的坑：scan_pitch_levels 只剩一层时 min==max -> 允许区间宽度为 0 ->
    #   视觉伺服的俯仰修正全被钳掉 -> 云台俯仰僵死，改 offset 完全无效。
    # ★扫描俯仰区间之外再留多少度供【扫描时的微调】。
    #   注意：2026-10-03 起，跟踪模式已不再使用这个区间（改走机械限位），
    #   所以调它【不会再影响目标跟踪俯仰】，只影响扫描层的活动范围。
    tracking_pitch_margin_deg: 6.0
    # ★空闲归位速度比例：IDLE 时云台回到"正前方+基准俯仰"（相对巡逻速度）。
    #   不归位的话云台会冻结在最后一次的任意姿态，改俯仰参数看不出变化。
    idle_homing_speed_ratio: 0.5            # 竖直方向反了改 -1.0
    gimbal_yaw_tick_min: 100       # 水平轴硬件刻度下限
    gimbal_yaw_tick_max: 3995      # 水平轴硬件刻度上限
    gimbal_pitch_tick_min: 950     # 竖直轴刻度下限(下位机钳位)
    gimbal_pitch_tick_max: 2400    # 竖直轴刻度上限(下位机钳位)

    # -------------------------------------------------------------------------
    #  瞄准精度与消抖
    # -------------------------------------------------------------------------
    ema_alpha: 0.55                # 视觉低通滤波系数(0~1)。越小越平滑但延迟越大
    track_deadzone_px: 2           # ★跟踪死区(px)。必须 < fire_dz_far_px
    track_kp: 8.0                  # PD 比例增益
    track_kd: 3.0                  # PD 微分增益
    fine_zone_px: 20               # 精调档阈值(px)
    fine_kp_scale: 0.5             # 精调档 Kp 缩放
    fine_kd_scale: 2.0             # 精调档 Kd 放大
    predict_gain: 0.5              # 目标移动预判强度(帧)

    # -------------------------------------------------------------------------
    #  开火判据
    # -------------------------------------------------------------------------
    fire_dz_dynamic: true          # 启用动态开火框（目标越近视差越大、框越宽）
    fire_deadzone_px: 8            # 固定开火死区(px)，仅 fire_dz_dynamic=false 时使用
    fire_dz_far_px: 14.0          # 远距离开火死区(px)
# ★t53 打靶修复（用户 2026-10-16 裁决）：t43 按"7×7px(半宽3.5)"收窄后 < 云台机械精度~12px，
#   实车"看得见靶却一直判在框外"（REASON_OUT_OF_BOX 主因）⇒ 放宽回 14/26（> 机械精度，
#   恢复 t43 前的不变量"须 > 12px"）。此键同时被 Python aim.py(别名 aim.fire_box_*) 与
#   C++ dzrknn 消费，两处一并放宽。
    fire_dz_near_px: 26.0          # 近距离开火死区(px)
    box_w_far: 30.0                # 远处目标框宽标定值(px)
    box_w_near: 120.0              # 近处目标框宽标定值(px)
    fire_hold_frames: 5            # 连续满足多少帧才开火
    fire_use_image_stable: true    # 稳定判据：true=画面稳定 / false=电机静止
    fire_stable_px_per_frame: 1.5  # 画面稳定阈值(px/帧)
    fire_real_speed_max: 20        # 电机静止阈值(realV)
    fire_speed_max: 50             # 开火时指令速度上限
    target_confirm_frames: 2       # ★2026-10-16 需求1：降门槛（原4）——连续2帧即确认可射击
    cls_switch_confirm_frames: 2   # ★2026-10-16 需求1：降门槛（原5）——连续2帧同类即锁定蓝/红
                                   #   视觉偶尔会把蓝靶某一帧判成红靶，若直接采信当帧类别，
                                   #   fire_only_blue 下会频繁掐断开火，表现为"明明瞄上了却打不出去"。
                                   #   5 帧(约 0.17s)足以吸收单帧抖动；调大更稳但改锁更慢。
    shot_cooldown_ms: 500          # 两发之间最小间隔(ms)

    # -------------------------------------------------------------------------
    #  弹药控制
    # -------------------------------------------------------------------------
    fire_only_blue: true           # ★2026-10-16 用户确认：只打蓝靶，打红靶扣分（旧 false 会打红靶违规）
    max_shots: 10                  # 全程可用发数(硬上限 10)
    # ★ t26（2026-10-11 用户指令 4）：单目标连发上限 3 → **10**（= 允许对同一目标打完全部弹药）。
    #   旧值 3 的溯源：原口径"防把全程弹药倾泻在一个靶上"；现改由 `max_shots_total=10` +
    #   决策层"到站发数增量满 10 即离站"共同兜底。本键被 dzrknn 云台节点直接读取。
    max_shots_per_target: 10

    # -------------------------------------------------------------------------
    #  激光同轴标定（用连续激光笔测出后填这里）
    # -------------------------------------------------------------------------
    laser_offset_x: 0.0            # 激光落点相对画面中心的水平偏移(px)
    laser_offset_y: 0.0            # 激光落点相对画面中心的竖直偏移(px)

    # -------------------------------------------------------------------------
    #  ★新版本补丁：两键开火 + 延迟补偿提前量（2026-10-07）
    #  ------------------------------------------------------------------------
    #  为什么：旧版放行门 /move_base/stop_signal 在 C++ 侧**零订阅者**（死线），
    #          且开火要求"画面静止"，移动轨道靶几乎打不出去。
    #  怎么工作：use_external_fire_gate=true 时，开火权交给新决策层的两把钥匙
    #          · /aim/fire_gate  (MissionTask：已到站、停稳、FIRE 阶段)
    #          · /aim/fire_ready (AimTask：目标确认、预测落点在框内、冷却/弹药允许)
    #          两者都为 1 才点火；lead_apply_gain 控制"云台物理上提前瞄多少"。
    #  ★默认关闭 = 行为与旧版逐字一致（回退验证用）。现场整定步骤见
    #     docs/云台补丁说明.md 第四节：先只开两键，再一档一档加 lead_apply_gain。
    # -------------------------------------------------------------------------
    use_external_fire_gate: false  # ★true 才启用两键开火（需先编译 C++ 补丁）
    lead_apply_gain: 0.0           # 0=不施加提前量；建议 0.3 → 0.6 → 1.0 逐步调


    # -------------------------------------------------------------------------
    #  目标筛选与状态机
    # -------------------------------------------------------------------------
    aspect_min: 0.60   # ★2026-10-16 用户澄清：要打的靶面是 1:1 圆形（非横向 2:1 靶板），恢复原始过滤范围
    aspect_max: 1.60   # 过滤保留：圆形靶面宽高比≈1.0，落在 [0.60,1.60] 内；旧"放宽到 2.40 容纳 2:1 靶板"依据已证伪，撤销
    lost_frames_to_rescan: 180     # ★跟踪丢帧回扫描阈值。太小会让识别间歇被判"脱离视野"
    vision_timeout_ms: 1000        # 追踪中多久收不到视觉结果就强制回扫描(ms)

    # -------------------------------------------------------------------------
    #  车体转动前馈（惯性凝视稳定，车转时云台反向补偿）
    # -------------------------------------------------------------------------
    gyro_ff_gain: 0.0              # 前馈增益(0 = 关闭)
    gyro_ff_sign: 1.0              # 补偿方向(±1)
    imu_ff_timeout_ms: 200         # IMU 失联暂停阈值(ms)


# =============================================================================
#  相机  usb_cam  （节点名 usb_cam_node）
# =============================================================================
/usb_cam_node:
  ros__parameters:
    video_device: /dev/video0     # 相机设备
    image_width: 640              # 图像宽度
    image_height: 480             # 图像高度
    framerate: 30.0               # 帧率
    pixel_format: yuyv            # 像素格式: yuyv | mjpeg
    io_method: mmap               # 采集方式: mmap | read | userptr
    brightness: 0                 # ★亮度。范围 -64~64，默认 0。
                                  #   曾因被设成 50 导致画面大片过曝、颜色特征崩掉
    # 其余相机控制项保持驱动默认（自动曝光/自动白平衡），不要随意覆盖


# =============================================================================
#  射击驱动  dzjudgment   ★★ 这才是真正点亮激光的节点 ★★
# -----------------------------------------------------------------------------
#  完整链路：
#     dzrknn_dataprocess（云台自瞄，判定"瞄稳了"）
#         │ 发布 /LaserShot_Command (UInt8 = 1)
#         ▼
#     dzjudgment（本节点，上位机↔车载裁判/激光模块通讯）
#         │ 串口写 6 字节帧  B5 5B 03 21 01 25
#         ▼
#     激光发射模块  → 开火
#
#  ★★★ 踩过的巨坑（务必保留这段注释）★★★
#    这个节点以前【根本没被启动过】。
#    start_all.sh 只起了 dzrknn_dataprocess（云台控制），
#    而《案例9：云台控制与射击》明确写了 dzshooting.launch.py 要同时起两个：
#        dzrknn_dataprocess（云台控制） + dzjudgment（上位机与车载裁判系统通讯）
#    后果：ros2 topic info /LaserShot_Command 显示
#          Publisher count: 3   Subscription count: 0
#    云台算得好好的开火指令全发进了空话题 —— 激光永远不亮，还完全没报错。
#
#  ★ 排查口诀：开火没反应时，第一件事就是查
#      ros2 topic info /LaserShot_Command
#    只要 Subscription count 是 0，就是本节点没起来。
# =============================================================================
/dzjudgment:
  ros__parameters:
    mcuserialport: "/dev/dzjudgment"   # udev 软链 -> ttyACM1（与底盘 /dev/dzactuator 互不干扰）
    mcubaudrate: 115200


# =============================================================================
#  视觉检测  det_node
# =============================================================================
/det_node:
  ros__parameters:
    model_path: ""            # 空 = 用包内 share/det_node/model/light_det.rknn
                              # 想临时换模型：填绝对路径，然后把 hot_reload 开着，
                              # 覆盖文件即可自动重载，不用重启节点。
    draw: true                # 是否弹出识别画面窗口。
                              #   false = 关窗口，省掉 30Hz 的 imshow+waitKey 开销
                              #   （在 ARM 板上相当可观）。只想看网页画面时建议关掉。
    thread_num: 8             # RKNN 推理线程数。CPU 吃紧可降到 2。
    max_fps: 30.0             # 推理帧率上限。30 = 跟随相机(默认)；降到 20 可明显省 CPU，
                              #   代价是延迟略增。<=0 表示不限制。
    hot_reload: true          # 模型文件 mtime 变化时自动热加载。
                              #   换模型：cp 新模型覆盖 light_det.rknn，1 秒内自动生效。

# =============================================================================
#  循迹 / 自主行驶  path_executor
# -----------------------------------------------------------------------------
#  说明：path_executor.py 不是 ROS 参数化节点，而是 python3 直接运行的脚本。
#        它通过 tools/config_loader.py 读取下面这一段。
# =============================================================================
path_executor:
  ros__parameters:
    # ★★ t31（换图收口 / F-t29-2）：legacy 段与 dzbrain 段**双真源**必须对齐 ——
    #   若赛前走 `LEGACY_PATH=1`/legacy `path_executor_node`，它就按这一段跑：
    #   · linear_speed: 0.35 → **0.15**（t29 首跑安全档；新图 @0.35 车体离挡板细条仅 +0.5 mm，
    #     @0.15 为 +14.2 mm ⇒ 0.35 会绕过安全档；与 `pursuit.cruise_speed_mps=0.15` 一致）
    #     ★t38 提速档落地：两段再一起 0.15 → **0.40**（t30 三档仿真 + t37 需求契约；
    #       @0.40+斜坡 98.90 s，比 @0.35 快 4.1%、比 @0.15 快 30.4%，碰撞/硬违规/越界全 0）
    #   · auto_start 旧值真 → **假**（与 `mission.auto_start=false` 一致：不要在没核对横幅的情况下自己出发）
    #     ⚠️ 注释里**故意不写** `auto_start` 的"冒号+空格+真值"字面串（`tests/test_deploy.py` 会对
    #       归一化后的全文做 count 校验；写成字面串会污染计数造成假红/假绿）。
    #   · auto_start_delay: 2.0 → **45.0**（与 `mission.auto_start_delay_s=45.0` 一致：留横幅核对窗口；
    #     真源语义见 src/car_localization/car_localization/path_executor.py:441-446 与
    #     `core/config.py:480-485` 的旧键迁移表）
    linear_speed: 0.35   # ★基础巡航速度(m/s)。与 dzbrain 段 cruise_speed_mps 保持一致
                         #   （2026-10-11 t22：0.30→0.35；★t29 首跑安全档 0.35→0.15；t31 两段对齐；
                         #    ★t38 提速档落地：0.15→0.40（本轮实车暂回 0.15 安全档，跑完恢复 0.40））
    auto_start: true             # ★一键启动后自动出发（本轮现场发车：翻 true 推车，跑完回 false）
    auto_start_delay: 45.0        # ★t31 对齐 dzbrain 段 mission.auto_start_delay_s=45.0（旧值 2.0）
    mission_scan_mode: continuous # continuous = 边走边扫 | waypoint = 到点停车扫描 | none
    mission_reset: "N10,y"

    # ---- ★倒车模式（global_planner 的 R: 前缀）----
    #  global_planner.py 输出的阿克曼路径里，'R:B5' 表示"倒着走到 B5"。
    reverse_speed_ratio: 0.6      # 倒车速度 = 巡航速度 x 该比例（倒车必须慢）
    reverse_steer_sign: 1.0       # ★倒车转向方向。理论推导见 path_executor 注释，
                                  #   但**没有实车依据**。上车若发现倒车时车尾偏向反了，
                                  #   改成 -1.0 即可，改完 restart_node.sh path 生效。

    # ---- ★桥洞强制直行保护（ALIGN_STRAIGHT）----
    #  桥洞两边是实墙，Pure Pursuit 逼近航点时会小幅摆头，宽度余量小时会蹭墙。
    #  进入保护段后直接关掉纯追踪转向，改用 IMU 锁航向 + 小舵角 + 低速直冲。
    # ★ 2026-10-11 第三次换图实车事故：保护窗含 90° 拐时锁错航向（K11 进洞前
    #   L10→L11 南向拐落在保护窗内，锁把南向当目标 → 车西南跑偏 0.40m → drift_stop）。
    #   用户口径「K 列穿行不强制直行」→ 关闭保护，纯追踪 + 转角减速过洞
    #   （双档仿真验证：0.30 过洞隔板 0 拍）。恢复时把整列 K1~K11 填回即可。
    bridge_blocks: []
    # ★整个 K 列都是桥洞，每一格都被侧壁隔开 —— 车在 K 列必须【严格直穿】，
    #   任何斜切都会撞壁。所以保护点覆盖整列，而不是只标两个"通"格。
    # ★两个通口的【穿越顺序约束】（场地规划硬要求）
    #   第一个通口（下半场 row 7~11）: L* -> K* -> J*   （向西穿）
    #   第二个通口（上半场 row 1~6） : J* -> K* -> L*   （向东穿）
    bridge_order:
      - {half: lower, rows: "7-11", seq: ["L", "K", "J"]}
      - {half: upper, rows: "1-6",  seq: ["J", "K", "L"]}   # 两个通口：K4+K5 纵向相邻算一个，K10 是另一个
    align_straight_before: 2.0    # 洞前多少格开始锁航向
    align_straight_after: 1.0     # 过洞后多少格解除
    align_straight_speed: 0.10    # 直行段速度(m/s)
    align_kp: 12.0                # 航向保持增益 -> 实际舵角 = 误差deg x (align_kp/10)
    align_steer_limit: 8.0        # 直行段舵角限幅(度)，小舵角微调防摆动

    # ---- ★最佳射击点自主计算（tools/shoot_planner.py）----
    #  分工：地图坐标负责"把车带到靶附近"(粗定位 0.35m 粒度)，
    #        视觉云台负责"30cm±10cm 内的精瞄"。
    shoot_distance_target: 0.35
    # ★t57（2026-10-15，t50/t57 联合裁决）：用户 2026-10-14 指令「最佳射击点距**靶板中心** 80 ± 10 cm」。
    #   本两键是**靶格级**判据的真源（`route/validate.py:68-69` 的 `_window()` → R006/R013；
    #   `tools/route_check.py:1248-1251` 的「靶覆盖 / 射击点距离」；`tasks/mission.py:2338-2339` 的
    #   `SHOOT@` 候选链）。它与 `route.shoot_distance_m` / `shoot_distance_tol_m`（板心窗口，:526-527）
    #   **语义不同**，但本次取值同向：0.70 / 0.90。
    #   为什么必须跟着改：规划器已按板心窗口把停站点选到 `F3`，而 `F3` 到两个靶格心分别是
    #   **E5=0.783 m / F5=0.700 m**（规划器 `geo.block_to_meters()` 实测，见
    #   `_tmp_session/t50_repin/impl.md` §A9/§A10）；旧窗口 0.20~0.45 会把正确落点判死
    #   （R006 靶覆盖 0/2 + R013），进而 `planner.fallback_to_tokens: true` 回退旧路线
    #   ⇒ 车端行为零变化。改动依据 = 实测产物（CFG）。
    # ★★ 卡 t3（2026-10-16）：停站点推远到板心 **1.00 m** ⇒ 上一版把本两键同步到 1.00 / 1.15。
    #   实测（规划器产物 `F2*`，`geo.block_to_meters()` 算）：到 **E5=1.1068 m / F5=1.0500 m**。
    #   ⇒ 当时上界必须 ≥ 1.1068（R006 要求"每个靶格都被某个停站点覆盖"），
    #     下界取 1.00 ⇒ 旧 `F3*`(0.783/0.700) 与中间档 `D3*`(0.783/0.990) 都被排除。
    #   ✖ **t3-A 裁决（2026-10-16，队长）：1.00 m 档作废 —— 几何死结，不是标定问题。**
    #     `F2` 的唯一可行进法（`D3→E3→F3→F2`）决定到站车头朝「行号减小」，靶板落在
    #     **车尾 170.5°**；云台扫描是 `scan_yaw_min/max = ∓150°`（**相对车头**）⇒ 扫不到。
    #     即"停得更远"成立、但"打得到靶"不成立 ⇒ 该档**只作历史档**（现场如需回切：本两键
    #     1.00 / 1.15 + `route.shoot_distance_m/tol` 1.00 / 0.11 + `mission_blocks` 的 `F2*`
    #     50 点版，见 `artifacts/sim/t3_shoot_100/`）。
    #   ✔ **现役档 = `D3`（板心 0.8750 m、到靶方向偏离车头 36.9°、零绕行）** ⇒ 本两键 = **0.78 / 1.02**。
    #   实测（规划器产物 `D3*`）：到 **E5=0.7826 m / F5=0.9899 m** ⇒ 上界必须 ≥ 0.9899
    #     （R006 逐靶格覆盖），下界 0.78 把旧 `F3*` 的 F5=0.700 挡在窗外（保证"比旧 0.80 档更远"）。
    #     ⚠️ 本两键（**靶格心**判据，门禁 R006/R013 用）与 `route.shoot_distance_m/tol`
    #        （**板心**窗口，决定车停哪儿）本次**恰好同值** [0.78,1.02]，但语义不同，不要互相抄值。
    shoot_distance_min: 0.78
    shoot_distance_max: 1.02
                                  # 注（★t57 已作废，原文保留以便对照）：格距 0.35m 时正交相邻=0.35m（合格），
                                  #     对角相邻=0.495m（超限），所以每个靶通常
                                  #     只有 3~4 个候选点（边行更少），这是几何决定的。
                                  #     ★t57：窗口改 0.70/0.90 后，0.35/0.495 两个邻格**都出窗**，
                                  #           上述结论不再适用；新候选池由规划器实测给出（如 `F3` 这类隔一格的点）。
                                  #     ★t3：曾抬到 1.00/1.15（板心 1.00±0.11 m 内只剩 `F2`）；
                                  #     ★t3-A：现役 **0.78/1.02**（板心 0.90±0.12 m ⇒ `D3`，到 E5/F5 = 0.7826/0.9899 m）。
    shoot_max_retry: 3            # ★每个靶最多尝试几个候选点，失败自动换下一个
    shoot_score_w_gimbal: 0.6     # 评分权重：云台偏转角代价（偏角大=锁定慢）
    shoot_score_w_detour: 0.5     # 评分权重：路径绕行代价

    # ---- ★打靶执行（定点狙击）----
    # ★本候选点打满这么多发就收站去下一个点（靶子全场只有一个，走到最佳射击点
    #   狠狠瞄、狠狠打即可，不必耗尽全场 10 发）。
    #   ★必须 <= 云台 max_shots_per_target：云台到这个数就停火，
    #     若这里要得更多，循迹就只能干等 shoot_timeout，每个射击点白等 30 秒。
    #   ★t26 口径变更提示：**决策层（dzbrain MissionTask）的真源是 `mission.shots_per_stop`
    #     =10**（用户指令 4：打完全部弹药/到站 30s 先到即离）；本键是 **legacy
    #     path_executor 节点**自己的目标发数。
    #   ★队长裁决 2026-10-11（F-t26-1 收口）：车端 start_all.sh 已确认默认走新核 dzbrain、
    #     旧 path_executor 仅在 LEGACY_PATH=1 时回退；为防回退时新旧口径打架，
    #     本键同步为 10，与新决策层口径一致（t26 原按契约留 3，由队长改齐）。
    shoot_count_target: 10
    shoot_timeout: 30.0           # ★2026-10-11 用户指令:最佳射击点停留射击最长 30s(30→10 快速采集改回 30)。超时立刻换点/放行，绝不卡死
                                  # ★t26：与 `mission.shoot_timeout_s` 同值(30.0)，保持不动；决策层口径见下方 mission 段
    shoot_settle_speed: 0.02      # 底盘速度小于此值视为"停住"(m/s)
    shoot_stable_frames: 5   # ★降低：连续 8 帧≈0.27s 过于苛刻，降到 5 帧
    shoot_stable_offset_px: 40.0   # ★放宽容差：原 25px 与云台开火框(26px)几乎重合，判定过紧
    shoot_stable_timeout: 3.0     # ★2026-10-11 快速采集:6→3 等稳定的最长时间(s)；等不到就降级放行而非死等

    # ---- ★障碍表（射击点规划器算视线遮挡用）----
    obstacle_blocks: ["A5", "G5", "B6", "D7", "C8", "E9", "I9", "H10"]
    # ★★ 真源唯一性（2026-10-03 修 C8）：本表必须与 config/map.yaml 的
    #   map.obstacles 完全一致 —— 以前这里是另一份陈旧数据，导致两个连锁错误。
    #   改地图只改 map.yaml，这里同步即可（route_check.py 会校验一致性）。
    # ★ 2026-10-11 第三次换图：已同步为 p-81Zc2l/n11 像素级识图版的 8 障。
    # ---- ★打靶三段式状态机 ----
    #  0 停稳 -> 1 请求扫描并等锁定 -> 2 开火窗口。每段都有超时兜底。
    shoot_settle_time: 0.4        # ★2026-10-11 快速采集:0.8→0.4 位置连续多少秒不变才算"底盘停稳"
    shoot_lock_timeout: 6.0       # ★2026-10-11 快速采集:18→6 找靶阶段(阶段1)最长时间(s)，超时换点
    shoot_overshoot_tol: 0.30     # ★云台扫描仅 ±90°：车冲过射击点后，仍在此距离内补触发停站
                                  #   原来只认"半径 0.17m 以内"，冲过去就永远不触发、静默漏打
    shoot_slowdown_m: 0.60        # ★射击点前提前减速距离(m)，防止冲过头       # ★"扫完没找到"的判定延迟(s)。
                                  #   必须 >= 一个完整扫描周期（俯仰层数 x scan_passes x 单趟耗时 ≈10s），
                                  #   否则会在扫描刚起步时就误判"没找到"而提前放弃 —— 这个坑踩过。
                                  #   注：整体流程已升级为四阶段（停稳->找靶->稳定->开火），
                                  #   本项只管"找靶"这一段；单候选点总上限见 shoot_timeout

    # ---- 越界急停保护（P0-3）----
    map_safety_margin: 0.60       # 信念位姿超出地图边界多少米即急停。防止里程计漂移后跑飞

    # ---- ★P1-1 漂移预算告警 ----
    #  每段航程结束都会把信念位姿锚回点位中心，段内漂移不会累积到下一段，
    #  所以"单段漂移"就是定位可信度的直接读数。到达判定阈值是 0.157m，
    #  单段漂移一旦逼近它，就会"越锚越偏"。默认 0.30m 留一倍余量。
    drift_warn_m: 0.30            # 单段位置漂移超过此值即告警(m)。结束横幅会汇总最大漂移

    # ---- 完成提示音 ----
    finish_voice_id: 0            # 全程跑完时通过 /voice_switch 播放的语音 ID。0 = 不播
                                  # ⚠️ 各 ID 对应哪句话没有实机依据 —— 先在车上跑
                                  #    tools/test_voice.sh 把 ID 试出来再填。
                                  #    底盘有"同一 ID 间隔不足 2s 不重播"的闸门，连播同一 ID 只会响一次。

    # ---- 路线（雷/通/靶 必须全覆盖，且不能踩到"障"）----
    #   挡板约束：第 6/7 行之间、D~N 列封死，只有 A/B/C 列能上下穿行
    #   ★★ 2026-10-11 第三次换图（p-81Zc2l/n11）：sim-operator t11 手工 v3（62 航点），
    #      route_check 0 error；@0.15/@0.30+A族 双档权威仿真全合规（盖雷 8/8、压靶 0、
    #      出场地车心 0.0cm）。无倒车段、无 :PIVOT；0.30 首发路线 ★★
    #   结构：N10 出发 → L11→K11 下半场穿洞向西 → 下区压雷(I7/D8/E10) → C7→C6 绕隔板
    #         西端进上区 → 压雷(C4/B2/F3) → F4* 停站打靶(E4+E5 纵向跨格板) → 压雷
    #         (G4/H2) → K1 上半场穿洞向东 → N5 终点
    #   ★★ 2026-10-14 官方贴图重掷版（队长代改）：config/map.yaml 换成官方图
    #      （源图 = 用户粘贴 map_official.png sha256 `273BA796…`；队长/感知线双独立识读逐格一致）。
    #      要素：雷 `C1 A3 E3 G4 / I6 B7 D9 H10`、障 `A1 E2 H4 D8 / I8 G9 B11 F11`、
    #      靶 `E5+F5`（横向相邻 = 一块 35×70 跨格板）、通口 `K9`(下半场) / `K5`(上半场)、
    #      起终 `N10`/`N5`、隔板 行 6/7 之间 `D~N` 无缺口（不变）。
    #   ★★ 本表 = 车上自规划（tracker-safe）在同一张图上的产物（2026-10-14 队长 `--plan-only` 实测）：
    #      54 token / 18.55 m / 0 折返 / 射击停站 `E4*` / K 穿越 2 次（`K9`、`K5`）。
    #   ★ 为什么必须换掉旧 60 点（2026-10-11 版第五张图手工路线）：它在官方重掷图上有
    #      **9 条 error**（R004 踩障 / R005 雷覆盖 4/8 / R006 靶覆盖 / R013 射击点距离），
    #      而 `planner.fallback_to_tokens: true` ⇒ 自规划失败时会拿它发车 ⇒
    #      兜底路线必须在当前图上合法（否则启动门禁未通过 = 不可发车）。
    #   ⚠ 足迹诊断（折线口径=保守上界）：靶板侵入 40mm @F4拐角(出)、挡板侵入 20mm @G5->G6 等；
    #      与 2026-10-11 版同类，门禁（route_check rc=0 / validate 0 error）已通过。
    #   ★★ t57（2026-10-15，t50/t57 联合裁决）：整表按「板心窗口 0.80±0.10 m」重新生成
    #      （= tracker-safe 引擎在本图上的真实产物，非手工编辑；依据类别 = GOT）。
    #      与旧 54 点的差异**不是"一个 token 改名"**，而是**整段 U 形绕行消失**：
    #        旧  … D1 D2 D3 **D4 E4* F4 F3 F2 F1 E1 D1 D2 D3** E3 F3  G3 …
    #        新  … D1 D2 D3                                    E3 F3* G3 …
    #      原因：旧停站点 `E4` 必须从 `D4` 进、再经 `F4→F3→F2→F1→E1→D1` 绕回来（一段 U 形），
    #      而 `F3` 正好落在 `D3→E3→F3→G3` 这条主线上 ⇒ 不需要绕行 ⇒ 54 → 44 token。
    #      射击停站点 token = **`F3*`**（到板心 0.7215 m ∈ [0.70,0.90]）。
    #      ⚠️ 不要手工只把 `E4*` 换成 `F3*`：那会产生 `D4→F3` 跨列跳点，R004/R011 必红。
    #      实测（雷 8/8、靶覆盖 2/2、射击点距离合规）见 `_tmp_session/t50_repin/impl.md` §A10。
    #   ★★ 卡 t6（2026-10-16）：**进洞前对正** —— 两处「洞口前 1 格 90° 拐弯」被消除。
    #      旧：… **M10 L10** L9 K9 …（L10 拐弯，距洞口仅 1 格）与 … H6 I6 **J6** J5 K5 …（J6 拐弯）。
    #      新：… **M10 M9** L9 K9 …（拐弯提前到 M9，进洞前有 2 格 = 0.70 m 直线对正段）
    #          与 … H6 I6 **I5** J5 K5 …（同上）。
    #      为什么必须改：真车 `R_min = 0.157/tan30° = 0.2719 m` **大于**洞口可用带宽半格
    #        0.175 m ⇒ 在洞口前 1 格起转的车，进洞瞬间车身仍是斜的（t5 实测摆正误差
    #        38~52°，最大穿透 56.7mm@K9 / 44.4mm@K5，`bridge_redundancy_steps` 246 拍）。
    #        拐弯顶点前移 1 格后，三档实测 **0 拍**，逐洞最小间隙 +0.0439 m@K9 / +0.0233 m@K5。
    #      ⚠️ 同长度同转角（44 点 / 15.05 m / 0 折返不变），只是拐弯顶点前移 ⇒ 雷 8/8、
    #        障 0 命中、`F3*` 停站、K9/K5 各直穿一次、隔板不触线**全部不变**。
    #      落盘口径 = 本表逐 token 等于 `planner.engine=tracker-safe` 在当前图上的产物
    #        （`test_corner_cut.py:145` 会断言"规划器产物 == 本表"）。
    #      证据：`artifacts/sim/t6_bridge_entry_align/final_verify.json`。
    #   ★★ 卡 t3（2026-10-16）：**射击停站点推远**（用户「再离远一点」）——
    #      第一版推到了板心 1.00 ± 0.11 m（`F2*`），**t3-A 裁决作废**，现役取次一档 `D3*`：
    #      旧（t57，板心 0.7215 m）：… D1 D2 **D3 E3 F3\*** G3 …
    #      现役（t3-A，板心 0.8750 m）：… D1 D2 **D3\* E3 F3** G3 …（44 点 / 15.05 m，**零绕行**）
    #      为什么 `D3` 恰好免费：`F3→G3` 这一段本来就存在，把停站星号从 `F3` 挪到主线上的
    #        `D3` 即可 ⇒ token 数与 t57 完全相同（44），只是停站提前两格。
    #      ✖ 为什么不用 `F2`（板心 1.0645 m，更远）：到站车头由 `D3→E3→F3→F2` 这条唯一可行
    #        进法决定 ⇒ 靶板落在**车尾 170.5°**，超出云台 `∓150°`（相对车头）⇒ 打不到。
    #      ✖ 为什么不用 `E8`/`F8`（板心同样 1.0645 m，且在下半场"顺路"）：它们在**隔板另一侧**，
    #        视线被 D~N 那堵连续墙挡住 ⇒ `planner.barrier_sight_blocked()` 把这类格剔出候选
    #        （`route_check`/`validate_route` 只查距离，不查墙，装不了这个错）。
    #      ⚠️ 雷 8/8、障 0 命中、靶板 0 压、`K9`/`K5` 各直穿一次、隔板不触线、0 折返**全部不变**。
    #      ⚠️ 同时保留 t6 的两处"进洞前对正"（`M10 M9` / `I6 I5`），见上一段。
    #      📌 历史档（`F2*` 50 点 / 17.15 m）证据留在 `artifacts/sim/t3_shoot_100/`；
    #        现役 `D3*` 44 点证据在 `artifacts/sim/t3_shoot_090_d3/`。
    mission_blocks:
      - N10
      - M10
      - M9
      - L9
      - K9
      - J9
      - J10
      - I10
      - H10
      - G10
      - F10
      - E10
      - E9
      - D9
      - C9
      - B9
      - B8
      - B7
      - B6
      - A6
      - A5
      - A4
      - A3
      - A2
      - B2
