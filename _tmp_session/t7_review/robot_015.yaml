# =============================================================================
#  ★ 新版决策层 dzbrain 的参数段（2026-10-07 新增）
# -----------------------------------------------------------------------------
#  为什么挂在 <节点名>: ros__parameters: 里：robot.yaml 会被 bringup.launch.py
#  当 params-file 喂给 C++ 节点，顶层**裸键**会让解析失败、三节点同时 abort
#  （readme【项目结构提示】）。所以新参数挂在 /dzbrain 段下，由 Config 展平成
#  `pursuit.wheelbase_m` 这样的点号键。
#
#  ★ 这里只列"需要现场调整/一眼看清"的键；其余键的默认值在
#    src/dzbrain/dzmain/core/config.py 的 SCHEMA 里（缺失会用显式默认值并记录）。
# =============================================================================
/dzbrain:
  ros__parameters:

    pursuit:
      wheelbase_m: 0.157              # 轴距（旧代码硬编码在 path_executor.py:629）
      max_steer_deg: 30.0             # 舵角限幅（底盘侧再 clamp）
      max_steer_rate_deg_s: 120.0     # ★新增：舵角速率限幅，防一帧跳 60°
      curvature_gain: 1.0             # 1.0=教科书式 δ=atan(2L·sinα/ld)；0.5=旧行为等价（分母口径略差 1.5%，见架构文档 4.2）
      lookahead_min_m: 0.36   # ★A族加固（t1/t4 双复核：@0.15 隔板 352→0 拍、盖雷 3/8→8/8；@0.30 零影响）。原 0.18，2026-10-11 G1 裁决随 0.30 巡航落地
      lookahead_max_m: 0.40   # ★ 1.2×0.30=0.36 > 旧上限 0.24/0.35 会被钳住 → 实测放到 0.40
      lookahead_k_v: 1.2              # 前视 = k_v × 速度
      lat_acc_max_mps2: 0.35          # 横向加速度上限（曲率限速）
      cruise_speed_mps: 0.15   # 实车自规划跑 0.35 提速档；原注释：★t38 提速档落地（t30 三档仿真 + t37 需求契约）：0.15 → 0.40；本轮实车暂回 0.15 安全档
                               #   依据：新图 60 token tracker-safe 路线双档/三档仿真 @0.40+斜坡 98.90 s，
                               #   比 @0.35 快 4.1%、比 @0.15 快 30.4%，且碰撞/硬违规/越界全 0（挡板余量档位无关，恒 +0.5 mm）
      # ★t38：速度剖面第 5 层「加减速斜坡」的两个限值（真源 = t30 `pursuit/controller.py:speed_profile()`）
      #   语义：升速每拍 ≤ accel_up·dt；降速每拍 ≤ accel_down·dt（0.40→0.12 仅需 0.255 s / 0.066 m ≪ 0.45 m 入弯窗口）。
      #   缺省 0.0 = 整层不参与（与旧版逐位一致，回归安全）；施加顺序：四层 min → ×quant → 斜坡 → min_speed → motion_limit（安全层最后）。
      accel_up_mps2: 0.0               # 升速上限 (m/s²)（t37 建议 0.6~0.8；★本轮实车发车档 0.0=斜坡层不参与，= t31 基线逐位一致；跑完恢复 0.70）
      accel_down_mps2: 0.0             # 降速上限 (m/s²)（t37 建议 1.0~1.2；★本轮实车发车档 0.0；跑完恢复 1.10）
      map_safety_margin_m: 0.60       # 越界急停余量（★新版提到状态机最顶层）
      drift_warn_m: 0.30              # 单段漂移告警
      drift_seg_gate_m: 0.18          # ★漂移判定用弧长窗口，不能绑在吸附半径上（否则永远报不出来）
      bridge_blocks: []  # ★2026-10-11 第三次换图:强制直行保护关闭(保护窗含 90° 拐锁错航向事故,见 path_executor 段注释);纯追踪+转角减速过洞
      align_straight_before: 2.0      # 洞前多少格开始锁航向
      align_straight_after: 1.0
      align_straight_speed_mps: 0.10
      align_kp: 12.0
      align_steer_limit_deg: 8.0

    route:
      # ★ U 形赛道两处穿洞的候选格（每局随机，由无人机情报选定；超时用 default）
      # ★ 2026-10-14 官方贴图重掷版：下半场通口 K9（旧 K10）、上半场 K5 不变
      cross_lower_candidates: ["K9"]
      cross_upper_candidates: ["K5"]
      # ★★ t31 收口：兜底穿洞格同步为新图通口（旧值 K11/K1 属第四张图，已失效）。
      #   为什么必须改：① `_default_cross()` 只在 default ∈ 候选集合时才用它，否则回落候选集合首元素
      #   ⇒ 旧值不会改路线，但会让 `Config.validate()` 报「兜底穿洞格不在候选集合里」warn、
      #   且 `main.py:200` 的开机横幅会把**错误的通口名**打给现场（横幅真源就是这两个键）；
      #   ② `test_bridge_gate` 把 `route.cross_lower_default` 当"本图下半场桥洞格"用。
      cross_lower_default: "K9"
      cross_upper_default: "K5"
      # ★★ 卡 t57（2026-10-15）：SHOOT 停站点从「靶格 1 格邻居」迁到「距**靶板中心** 0.80 ± 0.10 m」——
      #   靶板中心 = **各靶格中心之中点**（本图 E5+F5 ⇒ (2.2750, 3.1500) m；
      #   帧 = `geo.block_to_meters()`，一切距离都用它 + `math.hypot` 实算，禁手抄坐标）。
      #   旧口径（到**靶格** 0.20~0.45 m）在本图命中的 `E4` 到**板心**只有 **0.3913 m**（离板太近，
      #   车体几乎贴靶板）；新口径命中 `F3`（到板心 **0.7215 m**）。
      #   ⚠️ ★t57 落盘更正（原写"其余 53 个 token 一字不动"，**已证伪**）：规划器真实产物是
      #      **54 → 44 点** —— 旧 `E4` 停站必须从 `D4` 进、再经 `F4→F3→F2→F1→E1→D1→D2→D3` 绕回来
      #      （U 形绕行），而 `F3` 正好在 `D3→E3→F3→G3` 主线上 ⇒ 整段绕行消失。
      #      落盘口径 = `path_executor.mission_blocks` 同步换成规划的 44 点（见该键上方 ★t57 注释）。
      #   消费者：`route/planner.py:shoot_distance_window()`；这两键缺失时它会用**同值**常量
      #   （`planner.SHOOT_DISTANCE_M_DEFAULT/TOL_M_DEFAULT` = **0.90 / 0.12**）兜底
      #   ⇒ 显式写出来只为"现场一眼可见、可徒手改"；改值必须两处同改（`test_planner` 会钉）。
      #   ⚠️ 与 `path_executor.shoot_distance_target/min/max`（**0.35 / 0.78 / 1.02**，靶格级判据，
      #      同段 ★t3 注释）是两套不同语义：那三键管"哪一帧算打中/门禁怎么判"，本两键管"**车停哪儿**"。
      #      本次两者**取值同向**（板心 0.875 ⇒ 靶格心 0.783~0.990），但**不要互相抄值**。
      # ★★ 卡 t3（2026-10-16，用户指令「最佳射击点再离远一点」）：0.80 ± 0.10 → 1.00 ± 0.11（`F2*`）。
      #   —— **该档已被 t3-A 裁决作废**，原文保留以便追溯（详见下方 ★t3-A）。
      #   为什么当时半宽是 0.11 而不是 0.10（**判定实验结论，不是随手放水**）：
      #     0.35 m 网格上，板心 1.00 m 附近**可达且在同侧**的格心距离只有 **1.0645 m**（`F2`/`E8`/`F8`）。
      #     `E8`/`F8` 在隔板另一侧 ⇒ 已被 `planner.barrier_sight_blocked()` 剔除（视线被挡）。
      #     严格写 ±0.10 ⇒ `[0.90,1.10]` 里 `F2` 的**逐格覆盖**判据差 **6.8 mm**（到 `E5` = 1.1068 m）
      #     ⇒ `covering_stops()` 判"覆盖不全" ⇒ `PlannerError` ⇒ `fallback_to_tokens` 回退旧路线。
      #   ✖ **t3-A 裁决（2026-10-16，队长）：1.00 档是几何死结 ⇒ 退一档到 `D3`。**
      #     `F2` 的到站车头朝「行号减小」，靶板落在**车尾 170.5°**；云台扫描
      #     `scan_yaw_min/max = ∓150°`（**相对车头**）⇒ 该角度扫不到。
      #     同侧且视线不挡的 1.0 m 格心只有 `F2`（`E8`/`F8` 已被视线判据剔除）⇒
      #     **"1.00 m 停站"与"云台看得见靶"在本图上不可同时成立**。
      #   ✔ 现役：**0.90 ± 0.12**（`[0.78,1.02]`）⇒ 停站 `D3`，板心 **0.8750 m**、
      #     到靶方向偏离车头 **36.9°**（充裕）、零绕行（44 token / 15.05 m）、雷 8/8。
      #     比旧 0.80 档（板心 0.7215 m）仍远 **+21%**；比作废的 1.00 档近 0.19 m。
      #   📌 现场如需回切 1.00 档：本两键 1.00 / 0.11 + `path_executor` 窗口 1.00/1.15 +
      #     `mission_blocks` 换回 `F2*` 50 点版（证据在 `artifacts/sim/t3_shoot_100/`）。
      shoot_distance_m: 0.90          # 停站点 → **靶板中心** 的目标距离（现场卷尺标定值）
      shoot_distance_tol_m: 0.12      # 窗口半宽 ⇒ 候选区间 [0.78, 1.02]（靶板行走/标定误差都吃在这里）

    # ★★ 卡 t4：桥洞**进洞侧冗余长度**（虚拟墙延长，**现实不存在**的设计冗余）。
    #   设计规格（用户 2026-10-16）：只加进洞侧，长度 = 1/4 格 = 0.35 × 0.25 = 0.0875 m。
    #   用途：把桥室南北壁沿 y 向进洞侧虚拟延长，逼规划器让车"进洞前 1/4 格内已摆正"。
    #   几何真源：`route/physics.py: bridge_entry_walls()`（按 row 判进洞侧 —— row 7~11 向西、
    #     row 1~6 向东，与 `path_executor.bridge_order` 同一次改动内一致）。
    #   判据消费者：`route/planner.py` 的 tracker-safe 引擎 `_TSGrid`（段级 `entry_gate_segment`
    #     + 顶点级 `entry_gate_turn`），兜底常量 `planner.BRIDGE_ENTRY_REDUNDANCY_M` 与本值同值。
    #   ⚠️ 只影响**规划**：`tools/route_check.py` 的用户侧判据刻意**不含**这段墙（否则现场
    #      实跑路线会被莫须有的墙判红）。`0.0` = 关闭该冗余（回到 t4 之前的行为）。
    field:
      bridge_entry_redundancy_m: 0.0875

    mission:
      auto_start: true   # 实车自规划跑：一键启动后自动出发
      auto_start_delay_s: 10.0   # 实车：等 10s 即发车；原注释：★t29 首跑档：给队长留横幅核对窗口（旧值 2.0；SCHEMA 类型 float，必须写 45.0）
      reset: "N10,y"
      scan_mode: continuous           # ★t24：lock 模式下 **inert**（见下方注释）；readme【十】：绝不在到点发 1 降级成单次
      # ★★ t26（2026-10-11 用户指令 4）：最佳射击点**离站条件**改为
      #   「发数增量 ≥ 10（打完全部弹药）**或** 到站起 30s 硬死线，两者先到即离站；
      #     即使 0 发，30s 到点也必须离站」。三段式结构（SETTLE→ACQUIRE→FIRE→DONE）与
      #   各自的段超时链**不变**，只在它们之上加一条到站级死线（`mission.py: _stop_deadline_s`）。
      #   ★旧值溯源：`shots_per_stop: 3` 是第九趟实车"到站打 3 发"口径；第十一趟实车 F4 停站
      #   日志为「到站（累计发数 0）→ 锁定超时 6.10s ≥ 6.00s → 放弃」，即**0 发**也要占满三段。
      shots_per_stop: 10              # ★t26：3 → 10（打完十发即完成离站；旧值 3 见上方注释）
      shoot_timeout_s: 30.0           # ★2026-10-11 用户指令:最佳射击点停留射击最长 30s(快速采集 30→10 改回 30)
                                      # ★t26：**值保持 30.0 不动**，但口径变为"**到站起**累计硬死线"
                                      #   （旧实现只从 FIRE 段计时：SETTLE 12s + ACQUIRE 6s + FIRE 30s
                                      #   = 最长 48s，与"到站 30s"不符）。0 发也必须在 30s 离站。
      # ★★ 卡 t24 口径：本行在 `aim.gimbal_lock_enabled=true`（默认）下 **inert** ——
      #   云台扫描开关由 AimTask 独家下发（巡迹段 0 锁止 / 最佳射击点停站 2 起转 / 离开与 FINISH 回 0），
      #   MissionTask 一个值都不发。run11 曾出现「Mission 的 2 在巡迹全程压住 Aim 的 0（C++ 是电平保持语义）
      #   ⇒ 云台一直在转」，就是这里被发出去造成的。要让本行重新生效，需显式把
      #   `aim.gimbal_lock_enabled` 设为 false（旧行为/对照档）。
      lock_timeout_s: 6.0             # ★2026-10-11 快速采集:18→6
      settle_time_s: 0.4              # ★2026-10-11 快速采集:0.8→0.4
      bridge_info_wait_s: 2.0         # ★2026-10-11 快速采集:20→2 等无人机桥洞情报的最长时间

    # ---- ★车上自动规划（任务卡 B）：启动时自己读地图算路线 ----
    #   与 route:/mission: 同级同缩进（4 空格）→ 点号键 planner.*
    #   对应实现：tasks/mission.py 的 `_load_startup_route` / `plan_route_from_config`
    planner:
      # ---- ★★ 规划引擎（卡 t11：t7 新引擎"可选上车"，默认行为不变）----
      #   tour          = 历史引擎（`planner.plan_route`：顺序+朝向联合优化，用 `:PIVOT`
      #                   消解 180° 折返）。**默认值 = 与历史逐字节一致**。
      #   tracker-safe  = t7 新引擎（`planner.plan_route_tracker_safe`：禁 180°/禁紧凑 U/
      #                   雷直线穿心）。现役图实测 62 token / 21.35 m，与手工 62 点同长；
      #                   双档仿真 RMS/MAX/超调 ≤1.2×手工、盖雷 8/8、碰撞 0、`:PIVOT` 0 处
      #                   （证据见 `_tmp_session/t7/报告.md` §3）。
      #   ★ 只有 tracker-safe 会跑**双门禁**（`tools/route_check.py` 0 error +
      #     `route.validate_route` 0 error/0 warn）；门禁不过 → 按 `fallback_to_tokens`
      #     回退 `route.tokens`（现役手工 62 点）并在日志里打印原因。
      #     tour **不加门禁**：它的历史行为（含"缺 mines 的图也能解"这类既有语义）必须逐字不变。
      engine: tracker-safe  # ★t29：**第五张图专用**（用户指定「用车上自己有的路径规划器跑路线生成」）；
                            #   tracker-safe 会跑双门禁（tools/route_check.py 0 error + route.validate_route 0 error/0 warn），
                            #   不过则按 planner.fallback_to_tokens 回退 route.tokens。
                            #   旧注释（第七趟用户指令，J7 现场量测车头最前缘→挡板南表面 = 3.5 cm ≥ 2 cm 门槛）保留在案
      # 足迹诊断（参考点偏移感知：挡板/障碍/靶板）在门禁里的严重级：
      #   warn  = 只报不拦（**默认**：t11 实测 +7.5cm 下现役手工路线与 tracker-safe
      #           路线在 J8→J7→I7 拐角都报 5 mm 级侵入，而第三张图实跑 61/61 未触板
      #           ⇒ 折线口径在拐角处过于保守，不能据此硬拦现役路线）；
      #   error = 有侵入即判门禁未过（新引擎会按 fallback_to_tokens 回退）。
      # 现场核实挡板实际位置/宽度后：若确认余量够，保持 warn 并放行 tracker-safe；
      # 若确认真的会蹭板，改成 error 并把下半场 corridor 的走法改掉。
      footprint_gate: warn
      # tracker-safe 的时间预算（秒）。**刻意不与 max_seconds 共用**：新引擎状态空间多一维
      # （格×本腿方向×上一腿方向）、且要遍历"覆盖全部靶格"的射击点候选 —— 本机(PC)实测
      # 1.59~1.67 s，沿用 2.0 s 只剩 0.3 s 余量，正是 t8 那次 flake 的形态（旧引擎本机
      # 0.55 s 在 0.8 s 预算下都会超时）。缺省 = planner.TS_MAX_SECONDS（与本键同值）。
      # ★ 2026-10-11 第八趟(用户指令重跑):第七趟实车 5.0s 在 ARM 板上超时(顺序搜索阶段)
      #   → 回退手工 62 点。当时暂放宽到 20.0 让新引擎在车上真跑通。
      # ★★ t19 按**车端实测**重定（本键就是车上的唯一真源）：
      #   车端 RK3588S(8 核)同一份地图/配置，`plan_route_tracker_safe` 中位耗时
      #     提速前 **6693 ms**（settled 470118，`_ts_phase` 16 次）
      #     提速后 **2788 ms**（settled 200811，`_ts_phase` 5 次）⇒ 2.40×
      #   取值规则 = max(实测中位 × 3, 实测中位 + 5 s) = max(8.36, 7.79) ⇒ **10.0 s**
      #   （20.0 是超时应急值，会白等 17 s；5.0 是 PC 时代值，第七趟实车证明不够）。
      #   证据与方法：`_tmp_session/t19/`（ARM 探针走 ssh stdin、内存补丁，车端零落盘）。
      tracker_max_seconds: 10.0
      auto_plan_enabled: true         # ★ 2026-10-11 第七趟(用户指令):只给地图参数,路线由车上
                                      #   tracker-safe 引擎现算(t11 双门禁 + t13 起始航向 +y 已落地;
                                      #   J7 挡板现场量测 3.5cm ≥ 2cm ⇒ 放行)。失败时按
                                      #   fallback_to_tokens 回退 mission_blocks 手工 62 点(同一路线)。
      map_path: "config/map.yaml"     # 解析顺序：绝对路径 → 相对配置文件目录 → 相对工作区
                                      # ★ 2026-10-11 t3:换图就是**覆盖这个文件**(第四张图识图版),
                                      #   所有消费方(route_check/planner/sim/config_selfcheck)按此名查找
      fallback_to_tokens: true        # 规划失败（PlannerError/超时/坏图）→ warn 后回退 route.tokens，仍出发
      allow_reverse: false            # ★真车底盘不支持倒车 → 规划器走无倒车模式（0 段 R:，折返交 PIVOT）
      max_seconds: 2.0                # 规划时间预算；超出抛 PlannerError → 走上面的回退分支
      pivot_penalty: 5.0              # ★ 折返惩罚/处；与 mission_blocks 生成参数一致（--pivot-penalty 5），
      mine_turn_penalty: 2.0           # ★ 雷格不得作拐点（车心必须压过雷心；0=关闭）
                                      #   使车上自动规划产出 G10* 版路线（19.95 m）= 仿真/bench 验证的同一版
      obstacle_margin_m: 0.02          # ★t22 物理几何：障碍净空余量（判据 = 柱半径 0.1275 + 车半宽 0.0675
                                      #   [顶点用扫掠半径 0.1554] + 此值；见 dzbrain/route/physics.py）
      # ★★ 卡 t6：**桥洞进洞前对正**惩罚（米）。触发形态：转弯顶点 = 桥洞格的前一格，
      #   且该转弯**直接通向桥洞格** ⇒ 就是"洞口前 1 格做 90° 拐弯"，按本值加罚，
      #   驱动 A* 把拐弯顶点前移 1 格（进洞前留出 ≥2 格 = 0.70 m > R_min 0.272 m 直线段）。
      #   为什么必须（t5 判定性结论，docs/仿真复验_桥洞冗余墙_t5.md §4）：
      #     真车 R_min = 0.157/tan30° = 0.2719 m **大于**洞口可用带宽 0.175 m ⇒ 洞口前 1 格
      #     起转的车进洞瞬间车身仍斜（实测摆正误差 38~52°），车体角点斜插冗余带
      #     （最大穿透 56.7mm@K9 / 44.4mm@K5，bridge_redundancy_steps 246 拍）。
      #     拐弯顶点前移 1 格后三档实测 **0 拍**（最小间隙 +0.0439m@K9 / +0.0233m@K5）。
      #   ⚠️ 用**惩罚**而非硬禁：惩罚不可能造成无解，这对"只换地图就能自动生成路线"是硬要求。
      #   ⚠️ 本键**故意注释掉**，生效值 = planner.py 的 `BRIDGE_APPROACH_ALIGN_PENALTY_M`(=2.0,
      #      经 `_phys_params` 的 `g(键, 常量)` 兜底，与写成键**逐 token 同解**，已实测)。
      #      原因：core/config.py 的 SCHEMA 不在本卡写域 ⇒ 写成真键会多一条 `未知配置段` 告警，
      #      且 test_autoplan 8.4 硬钉"planner 段恰好 11 个键"⇒ 会多 1 个红。
      #      若现场要能徒手调：需同步在 config.py SCHEMA 登记 + 把该测试的键数改 12（均非本卡写域）。
      # bridge_approach_align_penalty_m: 2.0

    aim:
      # ★★ 卡 t24：云台扫描**单写者**四键（已登记进 core/config.py 的 SCHEMA；此处注释形式
      #    给出显式配置位置，值就是 SCHEMA 默认值 —— 不写进 YAML 也生效，写进 YAML 仅便于现场调）。
      #    语义：lock=true（默认）时**只有 AimTask 写** /nav/scan_request
      #      · 巡迹段（射击点之前）/ 离开射击点之后 / FINISH → 0（停扫；车端 C++ 进 AIM_IDLE
      #        后每帧主动归位到"车头正前 + 基准俯仰" ⇒ 用户要求的"回正并保持"）
      #      · 进入 StopKind.SHOOT 停站（最佳射击点）→ 2（持续扫描 = 起转寻靶）
      #      · TRACK→锁止 的**边沿**会再发一次 0（保证从目标方向显式回正，不被去重吞掉）
      #    lock=false 时回到旧行为：由 MissionTask 按 `mission.scan_mode` 下发（现场对照用）。
      # gimbal_lock_enabled: true          # ← 默认 true；设 false 可回退旧行为（Mission 发）
      # gimbal_lock_scan_request: 0        # 锁止值（0=停扫；车端收到即归位）
      # gimbal_seek_scan_request: 2        # 起转值（2=持续扫描；绝不发 1）
      # gimbal_seek_on_shoot_stop_only: true   # 只在 SHOOT 停站起转
      # ★ 移动轨道靶（F11+G11 一块跨格靶板，轨道行程 0.70m，4cm/s，无停顿来回；2026-10-11 换图）
      lead_time_s: 0.0                # ★t53 打靶修复（用户裁决）：先归零让 pred=dx 直接瞄准（链路真实延迟 0.5~0.9s，旧 0.35 写小一倍致 pred 系统性偏移）；验证"能打出去"后再逐步回标
      fire_policy: moving_lead        # moving_lead / sweep / turnaround（本靶无端点停顿，turnaround 不适用）
      rail_span_m: 0.70
      target_speed_mps: 0.04
      # ★★ 全链路最关键、也最容易搞错的一个标定值：轨道方向上的"像素/米"。
      #   用途：把视觉像素误差换算成轨道上的米（提前量、命中判据都依赖它）。
      #   标定方法（现场 1 分钟）：把靶放在轨道一端记下画面 dx，再放到另一端记下 dx，
      #       则 px_per_m_rail = |Δdx| / rail_span_m(0.70)。默认 140 px/m 只是估值。
      #   自检：4 cm/s 的靶在 140 px/m 下约 5.6 px/s ⇒ 30fps 每帧仅动 0.19 px（很慢，符合现场描述）。
      px_per_m_rail: 140.0
      max_shots_total: 10             # ★t26 保持 10（全程弹药硬上限，不动）
      # ★ t26（用户指令 4）：3 → **10** —— 允许对同一目标打满剩余弹药（配合 mission 侧
      #   "发数增量满 10 即离站"）。旧值 3 的溯源见本文件上方 `dzrknn_dataprocess` 段的同名键。
      max_shots_per_target: 10
      shot_cooldown_ms: 500
      lost_frames_to_rescan: 60       # ★旧值 180 帧≈6s，丢靶期间云台会冻结；这里收紧
      scan_pitch_offset_deg: +10.0    # ★t52 与 /dzrknn_dataprocess 段对齐为 +10.0（★2026-10-15 现场实测：+ 才向下压、
                                      #   用户 2026-10-14 指令"水平扫描时视角向下压约 10°"）。
                                      #   此键在 dzbrain 中无消费者（仅 schema 登记），真源是 dzrknn 段；对齐只为杜绝口径歧义。

    fix:
      anchor_at_waypoint: true        # 到位吸附（格心锚定）
      scale_est_enabled: true         # 系统性比例误差在线估计

    # --------------------------------------------------------------------- #
    #  ★ 实车漂移修复（卡 t12）的 12 个参数（卡 t20 并入，2026-10-11）
    #    写侧：tasks/localization.py（吸附/重锚/漂移护栏/边界护栏）
    #    读侧：pursuit/controller.py 读黑板键 motion_limit（契约见 core/blackboard.py）
    #    值 = t12 报告 §T12-B 的**代码默认值**（逐条核对，不放大不收紧）；
    #    ⚠️ 代码里还有 `or <默认>` 兜底，所以这些键缺失也不会崩 —— 显式写出来是为了
    #       "现场一眼可见、可调"，并且 test_motion_limit.py §5 会断言二者逐条相等。
    # --------------------------------------------------------------------- #
    localization:
      anchor_max_pull_m: 0.12           # 单次吸附位移上限（默认 = pursuit.arrival_m，双保险）
      anchor_reject_eps_m: 0.005        # "吸附后离折线不变远"的容差
      anchor_scale_max: 0.08            # 隐含尺度误差判别上限（仅判别，不改标定值）
      implied_scale_window: 4           # 尺度/沿程修正量统计窗口（拍）
      reanchor_pull_max_m: 0.35         # 横向重锚单次上限（且只在顶点窗口内）
      drift_slow_after: 999             # ★2026-10-11 快速采集(用户指令):3→999 解除"漂移降速"门禁(只告警不降速)
      drift_slow_speed_mps: 0.08        # 降速目标（经 motion_limit 下发给执行侧）
      drift_stop_after: 999             # ★2026-10-11 快速采集(用户指令):8→999 解除"漂移停车"门禁(只告警不停车)
      drift_clear_ticks: 5              # 连续干净 N 拍 → 撤销降速/停车
      boundary_guard_m: 0.10            # 离安全边界多近开始限速
      boundary_guard_speed_mps: 0.08    # 边界限速值
      boundary_stop_m: 0.03             # 离安全边界多近请求停车
      # ★横向漂移补偿(2026-10-11 两点插值:trim=0→右漂10cm/3.86m=+1.48°;
      #   trim=-1.4→左漂3.5cm/1.05m=-1.91° ⇒ 线性零点 -1.4×1.48/(1.48+1.91)=-0.61° ⇒ 取 -0.6)
      #   车右漂 → 物理前进方向比陀螺读数偏右 ⇒ 信念 yaw 减去该角,控制器见信念偏右
      #   即左打舵,物理车头左旋抵消横漂。符号反了就把正负号翻过来。0=关闭。重启生效。
      yaw_trim_deg: -0.6

    drone:
      enabled: true
      heartbeat_timeout_s: 3.0
      info_stale_s: 30.0

    safety:
      pose_timeout_s: 1.5             # ★2026-10-11 快速采集:1.0→1.5 减启动期误刹(t27 锁存现象)
      task_stall_s: 1.5               # ★2026-10-11 快速采集:1.0→1.5
      startup_grace_s: 8.0            # ★2026-10-11 快速采集:3→8 吸收启动抖动(冷启动宽限)
      brake_on_fault: true


# =============================================================================
#  ★ 底盘（C2：2026-10-03 接入配置中心）
#     以前这些参数写在 dzactuator/launch/bringup.launch.py 里，通过
#     LaunchConfiguration 传进节点 —— 传的是【字符串】，而节点 declare 的是
#     double/int，类型对不上就静默回落到节点内置默认值。
#     现在统一放这里，由 bringup.launch.py 直接把本文件当 params-file 喂进去。
# =============================================================================
/dzactuator:
  ros__parameters:
    # ---- 串口 ----
    serial_port_name: "/dev/dzactuator"   # ★udev 符号链接，比 /dev/ttyUSBX 稳定(插拔不变)
    serial_baud_rate: 115200

    # ---- 坐标系名（改名会牵动 TF/话题，一般不动）----
    odom_frame_id: "odom"
    robot_frame_id: "base_link"
    gyro_frame_id: "imu_link"

    # ---- ★★ 底盘标定（C1：这两个值错了，里程计就是错的）----
    #  calibrate_lineSpeed：1 = 直接用轮速计原始值；0 = 用下面两个标定值换算（默认 0）
    calibrate_lineSpeed: 0
    #  ticksPerMeter —— 直行 1 米对应的编码器计数（决定平移里程精度）。
    #  标定方法：把车放在场地直线段，遥控低速直行 6 格（6×0.35=2.10m），
    #            读出编码器计数增量 N，则 ticksPerMeter = N / 2.10。
    #  验收标准：走完 2.10m 后 /odom/localization 的位移应≈2.10m，误差 <3% 即可用。
    #  ★★★ 2026-10-11 实车直线标定修正：2776.0 → 3280.0 ★★★
    #   实测（本血统·车端 N10→A10 直线 4.55 m / 13 段 / 0.15 m/s）：
    #   信念跑满 4.55 m 判 FINISH 时，车实际只走了 3.86 m（停 C10 内，距 A10 中心 69 cm）
    #   ⇒ 信念虚增 17.9% ⇒ 正确值 = 2776 × 4.55/3.86 = 3272。
    #   佐证：v1 旧核历史标定 3290（按 3290 预测欠程 71 cm，与实测 69 cm 仅差 2 cm）。
    #   3272(实测) 与 3290(v1) 都在卷尺 ±2 cm 误差带内 ⇒ 取中值 3280.0。
    #   复验标准：同一直线重跑，停位距 A10 中心 ≤4 cm；仍欠程则按实测比再修一次。
    ticksPerMeter: 3280.0
    #  ticksPer2PI —— 原地转满一整圈(360°)对应的编码器计数（直接决定航向精度）。
    #  ★★★ 2026-10-11 第二次修正：2723.0 → 2680.0（用户现场指令）★★★
    #   依据（用户口径）：插值预测的尺度 scale ≈ 0.97 ⇒ 物理真值 ≈ 2723 × 0.97 ≈ 2641~2680 区间；
    #     取 2680（保守一侧）。
    #   ⚠️ 风险（如实记录，待实车仲裁）：scale≈0.97 意味着"按 2680 换算出的航向增量比物理偏大 ~3%"，
    #     而**到位吸附会拒收**（观测与预测差超阈就不修正）⇒ 若实车出现"转完对不上、吸附不生效"，
    #     按下面流程二分：先回 2723 复跑一趟 → 若明显变好则说明 2680 过冲 → 取中间值再试。
    #   几何等价轮距 = 2680/(2π×3280) = 0.130 m（yaw 通道独立常数，与 ticksPerMeter 不必同源）。
    ticksPer2PI: 2680.0

    # ---- ★物理几何（t22：用户 2026-10-11 现场口径；公式在 dzbrain/route/physics.py）----
    vehicle:
      length_m: 0.28            # 车体长（沿车头方向）
      width_m: 0.135            # 车体宽（半宽 0.0675 进挡板/障碍判据）
      coverage_radius_m: 0.035  # ★车心假设圆半径（压雷判据：车心到 0.12×0.12 垫片 ≤ 此值算压到）
      # ★★ 卡 t11：参考点(后轴中心) → 车体**几何中心**的纵向偏移（米）。
      #   实测来源（用户现场卷尺，2026-10-11）：后轴中心→车尾沿 6.5 cm、
      #   后轴中心→车头沿 21.5 cm、车身总长 28 cm
      #   ⇒ 中心在参考点前方 (21.5 − 6.5)/2 = **+7.5 cm**。
      #   约定：**正值 = 车体中心在参考点前方**；参考点 = 里程计/仿真积分点
      #   （`dzactuator.cpp` 与 `tools/sim.py: step_bicycle` 都按后轴式积分 `X += v·cos(yaw)`）。
      #   消费者：`route/physics.py` 的 `body_corners()/body_*_clearance_m()`（净空唯一真源）、
      #   规划门禁的足迹诊断（`tasks/mission.py`）、离线足迹链（`_tmp_session/t5_bold/t5lib.py`）。
      #   ⚠️ t11 实测：把该偏移计入后，**现役手工 62 点与 tracker-safe 62 点**在下半场
      #      `J8→J7→I7` 的拐角切内处（真值 yaw≈45°、车体角点朝挡板）从"+7.6 mm 余量"
      #      变成 **−5.2 mm 侵入（35~38 拍）** ⇒ 挡板几何必须在现场复核后才能放行新引擎。
      ref_offset_m: 0.075
    field:
      obstacle_radius_m: 0.1275 # 障碍圆柱半径（柱心在障碍格格心）
      mine_pad_m: 0.12          # 雷垫片边长（0.12×0.12 正方形，中心在雷格格心）
      barrier_width_m: 0.02     # 挡板厚度（第 6/7 行之间、D..N 列的细条；半厚 0.01）
      barrier_cols: "D..N"      # 挡板覆盖列（含两端 = 11 列 = 3.85 m）

    # ---- 抖动抑制窗口（调试期先别动）----
    smooth_window_speed: 20
    smooth_window_angle: 5
